# CGA-Bench NeurIPS Rebuttal Pre-Registration (v1)
#
# Purpose: Commit endpoints, thresholds, and interpretation criteria BEFORE running any
# experiment. The SHA-256 hash at the bottom is computed over the bytes of this file with
# the `hash:` value replaced by the literal string "<TBD>", so the hash itself is part of
# the committed artifact but is computed deterministically after finalizing the content.
#
# Sources:
#   - docs/attack_gap_exp_exp/260420_defense_exp.md (E-R1..E-R14 rebuttal-window plan)
#   - docs/attack_gap_exp_exp/260420_defense_exp_add.md (expanded CRES suite)
#
# Status legend:
#   PASS-COMPLETE : observed result meets WIN criterion
#   WARN-COMPLETE : observed result marginal (SURVIVE)
#   FAIL-COMPLETE : observed result below threshold (honest negative)
#   PENDING       : experiment not yet run
#
# Interpretation matrix is pre-committed: we report the observed outcome against the
# pre-registered thresholds regardless of sign.

version: 1
schema: "cga-bench/rebuttal-preregister/v1"
created_utc: "2026-04-20T07:50:47Z"
author_entity: "CGA-Bench Defense Authors (anonymized for NeurIPS)"
scope: "All rebuttal experiments referenced in 260420_defense_exp*.md"

experiments:

  # ---------------------------------------------------------------------------
  # Layer 1 — Circularity defense (FATAL-1)
  # ---------------------------------------------------------------------------

  cres_1a_tcc_free:
    layer: 1
    defense_target: "FATAL-1 circularity (TCC self-scores its own catalogue)"
    tier: B
    status: PENDING
    endpoint: "Cohen's kappa between TCC and catalogue-free LLM judge; WITHIN detection rate"
    n_episodes_full: 16944
    n_episodes_pilot: 500
    evaluator_model: "openai/gpt-4o"
    catalogue_access: "raw_guideline_text_only"
    thresholds:
      win:
        kappa_gte: 0.65
        within_detection_gte: 0.60
      survive:
        kappa_range: [0.45, 0.65]
      fail:
        kappa_lt: 0.45
    prompt_version: "tcc_free_v1.txt"
    prompt_hash_sha256: "PENDING_COMMIT_AFTER_SCAFFOLD"
    budget_usd_estimate: 6000

  cres_1b_tcc_ltl:
    layer: 1
    defense_target: "FATAL-1 circularity — formalism invariance"
    tier: B
    status: PENDING
    endpoint: "Cohen's kappa between TCC and LTL/SPOT formal verifier"
    n_episodes_full: 16944
    thresholds:
      win: { kappa_gte: 0.70 }
      survive: { kappa_range: [0.50, 0.70] }
      fail: { kappa_lt: 0.50 }
    spec_author_mode: "clinical-informatics grad students OR parsing-rule extracted"
    spec_file_hash_sha256: "PENDING_WHEN_SPECS_AUTHORED"
    budget_usd_estimate: 4000

  cres_1c_catalogue_perturbation:
    layer: 1
    defense_target: "FATAL-1 circularity — content invariance"
    tier: A
    status: PASS-COMPLETE
    endpoint: "Median trace-level verdict agreement across N perturbed catalogues"
    thresholds:
      win: { median_agreement_gte: 85.0 }
    observed:
      median_agreement: 100.0
      mean_agreement: 91.8
      q25_agreement: 94.0
      q75_agreement: 100.0
      n_perturbations: 200
      n_sampled_traces: 2000
    evidence_path: "evidence_pack/cres_1c/cres_1c_results.json"

  cres_1d_feature_classifier:
    layer: 1
    defense_target: "FATAL-1 circularity — catalogue-free structural prediction"
    tier: A
    status: WARN-COMPLETE
    endpoint: "5-fold CV AUC predicting TCC verdict from 59 catalogue-free structural features"
    thresholds:
      win: { full_auc_gte: 0.85, asc_gap_auc_gte: 0.10 }
      survive: { full_auc_range: [0.75, 0.85] }
    observed:
      full_auc_mean: 1.000
      full_auc_std: 0.000
      asc_only_auc_mean: 0.947
      delta_auc_point_estimate: 0.053
      delta_auc_ci_95: [0.040, 0.045]
      n_features: 59
      n_asc_features: 5
      n_episodes: 14826
      notes: "Full AUC=1.0 is flagged WARN (too-good) for manual inspection of leakage between features and TCC label."
    evidence_path: "evidence_pack/cres_1d/cres_1d_results.json"

  cres_1e_counterfactual:
    layer: 1
    defense_target: "FATAL-1 circularity — negative control"
    tier: A
    status: PASS-COMPLETE
    endpoint: "All-4-evaluator simultaneous agreement rate under inverted catalogue semantics"
    thresholds:
      win: { all_evaluators_agreement_lte: 0.60 }
    observed:
      all_evaluators_simultaneous_agreement_rate: 0.0
      correct_all_pass_rate: 0.1242
      wrong_all_pass_rate: 0.0484
      per_evaluator_cohen_kappa:
        ac_proxy_inverted: -0.6084
        mab_proxy_inverted: -0.9084
        c2_inverted: -0.8628
        cga_inverted: -0.9979
      scrambled_timing_agreement: 0.1121
    evidence_path: "evidence_pack/cres_1e/cres_1e_results.json"

  # ---------------------------------------------------------------------------
  # Layer 2 — Real-patient evidence (FATAL-2)
  # ---------------------------------------------------------------------------

  cres_2a_mimic_retrospective:
    layer: 2
    defense_target: "FATAL-2 real-patient evidence"
    tier: C
    status: PENDING
    endpoint: "Standardized beta of TCC_violation_count on 6h lactate clearance"
    n_patients: 1000
    cohort_source: "MIMIC-IV v3.0, Sepsis-3 criteria, first ICU admission"
    cohort_sql_hash_sha256: "PENDING_AFTER_SQL_FROZEN"
    thresholds:
      win:
        beta_tcc_lactate_lte: -0.08
        p_value_lt: 0.01
        asc_beta_weaker_than_tcc: true
      survive: { beta_tcc_lactate_range: [-0.08, -0.03] }
      fail: { beta_tcc_lactate_gte: -0.03 }
    secondary_endpoints: ["28-day mortality OR", "ICU LOS"]
    blockers: ["PhysioNet credentialed researcher", "IRB-exempt letter on file"]

  cres_2b_eicu_replication:
    layer: 2
    defense_target: "FATAL-2 external cohort validity"
    tier: C
    status: PENDING
    endpoint: "Same as CRES-2A on eICU-CRD top-10 hospitals"
    n_patients: 1000
    thresholds: { win: "CRES-2A result replicates at p<0.05 in pooled model" }

  cres_2c_case_reports:
    layer: 2
    defense_target: "FATAL-2 real-error detection"
    tier: C
    status: PENDING
    endpoint: "Per-evaluator F1 on 300 published case reports with expert-labeled errors"
    n_cases: 300
    sources: ["JAMA Case Challenges", "NEJM Case Records", "AHRQ Web M&M"]
    thresholds:
      win: { tcc_f1_gte: 0.65, tcc_over_asc_f1_ratio_gte: 2.0 }
    budget_usd_estimate: 2500

  cres_2d_distribution_anchoring:
    layer: 2
    defense_target: "FATAL-2 distributional similarity"
    tier: C
    status: PENDING
    endpoint: "Feature-wise KS distance and Bonferroni-corrected p-values on 150 features"
    n_features: 150
    thresholds:
      win:
        median_ks_distance_lt: 0.10
        frac_features_with_p_gt_alpha_gte: 0.80
        alpha: 0.05
        correction: "bonferroni_150"

  cres_2e_domain_adaptation:
    layer: 2
    defense_target: "FATAL-2 structural transfer"
    tier: C
    status: PENDING
    endpoint: "Cross-domain classifier AUC (engine-trained → MIMIC test)"
    thresholds: { win: { cross_domain_auc_gte: 0.75 } }

  cres_2f_process_mining:
    layer: 2
    defense_target: "FATAL-2 process-level correspondence"
    tier: C
    status: PENDING
    endpoint: "Graph edit distance similarity + cross-fitness (pm4py)"
    thresholds:
      win: { structural_similarity_gte: 0.60, cross_fitness_gte: 0.70 }

  # ---------------------------------------------------------------------------
  # Layer 3 — Remaining attacks (FATAL-3..MAJOR-14)
  # ---------------------------------------------------------------------------

  cres_3_native_replay:
    layer: 3
    defense_target: "FATAL-3 straw-man evaluator (MedAgentBench, AgentClinic, AMEGA)"
    tier: B
    status: PENDING
    benchmarks:
      - medagentbench:
          endpoint: "kappa(ASC-proxy, native scorer) on 100 stratified traces"
          thresholds: { win: { kappa_gte: 0.75 }, survive: { kappa_range: [0.60, 0.75] } }
          reproduction_check: "Native on own traces within 3pp of paper number"
      - agentclinic:
          endpoint: "kappa on trace-to-dialogue conversions"
          thresholds: { win: { kappa_gte: 0.60 } }
      - amega:
          endpoint: "kappa on identical traces"
          thresholds: { win: { kappa_gte: 0.70 } }
    anonymity_protocol: "shallow clone, gitignored, no PR submissions"
    budget_usd_estimate: 3000

  cres_4_oracle_fair:
    layer: 3
    defense_target: "FATAL-4 Oracle information-access confound"
    tier: B
    status: PENDING
    n_variants: 4
    n_episodes_per_variant: 2118  # 706 * 3 runs
    thresholds:
      win: { delta_v2_v3_pp_gte: 3.0, holds_on_n_domains_gte: 5, of_total_domains: 6 }

  cres_5_effect_size:
    layer: 3
    defense_target: "MAJOR-5 non-standard effect size reporting"
    tier: A
    status: FAIL-COMPLETE
    endpoint: "Multi-metric effect size battery with bootstrap 95% CI"
    thresholds:
      pre_registered_eta2_evaluator_gte: 0.15
      pre_registered_cohens_f2_gte: 0.15
    observed:
      eta2_evaluator: 0.0725
      eta2_evaluator_ci_95: [0.0688, 0.0763]
      eta2_run: 0.0515
      cohens_f2: 0.0781
      cohens_f2_ci_95: [0.0739, 0.0826]
      cliffs_delta: -0.2253
      vpc: 0.0725
      rank_biserial: -0.1526
      null_ratio: 1479.69
      null_n_permutations: 10000
      interpretation: "Observed effects are real (null ratio 1479x) but below pre-registered magnitude. Paper reports honest numbers instead of the previously-claimed 200000x."
    evidence_path: "evidence_pack/cres_5/cres_5_results.json"

  cres_6_e1_expansion:
    layer: 3
    defense_target: "MAJOR-6 E1 underpowered (n=17)"
    tier: B
    status: PENDING
    endpoint: "Wilson 95% CI upper bound on before-only detection rate"
    n_pairs: 180
    thresholds:
      win: { wilson_upper_lt: 0.03 }

  cres_7_theorem_partition:
    layer: 3
    defense_target: "MAJOR-7 Thm 3.4 vs empirical inconsistency"
    tier: A
    status: PASS-COMPLETE
    endpoint: "ASC-invisible fraction of failing episodes (Class-B only + mixed)"
    thresholds:
      win: { invisible_pct_gte: 30.0 }
    observed:
      invisible_pct_all_failing: 32.96
      invisible_pct_asc_false_accepts: 33.16
      n_failing: 7175
      n_class_b_only: 2365
      n_mixed: 4810
      violation_type_counts:
        omission: 24889
        commission: 1529
        timing: 10094
        sequence: 273
        deviation: 22930
    evidence_path: "evidence_pack/cres_7/cres_7_results.json"

  cres_8_frontier_models:
    layer: 3
    defense_target: "MAJOR-8 closed-weights + medical FM excluded"
    tier: C
    status: PENDING
    models: ["gpt-4o", "claude-sonnet-4-6", "gemini-2.5-pro", "openbio-70b", "meditron-70b"]
    n_scenarios_per_model: 706
    n_runs: 3
    thresholds:
      win: { spearman_8model_to_frontier_gte: 0.60 }
    budget_usd_estimate: 15000

  cres_9_tost:
    layer: 3
    defense_target: "MAJOR-9 Friedman null != equivalence"
    tier: A
    status: FAIL-COMPLETE
    endpoint: "TOST equivalence test at +/- 3pp margin across 6 scaffold pairs"
    thresholds:
      win: { n_equivalent_pairs_gte: 4, of_total_pairs: 6 }
    observed:
      n_equivalent_pairs_primary_ao_fa: 3
      epsilon: 0.03
      alpha: 0.05
      mean_mde_80pct: null  # check evidence_pack/cres_9/cres_9_results.json.power_analysis
      interpretation: "Marginal fail (3/6 vs threshold 4/6). Reported honestly; paper reframes as 'approximate equivalence on majority of pairs' not 'full scaffold invariance'."
    evidence_path: "evidence_pack/cres_9/cres_9_results.json"

  cres_10_constraint_audit:
    layer: 3
    defense_target: "MAJOR-10 zero clinician audit"
    tier: C
    status: PENDING
    n_constraints_sampled: 500
    of_total: 1049
    n_physicians: 7
    specialties: ["IM", "EM", "ICU", "CardioIM", "Nephro", "ID", "OB-Peds"]
    thresholds:
      win: { endorsement_rate_gte: 0.90, inter_rater_kappa_gte: 0.70 }
      survive: { endorsement_rate_range: [0.75, 0.90] }
    budget_usd_estimate: 15000

  cres_11_dashboard:
    layer: 3
    defense_target: "MAJOR-11 dashboard not in main text"
    tier: A
    status: WARN-COMPLETE
    endpoint: "10-dimension falsification dashboard with honest pass/warn/fail"
    observed:
      n_pass: 1
      n_warn: 4
      n_fail: 5
      n_pending: 0
      n_total: 10
      stouffer_combined_p: 0.6371
      interpretation: "5/10 fails is the benchmark's honest self-falsification report. The paper reports this verbatim; fails are not bugs."
    evidence_path: "evidence_pack/cres_11/cres_11_results.json"

  cres_12_rank_reversal:
    layer: 3
    defense_target: "MINOR-12 single 75% metric inflated"
    tier: A
    status: FAIL-COMPLETE
    endpoint: "Multi-angle rank stability battery (Kendall W, pairwise Spearman, CI widths, top-k Jaccard, swap distance)"
    thresholds:
      pre_registered_mean_spearman_gte: 0.30
    observed:
      mean_pairwise_spearman_rho: 0.0595
      mean_top3_jaccard: 0.2167
      mean_kendall_dist_normalized: 0.4603
      n_rank_reversals: 18
      of_total_pairs: 21
      worst_case_reversal_depth: 5
      mean_rank_ci_width: 1.071
      interpretation: "Evaluators disagree sharply on model ranking (rho=0.060). This is the headline falsification result, not a bug."
    evidence_path: "evidence_pack/cres_12/cres_12_results.json"

  cres_13_compute:
    layer: 3
    defense_target: "MINOR-13 inadequate compute disclosure"
    tier: A
    status: PASS-COMPLETE
    observed:
      total_tokens_millions: 505
      total_a100_hours: 14.0
      estimated_kg_co2eq: 1.68
      mlco2_calculator: "us_grid_default"
    evidence_path: "evidence_pack/cres_13/cres_13_results.json"

  cres_14_llm_judge_sweep:
    layer: 3
    defense_target: "MINOR-14 LLM-judge as alternative to structural evaluation"
    tier: C
    status: PENDING
