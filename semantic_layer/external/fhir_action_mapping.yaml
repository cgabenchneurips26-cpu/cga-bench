loinc_to_action:
  "4548-4": "assess_lab_hba1c"
  "2160-0": "order_lab_creatinine"
  "2524-7": "order_lab_lactate"
  "2823-3": "order_lab_potassium"
  "2601-3": "order_lab_magnesium"
  "33914-3": "order_lab_egfr"
  "59408-5": "assess_oxygen_saturation"
  "8867-4": "assess_heart_rate"
  "8480-6": "assess_blood_pressure"
  "8310-5": "assess_temperature"
  "2345-7": "order_lab_glucose"
  "1988-5": "order_lab_crp"
  "1975-2": "order_lab_bilirubin"
  "6598-7": "order_lab_troponin"
  "48065-7": "order_lab_bnp"

