name: cga-bench
channels:
  - defaults
  - conda-forge

dependencies:
  - python>=3.10,<3.13
  - pip

  - pip:
    # Core dependencies
    - pydantic>=2.0
    - pyyaml>=6.0
    - httpx>=0.24
    - numpy>=1.24
    - scipy>=1.10
    - jinja2>=3.1
    # Visualization
    - matplotlib>=3.7
    # Dev/Test
    - pytest>=7.0
    - pytest-cov>=4.0
    - ruff>=0.1
    - mypy>=1.0
    # Optional GPU/LLM (uncomment for full pipeline)
    # - torch>=2.0
    # - vllm>=0.4
    # - openai>=1.0
    # - anthropic>=0.20
