# Clinician-Calibrated Harm Weights
# Based on Delphi consensus and literature review
# Reference: CREOLA harm taxonomy, GRADE methodology

version: "1.0"
last_updated: "2024-01-01"
calibration_method: "modified_delphi"
num_clinicians: 12

# Base severity weights (universal)
severity_weights:
  minor: 0.1
  moderate: 0.3
  major: 0.5
  severe: 0.8
  critical: 1.0

# Base category weights (universal)
category_weights:
  omission: 0.7
  commission: 1.0
  delay: 0.5
  sequence: 0.6
  deviation: 0.3
  overuse: 0.4
  documentation_error: 0.1

# Context-specific harm weights
# Format: {context}_{category}_{severity}: weight
harm_weights:
  # STEMI context
  stemi_omission_critical: 1.0
  stemi_commission_critical: 1.0
  stemi_delay_major: 0.8
  stemi_delay_critical: 1.0

  # Sepsis context
  sepsis_omission_critical: 1.0
  sepsis_delay_major: 0.7
  sepsis_delay_critical: 0.9
  sepsis_sequence_moderate: 0.4

  # AKI context
  aki_commission_major: 0.6
  aki_commission_severe: 0.8
  aki_overuse_moderate: 0.5

  # General ED context
  general_omission_minor: 0.1
  general_omission_moderate: 0.3
  general_commission_minor: 0.2
  general_commission_moderate: 0.4

# Specific violation weights (override defaults)
violation_specific_weights:
  # Chest pain violations
  discharge_stemi: 1.0
  no_ecg_10min: 0.7
  discharge_without_troponin: 0.8
  nitro_rv_infarct: 1.0
  aspirin_allergy_given: 0.9

  # Sepsis violations
  late_antibiotics_septic_shock: 1.0
  no_blood_culture_before_abx: 0.5
  no_lactate_hour1: 0.6
  no_fluids_shock: 0.9

  # AKI violations
  nephrotoxin_aki: 0.8
  no_creatinine_monitoring: 0.5
  iv_contrast_without_protection: 0.7

# Recommendation class multipliers
recommendation_multipliers:
  Class_I: 1.0
  Class_IIa: 0.7
  Class_IIb: 0.4
  Class_III: 0.0  # Should not be done anyway
  Strong: 1.0
  Weak: 0.6
  BPS: 0.8

# Evidence level adjustments (optional)
evidence_adjustments:
  A: 1.0  # Strong evidence
  B: 0.9
  B-R: 0.9
  B-NR: 0.85
  C: 0.8
  C-LD: 0.75
  C-EO: 0.7

# Time-dependent severity escalation
# For delay violations, severity increases with delay duration
delay_escalation:
  chest_pain_ecg:
    base_deadline_minutes: 10
    escalation_intervals:
      - minutes: 10
        severity_multiplier: 1.0
      - minutes: 20
        severity_multiplier: 1.3
      - minutes: 30
        severity_multiplier: 1.6
      - minutes: 60
        severity_multiplier: 2.0

  sepsis_antibiotics:
    base_deadline_minutes: 60
    escalation_intervals:
      - minutes: 60
        severity_multiplier: 1.0
      - minutes: 120
        severity_multiplier: 1.5
      - minutes: 180
        severity_multiplier: 2.0
      - minutes: 240
        severity_multiplier: 2.5
    # Literature: 7.6% mortality increase per hour delay

  stemi_reperfusion:
    base_deadline_minutes: 90
    escalation_intervals:
      - minutes: 90
        severity_multiplier: 1.0
      - minutes: 120
        severity_multiplier: 1.4
      - minutes: 180
        severity_multiplier: 1.8
      - minutes: 240
        severity_multiplier: 2.2
    # Literature: Each 30-min delay increases mortality

# Inter-rater reliability metrics (from calibration study)
calibration_metrics:
  fleiss_kappa: 0.78
  intraclass_correlation: 0.82
  mean_deviation: 0.12
