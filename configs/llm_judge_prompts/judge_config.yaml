default_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
default_backend: vllm
default_endpoint: "http://localhost:8013/v1"
temperature: 0.1
max_tokens: 2048
timeout_seconds: 120
max_retries: 3

prompt_variants:
  rubric_free:
    template: "rubric_free.jinja2"
    description: "No rubric, pure clinical judgment"
  rubric_aware:
    template: "rubric_aware.jinja2"
    description: "Constraints provided as rubric"
  cot_judge:
    template: "cot_judge.jinja2"
    description: "Chain-of-thought per-constraint evaluation"

dry_run:
  n_episodes: 10
  models: ["oss120b"]
