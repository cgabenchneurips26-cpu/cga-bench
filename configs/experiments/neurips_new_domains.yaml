# NeurIPS Experiment - Heart Failure & Stroke Domains
# ====================================================
# New Decision Tables 검증용 실험

experiment:
  experiment_id: "neurips_new_domains"
  description: "Testing new Heart Failure and Stroke Decision Tables"
  version: "1.0.0"

# 격리 설정
isolation:
  forbidden_imports:
    - "cga_bench.cpg_engine"
    - "cga_bench.assessor_core"
    - "cga_bench.cpg_model.graphs"
  allowed_imports:
    - "cga_bench.agent_rules"
    - "cga_bench.tool_api"
    - "cga_bench.scenario_engine"
  enforce_at_runtime: true
  log_violations: true

# Budget 설정
budget:
  enforce_budget_matching: true
  budget_limit_tokens: 50000
  budget_limit_calls: 100
  on_budget_exceeded: "terminate"
  allow_sampling: false

# 시나리오
scenarios:
  # Sepsis Scenarios
  sepsis:
    - septic_shock_basic
    - septic_shock_penicillin_allergy

  # Heart Failure Scenarios
  heart_failure:
    - hfref_new_diagnosis
    - adhf_warm_wet
    - adhf_cold_wet
    - cardiogenic_shock

  # Stroke Scenarios
  stroke:
    - stroke_tpa_eligible
    - stroke_thrombectomy
    - stroke_extended_window
    - hemorrhagic_stroke

  # Chest Pain Scenarios
  chest_pain:
    - stemi_anterior_basic
    - stemi_inferior_rv_trap

# 베이스라인 설정
baselines:
  # Rule-based Oracle (상한선)
  rule_based:
    enabled: true
    agent_type: "oracle"
    description: "Rule-based oracle agent using independent Decision Tables"
    config:
      agent_id: "rule_based_oracle"
      uses_cpg_engine: false
      uses_assessor_core: false
      budget_limit_tokens: 0
      budget_limit_calls: 200
      max_actions_per_step: 5

  # RAG-only (강한 텍스트 베이스라인)
  rag_only:
    enabled: true
    agent_type: "rag"
    description: "RAG-only baseline with Qwen3-30B-A3B"
    config:
      agent_id: "rag_qwen3_30b"
      llm_backend: "vllm"
      llm_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      base_url: "http://localhost:8013/v1"
      temperature: 0.1
      use_bm25: true
      use_dense: false
      use_hybrid: false
      top_k: 5
      use_planning: false
      use_constraint_verification: false
      single_step_decision: true
      force_structured_output: true
      output_format: "json"
      budget_limit_tokens: 50000
      budget_limit_calls: 100
      max_actions_per_step: 3

  # Planner+Tool (ReAct-style)
  planner_tool:
    enabled: true
    agent_type: "planner"
    description: "Planner agent with Qwen3-30B-A3B"
    config:
      agent_id: "planner_qwen3_30b"
      llm_backend: "vllm"
      llm_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      base_url: "http://localhost:8013/v1"
      temperature: 0.1
      budget_limit_tokens: 50000
      budget_limit_calls: 100
      max_actions_per_step: 3

  # Self-Reflection (Reflexion-style)
  self_reflection:
    enabled: true
    agent_type: "reflection"
    description: "Self-reflection agent with Qwen3-30B-A3B"
    config:
      agent_id: "reflection_qwen3_30b"
      llm_backend: "vllm"
      llm_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      base_url: "http://localhost:8013/v1"
      temperature: 0.1
      max_reflection_rounds: 2
      budget_limit_tokens: 50000
      budget_limit_calls: 100
      max_actions_per_step: 3

  # LLM-Assist (Semantic Layer Hybrid)
  llm_assist:
    enabled: true
    agent_type: "llm_assist"
    description: "LLM-Assist hybrid agent with semantic layer - combines rule accuracy with LLM extensibility"
    config:
      agent_id: "llm_assist_qwen3_30b"
      llm_backend: "vllm"
      llm_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      base_url: "http://localhost:8013/v1"
      temperature: 0.1
      domain: "general"
      cpg_sources_path: "cpg_sources"
      use_semantic_validation: true
      use_constraint_synthesis: true
      use_action_normalization: true
      cache_parsed_guidelines: true
      budget_limit_tokens: 50000
      budget_limit_calls: 100
      max_actions_per_step: 5

settings:
  num_runs_per_scenario: 1
  save_logs: true
  save_scores: true
  save_trajectories: true
  output_dir: "results/neurips_new_domains"
  random_seed: 42
  deterministic_mode: false
  parallel_scenarios: false
  parallel_baselines: false

metrics:
  primary:
    - compliance_score
    - peak_risk
    - aggregate_risk
  secondary:
    - total_violations
    - budget_utilization
