scenarios:
  sccm_rsi_2019_general_mild:
    scenario_id: sccm_rsi_2019_general_mild
    description: SCCM 2019 Guidelines for Rapid Sequence Intubation in Critically Ill Adults — general (mild)
    guideline_graph: sccm_rsi_2019
    patient:
      age: 65
      sex: F
      weight_kg: 70
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - verify_equipment_availability
    - establish_iv_access
    - position_patient_sniffing
    - preoxygenate_3_to_5_minutes
    - apply_nasal_cannula_for_apneic_oxygenation
    - give_induction_agent
    - give_neuromuscular_blocker
    - perform_laryngoscopy
    - place_endotracheal_tube
    - confirm_placement_with_etco2
    - initiate_mechanical_ventilation
    - order_imaging_chest_xray_post_intubation
    - initiate_sedation
    - assess_ventilator_settings
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
