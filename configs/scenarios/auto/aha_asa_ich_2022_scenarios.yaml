scenarios:
  aha_asa_ich_2022_general_mild:
    scenario_id: aha_asa_ich_2022_general_mild
    description: 2022 AHA/ASA Guideline for the Management of Patients With Spontaneous Intracerebral Hemorrhage — general
      (mild)
    guideline_graph: aha_asa_ich_2022
    patient:
      age: 72
      sex: M
      weight_kg: 75
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_neurological_status
    - order_imaging_ct_head
    - assess_gcs
    - initiate_iv_antihypertensive
    - target_sbp_below_140
    - assess_anticoagulation_status
    - request_neurosurgery_consultation
    - assess_neurological_status_q1h
    - repeat_ct_head_24h
    - assess_discharge_readiness
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
