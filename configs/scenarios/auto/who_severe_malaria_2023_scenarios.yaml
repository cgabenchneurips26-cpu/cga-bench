scenarios:
  who_severe_malaria_2023_general_mild:
    scenario_id: who_severe_malaria_2023_general_mild
    description: WHO 2023 Guidelines for the Treatment of Severe Malaria — general (mild)
    guideline_graph: who_severe_malaria_2023
    patient:
      age: 72
      sex: M
      weight_kg: 75
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - confirm_parasitemia_rdt_or_smear
    - assess_vital_signs
    - assess_severity_criteria
    - give_iv_artesunate_2_4mg_kg
    - check_glucose_immediately
    - order_lab_cbc
    - monitor_glucose_q4h
    - give_maintenance_iv_fluids_cautious
    - order_parasite_count_q12h
    - assess_transition_to_oral_act
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
