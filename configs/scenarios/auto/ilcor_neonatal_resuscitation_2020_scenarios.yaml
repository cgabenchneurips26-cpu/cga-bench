scenarios:
  ilcor_neonatal_resuscitation_2020_general_mild:
    scenario_id: ilcor_neonatal_resuscitation_2020_general_mild
    description: ILCOR Neonatal Resuscitation Consensus 2020 — general (mild)
    guideline_graph: ilcor_neonatal_resuscitation_2020
    patient:
      age: 50
      sex: M
      weight_kg: 85
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_term_tone_breathing
    - dry_stimulate_warm_newborn
    - position_airway_and_clear_secretions
    - initiate_positive_pressure_ventilation_if_hr_below_100
    - assess_heart_rate
    - place_pulse_oximeter_right_hand
    - reassess_heart_rate_and_spo2
    - assess_apgar_at_5_and_10_minutes
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
