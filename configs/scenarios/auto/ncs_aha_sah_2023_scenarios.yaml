scenarios:
  ncs_aha_sah_2023_general_mild:
    scenario_id: ncs_aha_sah_2023_general_mild
    description: 2023 Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage (AHA/ASA) — general
      (mild)
    guideline_graph: ncs_aha_sah_2023
    patient:
      age: 55
      sex: M
      weight_kg: 90
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_neurological_status
    - order_imaging_ct_head
    - assess_hunt_hess_grade
    - secure_airway_intubation
    - control_blood_pressure_sbp_below_160
    - give_nimodipine_60mg_q4h
    - place_external_ventricular_drain
    - request_neurosurgery_consultation
    - order_transcranial_doppler
    - assess_discharge_readiness
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
