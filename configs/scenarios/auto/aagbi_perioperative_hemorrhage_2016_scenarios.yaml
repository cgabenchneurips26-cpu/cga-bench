    description: AAGBI Perioperative Hemorrhage 2016 — pulmonary embolism (mild)
    guideline_graph: aagbi_perioperative_hemorrhage_2016
    patient:
      age: 45
      sex: F
      weight_kg: 65
      chief_complaint: sudden dyspnea, pleuritic chest pain
      working_diagnosis: pulmonary_embolism
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_vital_signs
    - order_lab_cbc
    - order_lab_coagulation
    - order_lab_fibrinogen
    - transfuse_prbc
    - transfuse_ffp
    - give_tranexamic_acid_iv
    - reassess_vital_signs
    - order_lab_cbc_repeat
    - order_lab_coagulation_repeat
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
