scenarios:
  ukka_hyperkalemia_2023_pulmonary_embolism_mild:
    scenario_id: ukka_hyperkalemia_2023_pulmonary_embolism_mild
    description: UK Kidney Association 2023 Clinical Practice Guidelines for Acute Hyperkalemia in Adults — pulmonary embolism
      (mild)
    guideline_graph: ukka_hyperkalemia_2023
    patient:
      age: 65
      sex: F
      weight_kg: 70
      chief_complaint: sudden dyspnea, pleuritic chest pain
      working_diagnosis: pulmonary_embolism
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - order_ecg_stat
    - order_lab_bmp_stat
    - assess_vital_signs
    - give_calcium_gluconate_10ml_10pct_iv
    - monitor_ecg_continuous
    - give_insulin_10u_with_dextrose_25g
    - give_salbutamol_nebulized_10_20mg
    - assess_need_for_dialysis
    - order_lab_bmp_repeat_1h
    - monitor_glucose_q15min_for_2h
    - assess_discharge_readiness
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
