scenarios:
  baveno_vii_varices_2022_general_mild:
    scenario_id: baveno_vii_varices_2022_general_mild
    description: 'Baveno VII Consensus on Portal Hypertension: Variceal Hemorrhage 2022 — general (mild)'
    guideline_graph: baveno_vii_varices_2022
    patient:
      age: 72
      sex: M
      weight_kg: 75
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_airway_and_hemodynamics
    - establish_large_bore_iv_access
    - order_lab_cbc_coag_type_screen
    - give_vasoactive_octreotide_or_terlipressin
    - give_ceftriaxone_1g_iv_prophylaxis
    - perform_egd_within_12h
    - perform_band_ligation_if_esophageal
    - assess_rebleeding_risk
    - continue_vasoactive_3_to_5_days
    - perform_tips_procedure
    - continue_hemodynamic_support
    - monitor_hemodynamics_serial
    - assess_for_secondary_prophylaxis
    - assess_discharge_readiness
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
