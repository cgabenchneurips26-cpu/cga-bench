        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_vital_signs
    - assess_perfusion_status
    - order_ecg
    - start_inotrope_dobutamine
    - activate_cath_lab_emergent
    - give_aspirin_loading
