scenarios:
  erc_hypothermia_2021_general_mild:
    scenario_id: erc_hypothermia_2021_general_mild
    description: ERC 2021 Guidelines for Accidental Hypothermia — general (mild)
    guideline_graph: erc_hypothermia_2021
    patient:
      age: 65
      sex: F
      weight_kg: 70
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - measure_core_temperature
    - assess_vital_signs
    - assess_level_of_consciousness
    - remove_wet_clothing
    - passive_external_rewarming
    - give_warm_iv_fluids_38_42c
    - monitor_core_temperature_q30min
    - monitor_ecg_continuous
    - assess_discharge_readiness
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
