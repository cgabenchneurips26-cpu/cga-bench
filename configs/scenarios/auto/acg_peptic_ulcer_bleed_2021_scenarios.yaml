    description: ACG Peptic Ulcer Bleeding 2021 — pulmonary embolism (mild)
    guideline_graph: acg_peptic_ulcer_bleed_2021
    patient:
      age: 45
      sex: F
      weight_kg: 65
      chief_complaint: sudden dyspnea, pleuritic chest pain
      working_diagnosis: pulmonary_embolism
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_vital_signs
    - order_lab_cbc
    - order_lab_type_and_crossmatch
    - order_lab_coagulation
    - give_iv_ppi_infusion
    - consult_gastroenterology_for_endoscopy
    - resuscitate_with_crystalloid
    - reassess_vital_signs
    - order_lab_hpylori_test
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
