scenarios:
  btf_severe_tbi_2020_general_mild:
    scenario_id: btf_severe_tbi_2020_general_mild
    description: Brain Trauma Foundation Severe TBI Guidelines 4th Edition — general (mild)
    guideline_graph: btf_severe_tbi_2020
    patient:
      age: 55
      sex: M
      weight_kg: 90
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_glasgow_coma_scale
    - secure_airway_intubation_if_gcs_8_or_less
    - assess_vital_signs
    - order_imaging_ct_head
    - monitor_intracranial_pressure
    - maintain_cpp_60_70
    - elevate_head_of_bed_30_degrees
    - maintain_normothermia
    - reassess_neurologic_status
    - monitor_icp_trend
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
