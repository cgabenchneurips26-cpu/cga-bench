scenarios:
  pals_pediatric_traumatic_arrest_2020_pulmonary_embolism_mild:
    scenario_id: pals_pediatric_traumatic_arrest_2020_pulmonary_embolism_mild
    description: 2020 AHA PALS Guidelines - Pediatric Traumatic Arrest — pulmonary embolism (mild)
    guideline_graph: pals_pediatric_traumatic_arrest_2020
    patient:
      age: 28
      sex: F
      weight_kg: 62
      chief_complaint: sudden dyspnea, pleuritic chest pain
      working_diagnosis: pulmonary_embolism
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_airway_breathing
    - assess_circulation
    - identify_reversible_causes
    - apply_direct_pressure_external_bleeding
    - apply_pelvic_binder_if_pelvic_fracture
    - activate_massive_transfusion_protocol
    - secure_airway_intubation
    - bilateral_needle_decompression_if_suspected_pneumo
    - order_bedside_fast_exam
    - give_prbc_o_negative_emergency
    - assess_need_for_emergent_or
    - monitor_vital_signs_continuous
    - assess_neurological_status
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
