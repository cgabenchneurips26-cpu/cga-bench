scenarios:
  ers_ats_niv_2017_general_mild:
    scenario_id: ers_ats_niv_2017_general_mild
    description: 'ERS/ATS Clinical Practice Guidelines: NIV for Acute Respiratory Failure (2017) — general (mild)'
    guideline_graph: ers_ats_niv_2017
    patient:
      age: 28
      sex: F
      weight_kg: 62
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_respiratory_status
    - order_lab_abg
    - assess_niv_indication
    - initiate_bilevel_niv
    - set_ipap_10_to_20_cmh2o
    - set_epap_4_to_6_cmh2o
    - reassess_abg_at_1_to_2_hours
    - evaluate_niv_tolerance
    - proceed_to_intubation
    - assess_weaning_readiness
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
