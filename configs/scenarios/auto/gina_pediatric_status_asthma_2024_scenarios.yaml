scenarios:
  gina_pediatric_status_asthma_2024_pulmonary_embolism_mild:
    scenario_id: gina_pediatric_status_asthma_2024_pulmonary_embolism_mild
    description: GINA 2024 Severe Pediatric Asthma Exacerbation — pulmonary embolism (mild)
    guideline_graph: gina_pediatric_status_asthma_2024
    patient:
      age: 55
      sex: M
      weight_kg: 90
      chief_complaint: sudden dyspnea, pleuritic chest pain
      working_diagnosis: pulmonary_embolism
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_exacerbation_severity
    - measure_spo2
    - assess_vital_signs
    - give_continuous_nebulized_albuterol
    - give_iv_methylprednisolone
    - give_iv_magnesium_sulfate
    - apply_high_flow_oxygen
    - continuous_cardiorespiratory_monitoring
    - reassess_severity_at_1_hour
    - reassess_spo2
    - determine_disposition
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
