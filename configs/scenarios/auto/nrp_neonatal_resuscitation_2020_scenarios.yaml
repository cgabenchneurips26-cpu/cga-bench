scenarios:
  nrp_neonatal_resuscitation_2020_general_mild:
    scenario_id: nrp_neonatal_resuscitation_2020_general_mild
    description: 2020 AHA/AAP Guidelines for Neonatal Resuscitation (NRP) — general (mild)
    guideline_graph: nrp_neonatal_resuscitation_2020
    patient:
      age: 55
      sex: M
      weight_kg: 90
      chief_complaint: presenting symptoms
      working_diagnosis: general
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_term_gestation
    - assess_muscle_tone
    - assess_breathing
    - delayed_cord_clamping_30_60sec
    - place_skin_to_skin
    - dry_and_warm
    - monitor_vital_signs
    - monitor_respiratory_status
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
