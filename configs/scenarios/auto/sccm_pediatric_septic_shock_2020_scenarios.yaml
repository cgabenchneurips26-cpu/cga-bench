scenarios:
  sccm_pediatric_septic_shock_2020_pulmonary_embolism_mild:
    scenario_id: sccm_pediatric_septic_shock_2020_pulmonary_embolism_mild
    description: Surviving Sepsis Campaign International Guidelines for Management of Septic Shock in Children (2020) — pulmonary
      embolism (mild)
    guideline_graph: sccm_pediatric_septic_shock_2020
    patient:
      age: 50
      sex: M
      weight_kg: 85
      chief_complaint: sudden dyspnea, pleuritic chest pain
      working_diagnosis: pulmonary_embolism
      vitals:
        heart_rate: 100
        blood_pressure_systolic: 110
        blood_pressure_diastolic: 70
        respiratory_rate: 20
        temperature: 38.2
        oxygen_saturation: 94
        map_mmhg: 83
      allergies: []
      comorbidities: []
      contraindications: []
    expected_actions:
    - assess_perfusion_status
    - assess_mental_status
    - assess_vital_signs
    - give_crystalloid_bolus_20ml_kg
    - order_lab_blood_culture
    - give_broad_spectrum_antibiotics
    - start_vasopressor_norepinephrine
    - reassess_perfusion
    - remeasure_lactate_if_elevated
    - assess_icu_transfer_need
    max_duration_minutes: 120
    passing_compliance_threshold: 0.7
