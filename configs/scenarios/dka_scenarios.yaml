    - attribute_acidosis_to_dka_only
    - discharge_based_on_normal_glucose
    max_duration_minutes: 180
    passing_compliance_threshold: 0.85
  dka_alcoholic_ketoacidosis_mimic:
    scenario_id: dka_alcoholic_ketoacidosis_mimic
    description: Alcoholic ketoacidosis mimicking DKA - insulin is harmful with normal
      glucose, thiamine must precede glucose
    guideline_graph: ada_dka_management
    trap_scenario: true
    trap_description: Alcoholic ketoacidosis (AKA) is not DKA. Insulin is unnecessary
      and harmful (glucose is already normal). Treatment is dextrose + thiamine. Thiamine
      MUST precede glucose administration to prevent precipitating Wernicke encephalopathy.
    patient:
      age: 45
      sex: M
      weight_kg: 68
      chief_complaint: found confused, anion gap metabolic acidosis, ketones positive,
        glucose 95
      working_diagnosis: metabolic_acidosis
      vitals:
