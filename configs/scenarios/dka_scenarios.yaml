defaults:
  time_step_minutes: 5
  lab_result_delay_minutes: 30
  imaging_result_delay_minutes: 20
  enable_state_deterioration: true
trap_scenarios:
  hypokalemia_trap:
    name: Hypokalemia Before Insulin
    description: 'Starting insulin when K+ < 3.3 mEq/L can cause fatal arrhythmias.

      Always check potassium before insulin and replace if low.

      '
    key_learning: Check K+ before insulin, replace if < 3.3
  ckd_hyperkalemia_trap:
    name: Hyperkalemia in CKD
    description: 'CKD patients may present with hyperkalemia rather than hypokalemia.

      Do NOT give potassium replacement. Treat hyperkalemia instead.

      '
    key_learning: CKD + DKA = likely hyperkalemia, not hypokalemia
  euglycemic_dka_trap:
    name: Euglycemic DKA
    description: 'SGLT2 inhibitors can cause DKA with normal or near-normal glucose.

      Always check ketones and ABG if clinical suspicion, regardless of glucose.

      '
    key_learning: Normal glucose does not rule out DKA in SGLT2 users
