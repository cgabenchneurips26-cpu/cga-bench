  dka_euglycemic_sglt2:
    scenario_id: dka_euglycemic_sglt2
    description: Euglycemic DKA in patient on SGLT2 inhibitor - glucose near normal
      despite DKA
    guideline_graph: ada_dka_management
    patient:
      age: 52
      sex: F
      weight_kg: 70
      chief_complaint: nausea, vomiting, abdominal pain, weakness for 2 days
      working_diagnosis: dka_euglycemic
      vitals:
        heart_rate: 100
