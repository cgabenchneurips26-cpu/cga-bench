    - discharge_home
    max_duration_minutes: 240
    passing_compliance_threshold: 0.85
    special_considerations:
    - pH < 7.0 requires ICU admission
    - Consider bicarbonate only if pH < 6.9
    - Initial K+ may be high but will drop rapidly with insulin
    - Evaluate for precipitating cause (infection, MI, missed insulin)
  dka_with_ckd:
    scenario_id: dka_with_ckd
    description: DKA in patient with chronic kidney disease - careful fluid and K+
      management
    guideline_graph: ada_dka_management
    patient:
      age: 58
      sex: M
      weight_kg: 82
      chief_complaint: confusion, nausea, decreased urine output
      working_diagnosis: dka_moderate
      vitals:
        heart_rate: 98
        blood_pressure_systolic: 165
        blood_pressure_diastolic: 95
        respiratory_rate: 24
        temperature: 37.2
        oxygen_saturation: 95
        map_mmhg: 118
      allergies:
      - sulfa
      comorbidities:
      - type_2_diabetes
      - ckd_stage_4
      - hypertension
      - heart_failure_hfpef
      contraindications: []
    ground_truth:
      lab_glucose: 380
      lab_ketones: 4.2
      lab_ph: 7.22
      lab_bicarbonate: 14
      lab_potassium: 6.2
      lab_sodium: 132
      lab_chloride: 100
      lab_bun: 65
      lab_creatinine: 4.8
      lab_anion_gap: 18
      lab_bnp: 850
      imaging_chest_xray: mild_pulmonary_edema
      ecg_result: sinus_rhythm_peaked_t_waves_wide_qrs
    expected_actions:
    - assess_vital_signs
    - establish_iv_access
    - order_lab_bmp
    - order_lab_abg
    - order_ecg
    - start_iv_fluid_ns
    - start_insulin_infusion
    - monitor_glucose_hourly
    - monitor_potassium_q2h
    - treat_hyperkalemia
    forbidden_actions:
    - give_potassium_iv
    - give_potassium_replacement
    - aggressive_fluid_bolus
    - give_nsaid
    optional_actions:
    - nephrology_consult
    - consider_hemodialysis
    - give_calcium_gluconate
    - give_sodium_bicarbonate
    max_duration_minutes: 240
    passing_compliance_threshold: 0.8
    trap_scenario: true
    trap_description: 'CKD + DKA Trap: Hyperkalemia Management


      This patient has K+ = 6.2 mEq/L with ECG changes (peaked T, wide QRS).

      Unlike typical DKA where K+ drops, CKD patients:

      - May have baseline hyperkalemia

      - Cannot excrete potassium normally

      - Risk cardiac arrest from hyperkalemia


      CORRECT APPROACH:

      1. Do NOT give potassium replacement

      2. Treat hyperkalemia: calcium gluconate for cardiac protection

      3. Start insulin (will help lower K+)

      4. Cautious fluids (heart failure risk)

      5. Consider nephrology consult/dialysis

      '
    special_considerations:
    - Do NOT give potassium - already hyperkalemic
    - Cautious fluid resuscitation due to CKD and HF
    - Monitor for volume overload (pulmonary edema)
    - May need dialysis if refractory
    - Insulin will help lower potassium
