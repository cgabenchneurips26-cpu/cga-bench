      - type_2_diabetes
      - heart_failure
      contraindications: []
      current_medications:
      - name: empagliflozin
        class: sglt2_inhibitor
        dose: 25mg daily
        duration: 6 months
      - name: metformin
        class: biguanide
        dose: 1000mg BID
      - name: lisinopril
        class: ace_inhibitor
        dose: 10mg daily
    ground_truth:
      lab_glucose: 145
      lab_ketones: 5.5
      lab_beta_hydroxybutyrate: 5.8
      lab_ph: 7.18
      lab_bicarbonate: 11
      lab_potassium: 4.0
      lab_sodium: 135
      lab_chloride: 100
      lab_bun: 25
      lab_creatinine: 1.3
      lab_anion_gap: 24
      imaging_chest_xray: normal
      urinalysis: ketones_large_glucose_trace
    expected_actions:
    - assess_vital_signs
    - establish_iv_access
    - order_lab_bmp
    - order_lab_abg
    - order_lab_ketones
    - start_iv_fluid_ns
    - start_insulin_infusion
    - add_dextrose_to_iv
    - stop_sglt2_inhibitor
    optional_actions:
    - order_lab_beta_hydroxybutyrate
    forbidden_actions:
    - discharge_based_on_normal_glucose
    max_duration_minutes: 240
    passing_compliance_threshold: 0.8
    trap_scenario: true
    trap_description: 'Euglycemic DKA Trap: Normal Glucose Does NOT Rule Out DKA


      This patient has glucose = 180 mg/dL but is in DKA (pH 7.18, ketones 5.5).

      SGLT2 inhibitors (empagliflozin, dapagliflozin, canagliflozin) cause:

      - Glucosuria (glucose excreted in urine)

      - Euglycemic DKA (ketoacidosis with near-normal glucose)


      TRAP: Normal glucose may delay DKA diagnosis!


      CORRECT APPROACH:

      1. Check ketones and ABG regardless of glucose

      2. Start insulin even with normal glucose

      3. Add dextrose to IV fluids early (prevent hypoglycemia)

      4. Stop SGLT2 inhibitor

      5. High suspicion in SGLT2 user with vomiting/acidosis

      '
    special_considerations:
    - SGLT2 inhibitor masks hyperglycemia
    - Must check ketones - glucose alone is misleading
    - Will need dextrose in IV fluids earlier than typical DKA
    - Hold SGLT2 inhibitor until fully recovered
  dka_pregnancy_trap:
    scenario_id: dka_pregnancy_trap
    description: 'Cross-domain conflict: DKA in a pregnant patient (28 weeks gestation).
      Standard DKA management with critical modifications: fetal monitoring, more
      aggressive hydration, avoidance of teratogenic medications.

      '
    guideline_graph: ada_dka_management
    patient:
      age: 29
      sex: F
      weight_kg: 72
      chief_complaint: nausea, vomiting, abdominal pain, rapid breathing — 28 weeks
        pregnant
      working_diagnosis: dka_moderate
      vitals:
        heart_rate: 115
        blood_pressure_systolic: 100
        blood_pressure_diastolic: 60
        respiratory_rate: 28
        temperature: 37.3
        oxygen_saturation: 97
        map_mmhg: 73
      allergies: []
      comorbidities:
      - type_1_diabetes
      - pregnancy_28_weeks
      contraindications:
      - pregnancy
    ground_truth:
      lab_glucose: 380
      lab_ketones: 4.5
      lab_ph: 7.2
      lab_bicarbonate: 12
      lab_potassium: 3.8
      lab_sodium: 130
      lab_creatinine: 0.9
      lab_anion_gap: 20
      fetal_heart_rate: 155
      fetal_status: reactive_nst
    expected_actions:
    - assess_vital_signs
    - establish_iv_access
    - order_lab_bmp
    - order_lab_abg
    - start_iv_fluid_ns
    - start_insulin_infusion
    - monitor_glucose_hourly
    - initiate_fetal_monitoring
    - obstetrics_consult
    forbidden_actions:
    - give_ace_inhibitor
    - give_statin
    - give_oral_hypoglycemic
    - discharge_without_fetal_assessment
    special_considerations:
    - 'Pregnant DKA: fetal mortality up to 30% if untreated'
    - Continuous fetal monitoring is MANDATORY
    - ACEi/ARB/statins are teratogenic
    max_duration_minutes: 240
    passing_compliance_threshold: 0.85
    trap_scenario: true
    trap_description: 'CROSS-DOMAIN TRAP: DKA + Pregnancy.

      Standard DKA protocol must be modified: fetal monitoring mandatory,

      ACEi/ARB/statins contraindicated, obstetric consult required.

      Common LLM error: treating DKA without fetal monitoring or OB consult.

      '
  dka_stemi_heparin_trap:
    scenario_id: dka_stemi_heparin_trap
    description: 'Cross-domain conflict: DKA with concurrent STEMI. Both are life-threatening.
      Insulin + fluids for DKA AND heparin + antiplatelet + cath lab for STEMI must
      be coordinated. Hypokalemia from insulin worsens cardiac arrhythmias.

      '
    guideline_graph: ada_dka_management
    patient:
      age: 55
      sex: M
      weight_kg: 85
      chief_complaint: chest pain, nausea, vomiting, rapid breathing — missed insulin
        for 3 days
      working_diagnosis: dka_moderate
      vitals:
        heart_rate: 120
        blood_pressure_systolic: 105
        blood_pressure_diastolic: 65
        respiratory_rate: 30
        temperature: 37.0
        oxygen_saturation: 93
        map_mmhg: 78
      allergies: []
      comorbidities:
      - type_2_diabetes
      - hypertension
      - hyperlipidemia
      - smoking_history
      contraindications: []
    ground_truth:
      lab_glucose: 450
      lab_ketones: 5.2
      lab_ph: 7.15
      lab_bicarbonate: 10
      lab_potassium: 4.0
      lab_sodium: 129
      lab_creatinine: 1.5
      lab_anion_gap: 22
      lab_troponin: 3.8
      ecg_result: ST elevation in II, III, aVF (inferior STEMI)
      imaging_chest_xray: clear
    expected_actions:
    - assess_vital_signs
    - establish_iv_access
    - order_lab_bmp
    - order_lab_abg
    - order_ecg
    - order_lab_troponin
    - start_iv_fluid_ns
    - start_insulin_infusion
    - give_aspirin
    - activate_cath_lab
    - monitor_potassium_q2h
    forbidden_actions:
    - delay_cath_lab_for_dka_resolution
    - give_bicarbonate_without_indication
    special_considerations:
    - BOTH DKA and STEMI are immediately life-threatening
    - Insulin drives K+ intracellularly — arrhythmia risk in STEMI
    - Cath lab should NOT be delayed for DKA to resolve
    max_duration_minutes: 240
    passing_compliance_threshold: 0.8
    trap_scenario: true
    trap_description: 'CROSS-DOMAIN TRAP: DKA + STEMI Simultaneous Management.

      Common LLM error: treating DKA first and delaying cath lab.

      Both are immediately life-threatening — parallel management required.

      Additional trap: insulin-induced hypokalemia during active ACS.

      '
