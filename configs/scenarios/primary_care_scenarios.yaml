# ============================================================
# Global Configuration
# ============================================================
defaults:
  time_step_minutes: 5
  lab_result_delay_minutes: 30
  imaging_result_delay_minutes: 15
  enable_state_deterioration: true

harm_weights:
  minor: 0.1
  moderate: 0.4
  severe: 0.8
  catastrophic: 1.0

violation_taxonomy:
  # WHO ICPS / NCC MERP Compatible
  omission:
    description: "Required action not performed"
    base_weight: 0.7
  commission:
    description: "Forbidden/contraindicated action performed"
    base_weight: 1.0
  timing_delay:
    description: "Action performed after deadline"
    base_weight: 0.5
  sequence_error:
    description: "Actions performed in wrong order"
    base_weight: 0.6
  documentation_error:
    description: "Incorrect or missing documentation"
    base_weight: 0.3
