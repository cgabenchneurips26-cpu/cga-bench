    enable_state_deterioration: true

    medication_effects:
      - medication_pattern: "norepinephrine"
        target_vital: "map_mmhg"
        effect_min: 5.0
        effect_max: 15.0
      - medication_pattern: "crystalloid"
        target_vital: "map_mmhg"
        effect_min: 3.0
        effect_max: 8.0

    deterioration_rules:
      - vital: "map_mmhg"
        rate_min: 0.0
        rate_max: 2.5
        direction: "decrease"

    termination_conditions:
      - vital: "map_mmhg"
        threshold: 40.0
        condition: "less_than"
        reason: "patient_death"

    lab_thresholds:
      - test_code: "lactate"
        low: 0.0
        high: 2.0
      - test_code: "blood_culture"
        low: 0.0
        high: 0.0

    ground_truth:
      lab_lactate: 5.2
      lab_blood_culture: 1.0

    total_mandatory_count: 5

    violation_extractor_config:
      harm_severity_mappings:
        - action_pattern: "antibiotics"
          severity: "severe"
        - action_pattern: "crystalloid"
          severity: "major"
        - action_pattern: "lactate"
          severity: "major"
      timing_severity_thresholds:
        - max_delay_minutes: 15.0
          severity: "minor"
        - max_delay_minutes: 30.0
          severity: "moderate"
        - max_delay_minutes: 60.0
          severity: "major"
      default_deviation_severity: "moderate"
      default_deviation_preventability: 0.8

    harm_scorer_config:
      severity_weights:
        minor: 0.1
        moderate: 0.3
        major: 0.6
        severe: 0.85
        catastrophic: 1.0
      guideline_strength_weights:
        "I": 1.0
        "IIa": 0.75
        "IIb": 0.5
        "III": 0.25
        "null": 0.5
      violation_type_weights:
        omission: 0.8
        commission: 1.0
        timing: 0.7
        sequence: 0.6
        deviation: 0.4
