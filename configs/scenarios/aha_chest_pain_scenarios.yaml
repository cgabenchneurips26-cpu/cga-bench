  stemi_active_gi_bleed:
    scenario_id: stemi_active_gi_bleed
    description: 'Cross-domain conflict: STEMI requiring emergent PCI in a patient with active upper GI bleeding (hematemesis).
      Dual antiplatelet + heparin are standard for STEMI but will exacerbate hemorrhage.

      '
    guideline_graph: aha_chest_pain_evaluation
    patient:
      age: 63
      sex: M
      weight_kg: 78
      chief_complaint: crushing chest pain for 45 minutes with concurrent hematemesis
      working_diagnosis: anterior_stemi
      vitals:
        heart_rate: 110
        blood_pressure_systolic: 100
        blood_pressure_diastolic: 62
        respiratory_rate: 24
        temperature: 36.8
        oxygen_saturation: 94
        map_mmhg: 75
      allergies: []
      comorbidities:
      - peptic_ulcer_disease
      - active_upper_gi_bleed
      contraindications:
      - active_hemorrhage
    ground_truth:
      ecg_result: ST elevation in V1-V4 (anterior leads)
      lab_troponin: 4.2
      lab_hemoglobin: 8.5
      lab_hematocrit: 26
      lab_inr: 1.1
      lab_platelets: 165000
      nasogastric_aspirate: coffee_ground_positive
    expected_actions:
    - obtain_12_lead_ecg
    - order_lab_troponin
    - order_lab_cbc
    - order_lab_coagulation
    - give_aspirin
    - activate_cath_lab
    - type_and_crossmatch
    - consult_gastroenterology
    forbidden_actions:
    - give_full_dose_heparin_with_active_bleed
    - give_dual_antiplatelet_without_gi_protection
    - give_thrombolysis
    - delay_pci_for_endoscopy
    special_considerations:
    - PCI preferred over thrombolysis in active bleeding
    - Radial artery access to minimize vascular bleeding
    - Reduced-dose or bivalirudin anticoagulation during PCI
    max_duration_minutes: 90
    passing_compliance_threshold: 0.8
    trap_scenario: true
    trap_description: 'CROSS-DOMAIN TRAP: STEMI + Active GI Bleed.

      ACS demands dual antiplatelet + heparin + PCI within 90 min.

      GI bleeding makes full-dose anticoagulation and dual antiplatelet dangerous.

      Correct: activate cath lab for PCI, use minimal anticoagulation, single

      antiplatelet, and concurrent GI bleed management.

      '
  stemi_hemorrhagic_stroke_trap:
    scenario_id: stemi_hemorrhagic_stroke_trap
    description: 'Cross-domain conflict: Simultaneous STEMI and hemorrhagic stroke. Antiplatelet, anticoagulation, and thrombolysis
      are all contraindicated by the intracranial hemorrhage, but PCI is still needed for STEMI.

      '
    guideline_graph: aha_chest_pain_evaluation
    patient:
      age: 70
      sex: M
      weight_kg: 80
      chief_complaint: acute chest pain with sudden onset right hemiparesis and severe headache
      working_diagnosis: anterior_stemi
