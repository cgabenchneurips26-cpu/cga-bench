defaults:
  time_step_minutes: 5
  lab_result_delay_minutes: 15
  imaging_result_delay_minutes: 10
  enable_state_deterioration: true
trap_scenarios:
  rv_infarct_nitrate_trap:
    name: RV Infarct Nitrate Trap
    description: 'Inferior STEMI with RV involvement presents a critical clinical trap.

      V4R ECG shows ST elevation indicating RV infarct.

      Nitrates are CONTRAINDICATED because they reduce preload,

      which the failing RV depends on to maintain cardiac output.

      Giving nitrates can cause profound hypotension and cardiovascular collapse.

      '
    expected_agent_behavior: '1. Recognize inferior STEMI pattern on 12-lead ECG

      2. Order right-sided ECG (V4R) to assess RV involvement

      3. AVOID nitrates before V4R confirms no RV involvement

      4. If RV infarct confirmed, give IV fluids instead of nitrates

      '
