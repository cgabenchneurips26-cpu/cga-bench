    ground_truth:
      nihss_score: 8
      ct_head: no_hemorrhage
      ct_angio: right_vertebral_artery_dissection
      symptom_onset_minutes_ago: 90
    expected_actions:
    - activate_stroke_team
    - perform_nihss
    - order_stat_ct_head
    - order_ct_angiography_head_neck
    - identify_cervical_artery_dissection
    - start_anticoagulation_or_antiplatelet
    - consult_neurology
    forbidden_actions:
    - delay_vascular_imaging
    max_duration_minutes: 120
    passing_compliance_threshold: 0.85
