    - order_eeg_if_available
    forbidden_actions:
    - give_alteplase_without_ruling_out_mimic
    - give_tpa_for_todds_paralysis
    trap_description: 'Todd''s paralysis (postictal focal deficit) mimics acute stroke. tPA

      administration causes unnecessary bleeding risk. Witness history + seizure +

      gradual improvement over minutes/hours differentiates from stroke.

      '
    max_duration_minutes: 120
    passing_compliance_threshold: 0.85
  stroke_warfarin_reversal_choice_trap:
    scenario_id: stroke_warfarin_reversal_choice_trap
    description: Warfarin-associated ICH requiring urgent reversal - FFP alone is insufficient, 4-factor PCC is preferred
    guideline_graph: aha_stroke_2019
    trap_scenario: true
    patient:
      age: 75
      sex: F
      weight_kg: 80
      chief_complaint: sudden severe headache, vomiting, and left-sided weakness on warfarin
      working_diagnosis: intracerebral_hemorrhage
      vitals:
        heart_rate: 58
        blood_pressure_systolic: 205
        blood_pressure_diastolic: 112
        respiratory_rate: 18
        temperature: 37.0
        oxygen_saturation: 95
        map_mmhg: 143
      allergies: []
      comorbidities:
      - atrial_fibrillation
      - hypertension
      contraindications: []
    ground_truth:
      ct_head: right_basal_ganglia_hemorrhage_45ml
      inr: 3.8
      gcs: 12
    expected_actions:
    - activate_stroke_team
    - order_stat_ct_head
    - order_lab_coagulation
    - give_4_factor_pcc
    - give_vitamin_k_iv
    - neurosurgery_consult
    - admit_to_icu
    forbidden_actions:
    - give_ffp_as_sole_reversal
    - delay_reversal_for_inr_result
    - give_tpa
    trap_description: 'Warfarin-related ICH: FFP alone requires large volume (15ml/kg, 4-6 units)

      taking hours with volume overload risk. 4-factor PCC reverses INR in 15-30

      minutes with minimal volume. AHA/ASA guideline: PCC preferred over FFP.

      '
    max_duration_minutes: 90
    passing_compliance_threshold: 0.9
