scenarios:
  stroke_tpa_eligible:
    scenario_id: stroke_tpa_eligible
    description: Acute ischemic stroke within tPA window
    guideline_graph: aha_stroke_2019
    patient:
      age: 68
      sex: M
      weight_kg: 82
      chief_complaint: sudden left-sided weakness, speech difficulty
      working_diagnosis: acute_ischemic_stroke
      vitals:
        heart_rate: 88
        blood_pressure_systolic: 175
        blood_pressure_diastolic: 100
        respiratory_rate: 18
        temperature: 37.1
        oxygen_saturation: 96
        map_mmhg: 125
      allergies: []
      comorbidities:
      - hypertension
      - diabetes_type_2
      contraindications: []
    ground_truth:
      symptom_onset_minutes_ago: 90
      nihss_score: 12
      ct_head: no_hemorrhage
      ct_angio: mca_occlusion_left
      glucose: 145
      inr: 1.0
      platelets: 185000
    expected_actions:
    - activate_stroke_team
    - obtain_last_known_well_time
    - perform_nihss
    - check_glucose
    - order_stat_ct_head
    - review_inclusion_criteria
    - review_exclusion_criteria
    - obtain_informed_consent
    - give_alteplase_0.9mg_kg
    forbidden_actions:
    - give_antiplatelet_within_24h
    - give_anticoagulation_within_24h
    - delay_ct_for_labs
    deadlines:
      check_glucose: 10
      order_stat_ct_head: 25
      give_alteplase_0.9mg_kg: 60
    max_duration_minutes: 120
    passing_compliance_threshold: 0.9
