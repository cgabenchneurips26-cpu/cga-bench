    ground_truth:
      ct_head: left_basal_ganglia_hemorrhage_30ml
      inr: 2.8
      nihss_score: 16
      gcs: 12
    expected_actions:
    - order_imaging_ct_head
    - bp_reduction_target_140
    - reverse_anticoagulation_if_applicable
    - neurosurgery_consult
    optional_actions:
