  stroke_secondary_prevention:
    scenario_id: stroke_secondary_prevention
    description: Post-stroke secondary prevention with newly detected Afib
    guideline_graph: aha_stroke_2019
    patient:
      age: 68
      sex: F
      weight_kg: 65
      chief_complaint: follow-up after ischemic stroke
      working_diagnosis: ischemic_stroke_cryptogenic
      vitals:
        heart_rate: 88
        blood_pressure_systolic: 145
        blood_pressure_diastolic: 88
        respiratory_rate: 16
        temperature: 36.9
        oxygen_saturation: 97
        map_mmhg: 107
      allergies: []
      comorbidities:
      - hypertension
      contraindications: []
    ground_truth:
      cardiac_monitoring: paroxysmal_afib_detected
      carotid_duplex: mild_stenosis_40_percent
      chadsvasc_score: 5
      hasbled_score: 2
    expected_actions:
    - antiplatelet_therapy
    - statin_therapy
    - cardiac_monitoring_for_afib
    - calculate_chadsvasc
    - calculate_hasbled
    - start_doac_preferred
    forbidden_actions:
    - dual_antiplatelet_long_term_with_anticoagulation
    max_duration_minutes: 120
    passing_compliance_threshold: 0.85
  af_stroke_thrombolysis_conflict:
    scenario_id: af_stroke_thrombolysis_conflict
    description: 'Cross-domain conflict: Acute ischemic stroke eligible for tPA in a patient with newly discovered AF. After
      tPA, anticoagulation is contraindicated for 24 hours, but AF creates ongoing stroke risk.

      '
    guideline_graph: aha_stroke_2019
    patient:
      age: 74
      sex: F
      weight_kg: 78
      chief_complaint: sudden onset left-sided weakness and facial droop, irregularly irregular pulse
      working_diagnosis: acute_ischemic_stroke
      vitals:
        heart_rate: 98
        blood_pressure_systolic: 172
        blood_pressure_diastolic: 96
        respiratory_rate: 20
        temperature: 37.1
        oxygen_saturation: 95
        map_mmhg: 121
      allergies: []
      comorbidities:
      - hypertension
      - diabetes_type_2
      contraindications: []
    ground_truth:
      symptom_onset_minutes_ago: 100
      nihss_score: 10
      ct_head: no_hemorrhage
      ct_angio: m2_occlusion_right
      glucose: 155
      inr: 1.0
      platelets: 195000
      ecg_result: atrial_fibrillation_new_onset
      chadsvasc_score: 5
    expected_actions:
    - activate_stroke_team
    - perform_nihss
    - order_stat_ct_head
    - check_glucose
    - obtain_12_lead_ecg
    - review_inclusion_criteria
    - give_alteplase_0.9mg_kg
    - plan_anticoagulation_after_24h
    forbidden_actions:
    - give_anticoagulation_within_24h
    - give_antiplatelet_within_24h
    - start_doac_immediately
    - give_heparin_within_24h_of_tpa
    special_considerations:
    - tPA first — new AF does NOT change acute stroke management
    - 'After tPA: NO anticoagulation for 24 hours'
    - 'At 24h: repeat CT, then start DOAC for AF stroke prevention'
    max_duration_minutes: 120
    passing_compliance_threshold: 0.85
    trap_scenario: true
    trap_description: 'CROSS-DOMAIN TRAP: AF + Acute Stroke + tPA Timing Conflict.

      Stroke protocol says give tPA. AF management says start anticoagulation.

      But anticoagulation within 24h of tPA causes intracranial hemorrhage.

      Correct: give tPA, hold ALL antithrombotics for 24h, then start DOAC.

      '
  stroke_posterior_circulation_trap:
    scenario_id: stroke_posterior_circulation_trap
    description: Posterior circulation stroke with low NIHSS - undertriage trap due to NIHSS anterior circulation bias
    guideline_graph: aha_stroke_2019
    trap_scenario: true
    patient:
      age: 52
      sex: M
      weight_kg: 78
      chief_complaint: sudden onset vertigo, diplopia, dysarthria, and gait ataxia
      working_diagnosis: acute_ischemic_stroke
      vitals:
        heart_rate: 82
        blood_pressure_systolic: 165
        blood_pressure_diastolic: 95
        respiratory_rate: 18
        temperature: 37.0
        oxygen_saturation: 97
        map_mmhg: 118
      allergies: []
      comorbidities:
      - hypertension
      - hyperlipidemia
      contraindications: []
    ground_truth:
      nihss_score: 4
      ct_head: no_hemorrhage
      ct_angio: basilar_artery_occlusion
      symptom_onset_minutes_ago: 150
    expected_actions:
    - activate_stroke_team
    - perform_nihss
    - order_stat_ct_head
    - order_ct_angiography_head_neck
    - confirm_lvo_on_imaging
    - activate_neurointerventional_team
    forbidden_actions:
    - withhold_treatment_based_on_low_nihss
    - discharge_with_low_nihss
    trap_description: 'Posterior circulation stroke (basilar artery) is underestimated by NIHSS

      (anterior circulation bias). NIHSS 4 with basilar occlusion has >85% mortality.

      CTA is essential to detect LVO despite low NIHSS. Thrombectomy is required.

      '
    max_duration_minutes: 120
    passing_compliance_threshold: 0.85
  stroke_tpa_bp_uncontrolled_trap:
    scenario_id: stroke_tpa_bp_uncontrolled_trap
    description: Acute ischemic stroke tPA-eligible but persistent uncontrolled hypertension (SBP >185) - tPA contraindicated
      until BP controlled
    guideline_graph: aha_stroke_2019
    trap_scenario: true
    patient:
      age: 66
      sex: F
      weight_kg: 70
      chief_complaint: acute onset right hemiparesis and aphasia, persistent severe hypertension
      working_diagnosis: acute_ischemic_stroke
      vitals:
        heart_rate: 90
        blood_pressure_systolic: 210
        blood_pressure_diastolic: 120
        respiratory_rate: 20
        temperature: 37.1
        oxygen_saturation: 96
        map_mmhg: 150
      allergies: []
      comorbidities:
      - hypertension_poorly_controlled
      - diabetes_type_2
      contraindications: []
    ground_truth:
      nihss_score: 14
      ct_head: no_hemorrhage
      symptom_onset_minutes_ago: 120
      glucose: 165
    expected_actions:
    - activate_stroke_team
    - perform_nihss
    - order_stat_ct_head
    - attempt_bp_reduction
    - administer_iv_labetalol_or_nicardipine
    - reassess_bp_after_treatment
    forbidden_actions:
    - give_tpa_if_bp_uncontrolled
    - give_alteplase_with_sbp_above_185
    trap_description: 'tPA indication exists but SBP >185 or DBP >110 is a contraindication. Must

      attempt BP reduction first. If BP reaches <185/110, administer tPA. If

      uncontrollable, consider thrombectomy only.

      '
    max_duration_minutes: 120
    passing_compliance_threshold: 0.85
  stroke_mimicker_seizure:
    scenario_id: stroke_mimicker_seizure
