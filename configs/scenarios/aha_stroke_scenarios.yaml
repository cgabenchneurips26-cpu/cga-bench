      working_diagnosis: suspected_stroke
      vitals:
        heart_rate: 95
        blood_pressure_systolic: 155
        blood_pressure_diastolic: 88
        respiratory_rate: 18
        temperature: 37.2
        oxygen_saturation: 96
        map_mmhg: 110
      allergies: []
