      vitals:
        heart_rate: 110
        blood_pressure_systolic: 88
        blood_pressure_diastolic: 52
        respiratory_rate: 24
        temperature: 38.7
        oxygen_saturation: 93
        map_mmhg: 64
      allergies: []
