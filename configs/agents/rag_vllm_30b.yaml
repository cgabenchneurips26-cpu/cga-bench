# RAG Agent with vLLM Local Server Configuration (30B Model)
agent:
  type: "rag"
  agent_id: "rag_vllm_30b"

  # LLM Settings - vLLM local server (30B model on GPU 6,7)
  llm_backend: "vllm"
  llm_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  temperature: 0.1
  use_llm: true
  base_url: "http://localhost:8013/v1"  # 30B model server
  api_key: "sk-no-key-required"

  # RAG Settings
  top_k: 5
  use_bm25: true
  cpg_sources_path: null  # Use default path

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
