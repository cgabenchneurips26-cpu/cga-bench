# RAG Agent with Gemini 2.5 Pro (frontier — Google flagship)
# Tier 1 (Opus-class) benchmark model.
# thinking_budget=0 set in GeminiProvider for budget fairness.
agent:
  type: "rag"
  agent_id: "rag_gemini25pro"

  # LLM Settings
  llm_backend: "gemini"
  llm_model: "gemini-2.5-pro"
  temperature: 0.1
  use_llm: true

  # RAG Settings (matches v6 9-model regime exactly)
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings (matches v6 9-model regime exactly)
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
