# RAG Agent with GPT-5.4 (frontier — OpenAI flagship)
# Tier 1 (Opus-class) benchmark model.
# Note: gpt-5.5 is reasoning-only (temperature=1 enforced), gpt-5.5-pro is
# completions-only (not chat). gpt-5.4 is the strongest OpenAI chat model
# that supports temperature=0.1 for fair cross-vendor comparison.
agent:
  type: "rag"
  agent_id: "rag_gpt54"

  # LLM Settings
  llm_backend: "openai"
  llm_model: "gpt-5.4"
  temperature: 0.1
  use_llm: true

  # RAG Settings (matches v6 9-model regime exactly)
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings (matches v6 9-model regime exactly)
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
