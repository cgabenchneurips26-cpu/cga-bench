# RAG Agent with oss-120b (vLLM, GPU 2-5, port 8099)
agent:
  type: "rag"
  agent_id: "rag_oss120b"

  # LLM Settings
  llm_backend: "vllm"
  llm_model: "openai/gpt-oss-120b"
  temperature: 0.1
  use_llm: true
  base_url: "http://localhost:8099/v1"
  api_key: "sk-no-key-required"

  # RAG Settings
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
