# Oracle Agent (Rule-based Upper Bound)
agent:
  type: "oracle"
  agent_id: "oracle"

  # Oracle is rule-based, no LLM
  use_llm: false

  # CPG Engine Settings
  guideline_id: "ssc_sepsis"
  cpg_graph_path: null  # Set per scenario

  # Budget Settings (minimal as no LLM)
  max_actions_per_step: 5
  budget_limit_tokens: 0
  budget_limit_tool_calls: 100
