# RAG Agent with Claude Configuration
agent:
  type: "rag"
  agent_id: "rag_claude"

  # LLM Settings
  llm_backend: "anthropic"
  llm_model: "claude-3-5-sonnet-20241022"
  temperature: 0.1
  use_llm: true

  # RAG Settings
  top_k: 5
  use_bm25: true
  cpg_sources_path: null  # Use default path

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
