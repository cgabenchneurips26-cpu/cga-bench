# RAG Agent with vLLM Local Server Configuration
agent:
  type: "rag"
  agent_id: "rag_vllm"

  # LLM Settings - vLLM local server
  llm_backend: "vllm"
  llm_model: "openai/gpt-oss-120b"
  temperature: 0.1
  use_llm: true
  base_url: "http://localhost:28081/v1"  # vLLM server URL (oss-120b on GPU 4-7)
  api_key: "sk-no-key-required"

  # RAG Settings
  top_k: 5
  use_bm25: true
  cpg_sources_path: null  # Use default path

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
