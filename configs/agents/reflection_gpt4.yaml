# Reflection Agent with GPT-4 Configuration
agent:
  type: "reflection"
  agent_id: "reflection_gpt4"

  # LLM Settings
  llm_backend: "openai"
  llm_model: "gpt-4"
  temperature: 0.1
  use_llm: true

  # CPG Engine Settings
  guideline_id: "ssc_sepsis"
  cpg_graph_path: null  # Set per scenario

  # Reflection Settings
  max_reflection_rounds: 2
  reflection_threshold: 0.7

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 150000  # More budget for reflection rounds
  budget_limit_tool_calls: 75
