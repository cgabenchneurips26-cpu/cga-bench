# RAG Agent with Gemini 3 Pro (frontier — Google ceiling)
# Used by Stage S4 of the v8 frontier expansion.
# NOTE: requires LLMBackend.GEMINI / GeminiProvider in
# agent_runner/llm_provider.py (added in Phase A.1 of the v8 plan).
agent:
  type: "rag"
  agent_id: "rag_gemini3pro"

  # LLM Settings
  llm_backend: "gemini"
  llm_model: "gemini-3-pro-preview"
  temperature: 0.1
  use_llm: true

  # RAG Settings (matches v6 9-model regime exactly)
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings (matches v6 9-model regime exactly)
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
