# RAG Agent with Qwen3.5-35B-A3B-FP8 (vLLM, port 8013)
agent:
  type: "rag"
  agent_id: "rag_qwen35"

  # LLM Settings - Qwen3.5-35B on vLLM
  llm_backend: "vllm"
  llm_model: "Qwen/Qwen3.5-35B-A3B-FP8"
  temperature: 0.1
  use_llm: true
  base_url: "http://localhost:8013/v1"
  api_key: "sk-no-key-required"

  # RAG Settings
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
