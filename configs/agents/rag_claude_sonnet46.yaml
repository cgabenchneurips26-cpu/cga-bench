# RAG Agent with Claude Sonnet 4.6 (frontier — Anthropic efficient)
# Tier 2 (Sonnet-class) benchmark model.
agent:
  type: "rag"
  agent_id: "rag_claude_sonnet46"

  # LLM Settings
  llm_backend: "anthropic"
  llm_model: "claude-sonnet-4-6"
  temperature: 0.1
  use_llm: true

  # RAG Settings (matches v6 9-model regime exactly)
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings (matches v6 9-model regime exactly)
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
