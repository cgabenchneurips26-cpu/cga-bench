# RAG Agent with GPT-4o Configuration
agent:
  type: "rag"
  agent_id: "rag_gpt4o"

  # LLM Settings
  llm_backend: "openai"
  llm_model: "gpt-4o"
  temperature: 0.1
  use_llm: true

  # RAG Settings
  top_k: 5
  use_bm25: true
  cpg_sources_path: null  # Use default path

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
