# RAG Agent with GPT-5.4-mini (frontier — OpenAI mid-tier)
# Tier 2 (Sonnet-class) for 2x2 factorial design with Sonnet-4-6.
# Verified API responsiveness with T=0.1 (matches v6 9-model regime).
agent:
  type: "rag"
  agent_id: "rag_gpt54mini"

  # LLM Settings
  llm_backend: "openai"
  llm_model: "gpt-5.4-mini"
  temperature: 0.1
  use_llm: true

  # RAG Settings (matches v6 9-model regime exactly)
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings (matches v6 9-model regime exactly)
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
