# Planner Agent with GPT-4 Configuration
agent:
  type: "planner"
  agent_id: "planner_gpt4"

  # LLM Settings
  llm_backend: "openai"
  llm_model: "gpt-4"
  temperature: 0.1
  use_llm: true

  # CPG Engine Settings
  guideline_id: "ssc_sepsis"
  cpg_graph_path: null  # Set per scenario

  # Planning Settings
  plan_horizon_minutes: 60
  replan_threshold: 0.5

  # Budget Settings
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
