# RAG Agent with GPT-5.5-pro (frontier — OpenAI ceiling)
# Used by Stage S3 of the v8 frontier expansion.
agent:
  type: "rag"
  agent_id: "rag_gpt55pro"

  # LLM Settings
  llm_backend: "openai"
  llm_model: "gpt-5.5-pro-2026-04-23"
  temperature: 0.1
  use_llm: true

  # RAG Settings (matches v6 9-model regime exactly)
  top_k: 5
  use_bm25: true
  cpg_sources_path: null

  # Budget Settings (matches v6 9-model regime exactly)
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
