# RAG Agent with Qwen3-8B (vLLM, GPU 7, port 8101)
agent:
  type: "rag"
  agent_id: "rag_qwen8b"
  llm_backend: "vllm"
  llm_model: "Qwen/Qwen3-8B"
  temperature: 0.1
  use_llm: true
  base_url: "http://localhost:8101/v1"
  api_key: "sk-no-key-required"
  top_k: 5
  use_bm25: true
  cpg_sources_path: null
  max_actions_per_step: 3
  budget_limit_tokens: 100000
  budget_limit_tool_calls: 50
