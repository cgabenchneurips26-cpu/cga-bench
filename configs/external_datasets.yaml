default_eval_mode: track_a_only
default_access_level: public

datasets:
  amega:
    name: AMEGA
    license: evaluation-only
    access_level: public
    task_type: open_qa
    eval_mode: derived_track_b
    sub_score_mask:
      c1: true
      c2: true
      c3: true
      c4: false
      c5: false
    notes:
      - Question-level granularity
      - Criteria: action/assessment/explanation

  clibench:
    name: CliBench
    license: PhysioNet Credentialed Health Data License
    access_level: credentialed
    task_type: multilabel_action
    eval_mode: derived_track_b
    sub_score_mask:
      c1: true
      c2: true
      c3: false
      c4: false
      c5: false
    notes:
      - MIMIC-IV derived
      - Namespace: dx/proc/lab/med

  medguide:
    name: MedGUIDE
    license: Check NCCN permission
    access_level: public
    task_type: mcq_path
    eval_mode: derived_track_b
    domain_hint: oncology
    sub_score_mask:
      c1: true
      c2: true
      c3: false
      c4: false
      c5: false

  cancerguide:
    name: CancerGUIDE
    access_level: public
    task_type: longitudinal_text
    eval_mode: track_a_only
    domain_hint: oncology

  mtbbench:
    name: MTBBench
    access_level: credentialed
    task_type: multimodal_longitudinal
    eval_mode: track_a_only
    domain_hint: oncology

  ehrstruct:
    name: EHRStruct
    license: CC BY-NC 4.0
    access_level: public
    task_type: structured_ehr
    eval_mode: safety_only
    sub_score_mask:
      c1: false
      c2: false
      c3: false
      c4: false
      c5: false

  llmeval_med:
    name: LLMEval-Med
    access_level: public
    task_type: open_qa
    eval_mode: track_a_only
    sub_score_mask:
      c1: false
      c2: true
      c3: true
      c4: false
      c5: false

  nice:
    name: NICE Silver-Standard
    access_level: public
    task_type: triplet_qa
    eval_mode: derived_track_b
    sub_score_mask:
      c1: true
      c2: true
      c3: false
      c4: false
      c5: false
