# Allergy -> Contraindicated Drug Mapping
# Used by ConstraintDerivationEngine for allergy-based forbidden actions.
#
# Each key is an allergy (as stored in patient.allergies).
# Each value is a list of drug names that are contraindicated.
# The engine prepends "give_" to each drug when creating FORBIDDEN constraints.

penicillin:
  - penicillin
  - amoxicillin
  - ampicillin

penicillin_anaphylaxis:
  - penicillin
  - amoxicillin
  - ampicillin
  - cephalosporin
  - ceftriaxone
  - cefepime
  - cefazolin
  - ceftazidime
  - piperacillin_tazobactam

aspirin:
  - aspirin

nsaids:
  - ibuprofen
  - naproxen
  - ketorolac
  - celecoxib
  - diclofenac
  - indomethacin

sulfa:
  - trimethoprim_sulfamethoxazole
  - sulfasalazine
  - sulfadiazine

ace_inhibitor_angioedema:
  - enalapril
  - lisinopril
  - ramipril
  - captopril
  - benazepril

heparin_hit:
  - heparin
  - enoxaparin
  - dalteparin
  - fondaparinux

vancomycin_red_man_syndrome:
  - vancomycin_rapid_infusion

latex:
  - latex_gloves
  - latex_equipment

contrast_dye:
  - iodinated_contrast
  - gadolinium

morphine:
  - morphine
  - codeine

fluoroquinolone:
  - ciprofloxacin
  - levofloxacin
  - moxifloxacin

aminoglycoside:
  - gentamicin
  - tobramycin
  - amikacin

tetracycline:
  - doxycycline
  - tetracycline
  - minocycline

metformin:
  - metformin

statin:
  - atorvastatin
  - rosuvastatin
  - simvastatin

egg:
  - propofol

soy:
  - propofol
