graph_id: eau_obstructive_pyelonephritis_2024
guideline_name: EAU 2024 Guidelines on Urological Infections — Obstructive Pyelonephritis
version: '2024.1'
metadata:
  source: European Association of Urology Urological Infections Guidelines 2024
  doi: 10.1016/j.eururo.2024.02.005
  journal: European Urology
  recommendation_system: GRADE
  description: Management of obstructive pyelonephritis including empiric antibiotics, urgent decompression, and culture-directed
    therapy
  key_evidence: Urgent decompression reduces mortality in obstructive pyelonephritis with urosepsis. Percutaneous nephrostomy
    and ureteral stenting have equivalent decompression efficacy (Pearle et al., J Urol 1998).
  target_population:
    age_group: adult
    max_age: 120
    min_age: 18
    sex: any
    special_conditions: []
entry_node: initial_assessment
nodes:
  initial_assessment:
    node_id: initial_assessment
    node_type: decision
    name: Obstructive Pyelonephritis Recognition & Sepsis Screen
    description: 'Identify obstructive pyelonephritis: flank pain, fever, pyuria with hydronephrosis on imaging. Screen for
      urosepsis using qSOFA/SIRS.'
    precondition: null
    mandatory_actions:
    - assess_vital_signs
    - order_lab_urinalysis_culture
    - order_lab_blood_culture
    - order_lab_cbc
    - order_lab_creatinine
    allowed_actions:
    - assess_vital_signs
    - establish_iv_access
    - order_lab_urinalysis_culture
    - order_lab_procalcitonin
    - order_lab_cbc
    - order_lab_lactate
    - order_lab_blood_culture
    - order_lab_coagulation
    - order_lab_bmp
    - order_lab_creatinine
    forbidden_actions: []
    deadlines:
      assess_vital_signs: 10
      order_lab_urinalysis_culture: 30
      order_lab_blood_culture: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: EAU Urological Infections Guidelines 2024
    source_section: 3.4.3 Complicated UTI / Obstructive Pyelonephritis
    source_page: null
    source_quote: Obstructive pyelonephritis is a urological emergency. Blood cultures and urine cultures should be obtained
      before antibiotics.
    next_nodes:
    - empiric_antibiotics
    conditional_next: {}
  empiric_antibiotics:
    node_id: empiric_antibiotics
    node_type: action
    name: Empiric IV Antibiotics Within 1 Hour
    description: Administer broad-spectrum IV antibiotics within 1 hour of recognition for suspected urosepsis. Ceftriaxone
      or piperacillin-tazobactam are first-line.
    precondition: null
    mandatory_actions:
    - give_iv_antibiotics_empiric
    allowed_actions:
    - give_meropenem_iv_if_esbl
    - give_iv_fluids_resuscitation
    - give_iv_antibiotics_empiric
    - give_piperacillin_tazobactam_iv
    - give_ceftriaxone_iv
    - give_analgesic
    forbidden_actions:
    - give_oral_antibiotics_only
    deadlines:
      give_iv_antibiotics_empiric: 60
    required_prior_actions:
      give_iv_antibiotics_empiric:
      - order_lab_blood_culture
    recommendation_class: I
    evidence_level: A
    source_guideline: EAU Urological Infections Guidelines 2024
    source_section: 3.4.7 Antimicrobial Therapy
    source_page: null
    source_quote: Empiric parenteral therapy should be initiated immediately in patients with suspected urosepsis. Cultures
      must be obtained prior to antibiotics.
    next_nodes:
    - imaging_assessment
    conditional_next: {}
  imaging_assessment:
    node_id: imaging_assessment
    node_type: enquiry
    name: Imaging to Confirm Obstruction
    description: CT abdomen/pelvis (preferred) or renal ultrasound to identify obstruction site and cause (stone, tumor, stricture).
    precondition: null
    mandatory_actions:
    - order_imaging_ct_abdomen_pelvis
    allowed_actions:
    - order_imaging_renal_ultrasound
    - order_imaging_kub_xray
    - order_imaging_ct_abdomen_pelvis
    - reassess_vital_signs
    forbidden_actions: []
    deadlines:
      order_imaging_ct_abdomen_pelvis: 120
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: EAU Urological Infections Guidelines 2024
    source_section: 3.4.4 Diagnostic Imaging
    source_page: null
    source_quote: CT without contrast is the gold standard for detecting urinary obstruction. Ultrasound is an alternative
      if CT is contraindicated.
    next_nodes: []
    conditional_next:
      state.obstruction_confirmed == True: urgent_decompression
      state.obstruction_confirmed == False: monitoring_reassessment
  urgent_decompression:
    node_id: urgent_decompression
    node_type: action
    name: Urgent Urinary Tract Decompression
    description: Emergent decompression via percutaneous nephrostomy or ureteral stent. Definitive stone treatment should
      be deferred until sepsis resolves.
    precondition: null
    mandatory_actions:
    - perform_urinary_decompression
    allowed_actions:
    - consult_urology
    - perform_urinary_decompression
    - give_iv_fluids_resuscitation
    - perform_percutaneous_nephrostomy
    - consult_interventional_radiology
    - reassess_vital_signs
    - perform_ureteral_stent_placement
    forbidden_actions:
    - perform_definitive_stone_surgery_during_sepsis
    - perform_lithotripsy_during_sepsis
    deadlines:
      perform_urinary_decompression: 360
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: A
    source_guideline: EAU Urological Infections Guidelines 2024
    source_section: 3.4.5 Drainage of Obstructed Kidney
    source_page: null
    source_quote: Urgent decompression of the obstructed collecting system is mandatory in patients with obstructive pyelonephritis/urosepsis.
      Definitive stone treatment should be delayed until the patient has recovered.
    next_nodes:
    - monitoring_reassessment
    conditional_next: {}
  monitoring_reassessment:
    node_id: monitoring_reassessment
    node_type: enquiry
    name: Clinical Monitoring & Culture-Directed Therapy
    description: Monitor clinical response at 48-72h, de-escalate to culture-directed antibiotics when susceptibilities available.
    precondition: null
    mandatory_actions:
    - reassess_clinical_response
    - review_culture_susceptibilities
    allowed_actions:
    - monitor_urine_output
    - review_culture_susceptibilities
    - de_escalate_antibiotics
    - order_lab_cbc
    - order_lab_creatinine
    - reassess_vital_signs
    - reassess_clinical_response
    forbidden_actions: []
    deadlines:
      reassess_clinical_response: 4320
      review_culture_susceptibilities: 4320
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: EAU Urological Infections Guidelines 2024
    source_section: 3.4.7.2 De-escalation
    source_page: null
    source_quote: Antimicrobial therapy should be adjusted according to culture results. Clinical improvement expected within
      48-72 hours of decompression.
    next_nodes:
    - disposition
    conditional_next: {}
  disposition:
    node_id: disposition
    node_type: decision
    name: Disposition & Follow-Up Planning
    description: Assess resolution of sepsis, plan definitive treatment (stone removal, stent exchange), schedule follow-up
      imaging.
    precondition: null
    mandatory_actions:
    - assess_sepsis_resolution
    allowed_actions:
    - plan_definitive_stone_treatment
    - assess_sepsis_resolution
    - transition_to_oral_antibiotics
    - schedule_followup_imaging
    - arrange_outpatient_urology_followup
    forbidden_actions: []
    deadlines: {}
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: EAU Urological Infections Guidelines 2024
    source_section: 3.4.8 Follow-Up
    source_page: null
    source_quote: Patients should be followed up with imaging to ensure stone clearance and resolution of obstruction after
      definitive treatment.
    next_nodes: []
    conditional_next: {}
