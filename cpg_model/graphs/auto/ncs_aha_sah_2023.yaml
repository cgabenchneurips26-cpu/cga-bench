graph_id: ncs_aha_sah_2023
guideline_name: 2023 Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage (AHA/ASA)
version: '2023.1'
metadata:
  source: AHA/ASA SAH Guidelines 2023
  doi: 10.1161/STR.0000000000000436
  journal: Stroke
  recommendation_system: AHA Class/Level
  description: Comprehensive guideline for aneurysmal SAH management including acute stabilization, aneurysm securing, vasospasm
    prevention, and rehabilitation
  key_evidence: Nimodipine reduces poor outcome after SAH (OR 0.67). Early aneurysm treatment (<24h) reduces rebleeding. Prophylactic
    hypervolemia/triple-H has no benefit (Class III).
  target_population:
    age_group: adult
    max_age: 120
    min_age: 18
    sex: any
    special_conditions: []
entry_node: initial_assessment
nodes:
  initial_assessment:
    node_id: initial_assessment
    node_type: decision
    name: SAH Recognition & Severity Assessment
    description: Confirm SAH diagnosis, assess Hunt-Hess / WFNS grade, identify aneurysm
    precondition: null
    mandatory_actions:
    - assess_neurological_status
    - order_imaging_ct_head
    - assess_hunt_hess_grade
    allowed_actions:
    - assess_hunt_hess_grade
    - order_imaging_ct_head
    - order_lab_cbc
    - order_imaging_ct_angiography
    - assess_vital_signs
    - establish_iv_access
    - order_lab_bmp
    - assess_neurological_status
    - order_lab_coagulation
    - order_lab_type_and_screen
    forbidden_actions: []
    deadlines:
      assess_neurological_status: 15
      order_imaging_ct_head: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AHA/ASA SAH Guidelines 2023
    source_section: Initial Evaluation
    source_page: null
    source_quote: Non-contrast CT has >95% sensitivity for SAH within 6 hours. CT angiography should be performed urgently
      to identify source
    next_nodes: []
    conditional_next:
      state.hunt_hess_grade >= 4: high_grade_sah_bundle
      state.hunt_hess_grade <= 3: standard_sah_bundle
    _quote_verification:
      status: UNGROUNDED
      score: 0.273
  standard_sah_bundle:
    node_id: standard_sah_bundle
    node_type: plan
    name: Standard SAH Management (Hunt-Hess I-III)
    description: Blood pressure control, nimodipine, aneurysm securing, vasospasm prevention
    precondition: state.hunt_hess_grade <= 3
    mandatory_actions:
    - control_blood_pressure_sbp_below_160
    - give_nimodipine_60mg_q4h
    - order_imaging_ct_angiography
    - request_neurosurgery_consultation
    allowed_actions:
    - give_antiepileptic_prophylaxis
    - order_lab_cbc
    - order_imaging_ct_angiography
    - place_external_ventricular_drain
    - request_neurosurgery_consultation
    - give_nimodipine_60mg_q4h
    - control_blood_pressure_sbp_below_160
    - give_tranexamic_acid_short_term
    - order_transcranial_doppler
    - order_lab_bmp
    - order_lab_coagulation
    - maintain_euvolemia
    forbidden_actions:
    - give_antiplatelet_before_securing
    - give_anticoagulant_before_securing
    - lumbar_puncture_with_mass_effect
    deadlines:
      control_blood_pressure_sbp_below_160: 30
      give_nimodipine_60mg_q4h: 60
      order_imaging_ct_angiography: 60
      request_neurosurgery_consultation: 60
    required_prior_actions:
      give_antiepileptic_prophylaxis:
      - assess_neurological_status
    recommendation_class: I
    evidence_level: A
    source_guideline: AHA/ASA SAH Guidelines 2023
    source_section: 'Recommendation 3.1-3.4: BP Control, Nimodipine, Securing'
    source_page: null
    source_quote: "Prompt evaluation, identification of aneurysmal \nsource, and treatment of the ruptured aneurysm \nare\
      \ recommended, preferably within 24 hours. The \ngoal of treatment should be complete obliteration \nwhenever feasible\
      \ to reduce the risk of rebleeding \nand retreatment."
    next_nodes:
    - vasospasm_monitoring
    conditional_next: {}
    _quote_verification:
      status: GROUNDED
      method: keyword_overlap
      score: 0.4
  high_grade_sah_bundle:
    node_id: high_grade_sah_bundle
    node_type: plan
    name: High-Grade SAH Management (Hunt-Hess IV-V)
    description: Aggressive management including EVD, ICP monitoring, early securing
    precondition: state.hunt_hess_grade >= 4
    mandatory_actions:
    - secure_airway_intubation
    - control_blood_pressure_sbp_below_160
    - give_nimodipine_60mg_q4h
    - place_external_ventricular_drain
    - request_neurosurgery_consultation
    allowed_actions:
    - give_osmotic_therapy_mannitol
    - order_lab_cbc
    - order_imaging_ct_angiography
    - place_external_ventricular_drain
    - request_neurosurgery_consultation
    - give_hypertonic_saline
    - monitor_icp
    - give_nimodipine_60mg_q4h
    - control_blood_pressure_sbp_below_160
    - give_tranexamic_acid_short_term
    - order_lab_bmp
    - order_lab_coagulation
    - maintain_euvolemia
    - secure_airway_intubation
    forbidden_actions:
    - give_antiplatelet_before_securing
    - give_anticoagulant_before_securing
    - lumbar_puncture_with_mass_effect
    deadlines:
      secure_airway_intubation: 15
      control_blood_pressure_sbp_below_160: 30
      place_external_ventricular_drain: 60
      give_nimodipine_60mg_q4h: 60
      request_neurosurgery_consultation: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AHA/ASA SAH Guidelines 2023
    source_section: 'Recommendation 4.1-4.3: High-Grade SAH'
    source_page: null
    source_quote: "Acute rebleeding after initial aSAH is associated \nwith increased mortality and poor clinical outcomes.\
      \ Prompt evaluation, identification of aneurysmal \nsource, and treatment of the ruptured aneurysm \nare recommended,\
      \ preferably within 24 hours."
    next_nodes:
    - vasospasm_monitoring
    conditional_next: {}
    _quote_verification:
      status: GROUNDED
      method: keyword_overlap
      score: 0.5
  vasospasm_monitoring:
    node_id: vasospasm_monitoring
    node_type: enquiry
    name: Vasospasm Monitoring (Days 3-14)
    description: Monitor for delayed cerebral ischemia / vasospasm
    precondition: null
    mandatory_actions:
    - order_transcranial_doppler
    - assess_neurological_status
    allowed_actions:
    - order_imaging_ct_perfusion
    - give_nimodipine_60mg_q4h
    - order_lab_cbc
    - induced_hypertension_for_dci
    - order_imaging_ct_angiography
    - order_transcranial_doppler
    - order_lab_bmp
    - assess_neurological_status
    - maintain_euvolemia
    forbidden_actions:
    - prophylactic_hypervolemia
    - prophylactic_balloon_angioplasty
    deadlines:
      order_transcranial_doppler: 1440
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AHA/ASA SAH Guidelines 2023
    source_section: 'Recommendation 5: DCI / Vasospasm'
    source_page: null
    source_quote: TCD monitoring to detect vasospasm. Induced hypertension is reasonable for symptomatic vasospasm. Prophylactic
      hypervolemia is NOT recommended (Class III, Level B)
    next_nodes:
    - disposition
    conditional_next: {}
    _quote_verification:
      status: UNGROUNDED
      score: 0.357
  disposition:
    node_id: disposition
    node_type: decision
    name: Disposition
    description: Assess readiness for step-down, rehab, or continued ICU care
    precondition: null
    mandatory_actions:
    - assess_discharge_readiness
    allowed_actions:
    - schedule_follow_up_imaging
    - assess_discharge_readiness
    - arrange_rehabilitation
    - continue_nimodipine_21days
    forbidden_actions: []
    deadlines: {}
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AHA/ASA SAH Guidelines 2023
    source_section: Disposition
    source_page: null
    source_quote: Patients should be cared for in high-volume centers with neurosurgical and endovascular capabilities
    next_nodes: []
    conditional_next: {}
    _quote_verification:
      status: UNGROUNDED
      score: 0.375
