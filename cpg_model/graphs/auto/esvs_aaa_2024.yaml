metadata:
  source: ESVS AAA Guidelines 2024
  doi: 10.1093/ejves/zvad368
  journal: European Journal of Vascular and Endovascular Surgery
  recommendation_system: GRADE
  description: Evidence-based guideline for ruptured AAA including permissive hypotension, emergent repair strategies, and
    post-operative management
  key_evidence: Permissive hypotension (SBP 80-100) reduces mortality vs aggressive resuscitation. EVAR has 30-day mortality
    advantage (24% vs 37%). Time to OR <90 min critical.
