graph_id: who_severe_malaria_2023
guideline_name: WHO 2023 Guidelines for the Treatment of Severe Malaria
version: '2023.1'
metadata:
  source: WHO Severe Malaria Treatment Guidelines 2023
  doi: 10.1016/S1473-3099(23)00553-1
  journal: The Lancet Infectious Diseases
  recommendation_system: WHO GRADE
  description: Evidence-based guideline for severe malaria treatment emphasizing IV artesunate as first-line, cautious fluid
    management, and hypoglycemia prevention
  key_evidence: 'AQUAMAT trial: artesunate reduces mortality 22.5% vs 30.5% quinine in African children. SEAQUAMAT: 15% vs
    22% in Asian adults. FEAST trial: fluid bolus harmful in severe malaria. Steroids harmful in cerebral malaria.'
  target_population:
    age_group: adult
    max_age: 120
    min_age: 18
    sex: any
    special_conditions: []
entry_node: initial_assessment
nodes:
  initial_assessment:
    node_id: initial_assessment
    node_type: decision
    name: Severe Malaria Recognition
    description: Confirm parasitemia (RDT/microscopy), assess severity criteria (cerebral, severe anemia, ARDS, renal failure,
      shock)
    precondition: null
    mandatory_actions:
    - confirm_parasitemia_rdt_or_smear
    - assess_vital_signs
    - assess_severity_criteria
    allowed_actions:
    - assess_severity_criteria
    - confirm_parasitemia_rdt_or_smear
    - assess_mental_status
    - order_lab_cbc
    - assess_vital_signs
    - order_lab_blood_gas
    - establish_iv_access
    - order_lab_bmp
    - order_lab_coagulation
    - order_lab_lactate
    - order_lab_glucose
    forbidden_actions: []
    deadlines:
      confirm_parasitemia_rdt_or_smear: 15
      assess_vital_signs: 10
      assess_severity_criteria: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: WHO Severe Malaria Guidelines 2023
    source_section: Diagnosis & Severity Assessment
    source_page: null
    source_quote: 'Severe malaria defined by: parasitemia + one or more severity criteria (cerebral malaria, severe anemia
      Hb<5, respiratory distress, shock, renal failure, hypoglycemia, acidosis)'
    next_nodes:
    - artesunate_initiation
    conditional_next: {}
  artesunate_initiation:
    node_id: artesunate_initiation
    node_type: plan
    name: IV Artesunate Initiation (FIRST LINE)
    description: IV artesunate 2.4 mg/kg at 0, 12, 24h then daily - NOT quinine as first line
    precondition: null
    mandatory_actions:
    - give_iv_artesunate_2_4mg_kg
    - check_glucose_immediately
    - order_lab_cbc
    allowed_actions:
    - monitor_vital_signs_q1h
    - assess_mental_status
    - order_lab_cbc
    - check_glucose_immediately
    - order_lab_blood_gas
    - establish_iv_access
    - order_lab_bmp
    - order_lab_lactate
    - give_iv_artesunate_2_4mg_kg
    forbidden_actions:
    - give_quinine_as_first_line
    - give_oral_act_for_severe_malaria
    - give_aggressive_iv_fluid_bolus
    deadlines:
      give_iv_artesunate_2_4mg_kg: 60
      check_glucose_immediately: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: A
    source_guideline: WHO Severe Malaria Guidelines 2023
    source_section: 'Recommendation 1: Antimalarial Treatment'
    source_page: null
    source_quote: 'IV artesunate (2.4 mg/kg at 0, 12, 24h then daily) is the treatment of choice for severe malaria (strong
      recommendation). AQUAMAT/SEAQUAMAT trials: 35% mortality reduction vs quinine'
    next_nodes:
    - supportive_management
    conditional_next: {}
  supportive_management:
    node_id: supportive_management
    node_type: plan
    name: Supportive Management
    description: Correct hypoglycemia, manage fluids cautiously, treat complications
    precondition: null
    mandatory_actions:
    - monitor_glucose_q4h
    - give_maintenance_iv_fluids_cautious
    allowed_actions:
    - initiate_rrt_if_renal_failure
    - give_transfusion_if_hb_below_5
    - order_lab_bmp_q12h
    - assess_mental_status
    - order_lab_cbc_q12h
    - manage_seizures_if_present
    - give_dextrose_bolus_if_hypoglycemic
    - give_maintenance_iv_fluids_cautious
    - order_lab_lactate
    - monitor_glucose_q4h
    forbidden_actions:
    - give_aggressive_iv_fluid_bolus
    - give_steroids_for_cerebral_malaria
    deadlines:
      monitor_glucose_q4h: 240
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: A
    source_guideline: WHO Severe Malaria Guidelines 2023
    source_section: 'Recommendation 2-4: Supportive Care'
    source_page: null
    source_quote: Avoid aggressive IV fluids (increases pulmonary edema risk in severe malaria, FEAST trial). Monitor glucose
      q4h. Steroids NOT recommended for cerebral malaria (no benefit, increased harm)
    next_nodes:
    - monitoring
    conditional_next: {}
    conditional_rules:
    - rule_id: MALARIA-HYPOGLYCEMIA
      condition: state.glucose_mg_dl < 60
      effect:
        type: REQUIRED
        actions:
        - give_dextrose_bolus_if_hypoglycemic
        deadline_minutes: 15
      severity: CRITICAL
      description: Hypoglycemia (<60 mg/dL) is common in severe malaria (quinine/falciparum-induced). Give 25% dextrose 2
        mL/kg IV
      evidence: Class I, Level A
    - rule_id: MALARIA-SEVERE-ANEMIA
      condition: state.hemoglobin_g_dl < 5
      effect:
        type: REQUIRED
        actions:
        - give_transfusion_if_hb_below_5
        deadline_minutes: 120
      severity: CRITICAL
      description: Severe anemia (Hb<5) requires blood transfusion
      evidence: Class I, Level A
  monitoring:
    node_id: monitoring
    node_type: enquiry
    name: Parasitemia Monitoring & Follow-Up
    description: Serial parasitemia (q12h until cleared), organ function monitoring, post-artesunate hemolysis watch
    precondition: null
    mandatory_actions:
    - order_parasite_count_q12h
    - monitor_glucose_q4h
    allowed_actions:
    - order_lab_cbc_daily
    - order_lab_bmp_daily
    - assess_mental_status
    - order_lab_ldh_haptoglobin_for_hemolysis
    - monitor_glucose_q4h
    - monitor_urine_output
    - monitor_vital_signs_q4h
    - order_parasite_count_q12h
    forbidden_actions: []
    deadlines:
      order_parasite_count_q12h: 720
      monitor_glucose_q4h: 240
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: WHO Severe Malaria Guidelines 2023
    source_section: Monitoring
    source_page: null
    source_quote: Serial parasite counts q12h until negative. Post-artesunate delayed hemolysis (PADH) may occur 7-14 days
      post-treatment; monitor Hb weekly for 4 weeks
    next_nodes:
    - disposition
    conditional_next: {}
  disposition:
    node_id: disposition
    node_type: decision
    name: Disposition & Transition to Oral ACT
    description: Transition to oral ACT after ≥24h IV artesunate and parasite clearance, PADH surveillance
    precondition: null
    mandatory_actions:
    - assess_transition_to_oral_act
    allowed_actions:
    - assess_transition_to_oral_act
    - assess_discharge_readiness
    - provide_malaria_prevention_counseling
    - give_oral_act_3day_course
    - schedule_hemolysis_surveillance_weekly
    forbidden_actions: []
    deadlines: {}
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: WHO Severe Malaria Guidelines 2023
    source_section: Transition & Discharge
    source_page: null
    source_quote: Transition to oral ACT after ≥24h IV artesunate, when patient can tolerate oral medication. Complete 3-day
      oral ACT course. Monitor for PADH at day 7, 14, 21, 28
    next_nodes: []
    conditional_next: {}
