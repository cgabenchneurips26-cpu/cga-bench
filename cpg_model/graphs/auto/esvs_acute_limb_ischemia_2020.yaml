graph_id: esvs_acute_limb_ischemia_2020
guideline_name: ESVS 2020 Clinical Practice Guidelines on Acute Limb Ischemia
version: '2020.1'
metadata:
  source: ESVS Acute Limb Ischemia Guidelines 2020
  doi: 10.1016/j.ejvs.2019.09.006
  journal: European Journal of Vascular and Endovascular Surgery
  recommendation_system: GRADE
  description: Evidence-based guideline for acute limb ischemia including Rutherford classification, anticoagulation, revascularization,
    and compartment syndrome management
  key_evidence: Immediate heparin prevents thrombus propagation. Rutherford IIb requires emergent surgery (<6h). Compartment
    syndrome in 10-20%. Revascularization of Rutherford III causes lethal reperfusion injury.
  target_population:
    age_group: adult
    max_age: 120
    min_age: 18
    sex: any
    special_conditions: []
entry_node: initial_assessment
nodes:
  initial_assessment:
    node_id: initial_assessment
    node_type: decision
    name: Acute Limb Ischemia Assessment (6Ps)
    description: Assess 6Ps (Pain, Pallor, Pulselessness, Paresthesia, Paralysis, Poikilothermia), Rutherford classification
    precondition: null
    mandatory_actions:
    - assess_6ps
    - assess_rutherford_classification
    - assess_vital_signs
    allowed_actions:
    - assess_ankle_brachial_index
    - assess_rutherford_classification
    - order_lab_cbc
    - order_ecg
    - assess_vital_signs
    - establish_iv_access
    - order_lab_bmp
    - order_lab_coagulation
    - assess_6ps
    - order_lab_lactate
    - order_lab_ck
    forbidden_actions: []
    deadlines:
      assess_6ps: 10
      assess_rutherford_classification: 15
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: Initial Assessment
    source_page: null
    source_quote: 'Clinical assessment should be immediate using the 6Ps and Rutherford classification: I (viable), IIa (marginally
      threatened), IIb (immediately threatened), III (irreversible)'
    next_nodes: []
    conditional_next:
      state.rutherford_class == 'III': irreversible_ischemia
      state.rutherford_class in ('IIa', 'IIb'): anticoagulation_imaging
  anticoagulation_imaging:
    node_id: anticoagulation_imaging
    node_type: plan
    name: Immediate Heparin & Vascular Imaging
    description: Systemic heparin within 30min, CTA or duplex for operative planning
    precondition: null
    mandatory_actions:
    - give_heparin_bolus_80u_kg
    - order_imaging_cta_lower_extremity
    - request_vascular_surgery_consultation
    allowed_actions:
    - order_imaging_cta_lower_extremity
    - give_heparin_bolus_80u_kg
    - order_imaging_duplex_ultrasound
    - order_lab_bmp
    - start_heparin_infusion
    - order_lab_ptt
    - give_iv_analgesia
    - request_vascular_surgery_consultation
    - order_lab_ck
    forbidden_actions:
    - delay_heparin_for_imaging
    deadlines:
      give_heparin_bolus_80u_kg: 30
      order_imaging_cta_lower_extremity: 60
      request_vascular_surgery_consultation: 60
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: 'Recommendation 1-2: Anticoagulation & Imaging'
    source_page: null
    source_quote: Immediate systemic heparin is recommended to prevent thrombus propagation (Class I, Level B). CTA provides
      anatomical roadmap for revascularization planning
    next_nodes: []
    conditional_next:
      state.rutherford_class == 'IIb': emergent_revascularization
      state.rutherford_class == 'IIa': urgent_revascularization
  urgent_revascularization:
    node_id: urgent_revascularization
    node_type: plan
    name: Urgent Revascularization (Rutherford IIa)
    description: Surgical embolectomy or catheter-directed thrombolysis within 6-24h
    precondition: state.rutherford_class == 'IIa'
    mandatory_actions:
    - plan_revascularization_strategy
    - continue_heparin_infusion
    allowed_actions:
    - continue_heparin_infusion
    - plan_revascularization_strategy
    - order_lab_bmp
    - perform_catheter_directed_thrombolysis
    - order_lab_ck
    - monitor_limb_perfusion
    - perform_surgical_embolectomy
    - give_iv_analgesia
    forbidden_actions: []
    deadlines:
      plan_revascularization_strategy: 360
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: 'Recommendation 3: Revascularization Strategy'
    source_page: null
    source_quote: 'Rutherford IIa: urgent revascularization recommended. Catheter-directed thrombolysis or surgical embolectomy
      depending on etiology (embolic vs thrombotic)'
    next_nodes:
    - post_revascularization
    conditional_next: {}
  emergent_revascularization:
    node_id: emergent_revascularization
    node_type: plan
    name: Emergent Revascularization (Rutherford IIb)
    description: Emergent surgical revascularization required; thrombolysis contraindicated
    precondition: state.rutherford_class == 'IIb'
    mandatory_actions:
    - perform_emergent_surgical_revascularization
    - continue_heparin_infusion
    allowed_actions:
    - continue_heparin_infusion
    - perform_on_table_angiography
    - order_lab_blood_gas
    - order_lab_bmp
    - perform_emergent_surgical_revascularization
    - assess_fasciotomy_need
    - order_lab_ck
    forbidden_actions:
    - catheter_directed_thrombolysis_IIb
    deadlines:
      perform_emergent_surgical_revascularization: 120
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: 'Recommendation 4: Emergent Revascularization'
    source_page: null
    source_quote: Rutherford IIb requires emergent surgical revascularization. Thrombolysis is contraindicated for immediately
      threatened limbs due to time delay
    next_nodes:
    - post_revascularization
    conditional_next: {}
  irreversible_ischemia:
    node_id: irreversible_ischemia
    node_type: plan
    name: Irreversible Ischemia (Rutherford III)
    description: Amputation planning; revascularization contraindicated due to reperfusion injury risk
    precondition: state.rutherford_class == 'III'
    mandatory_actions:
    - assess_amputation_level
    - give_iv_analgesia
    allowed_actions:
    - give_heparin_bolus_80u_kg
    - order_lab_bmp
    - order_lab_ck
    - assess_amputation_level
    - request_vascular_surgery_consultation
    - give_iv_analgesia
    forbidden_actions:
    - revascularization_irreversible_ischemia
    deadlines:
      assess_amputation_level: 120
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: 'Recommendation 5: Irreversible Ischemia'
    source_page: null
    source_quote: 'Rutherford III: revascularization is contraindicated due to lethal reperfusion injury (rhabdomyolysis,
      hyperkalemia, MODS). Primary amputation should be considered'
    next_nodes:
    - post_revascularization
    conditional_next: {}
  post_revascularization:
    node_id: post_revascularization
    node_type: enquiry
    name: Post-Revascularization Monitoring
    description: Monitor for reperfusion injury, compartment syndrome, serial CK and electrolytes
    precondition: null
    mandatory_actions:
    - monitor_limb_perfusion
    - order_lab_ck_serial
    - assess_compartment_syndrome
    allowed_actions:
    - give_iv_fluids_for_rhabdomyolysis
    - continue_heparin_infusion
    - perform_fasciotomy_if_compartment_syndrome
    - order_lab_blood_gas
    - order_lab_bmp
    - monitor_urine_output
    - monitor_limb_perfusion
    - order_lab_ck_serial
    - assess_compartment_syndrome
    forbidden_actions: []
    deadlines:
      monitor_limb_perfusion: 30
      assess_compartment_syndrome: 120
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: 'Recommendation 6: Post-Revascularization'
    source_page: null
    source_quote: Compartment syndrome occurs in 10-20% after revascularization. CK monitoring for rhabdomyolysis. Fasciotomy
      if compartment pressure >30 mmHg or clinical signs
    next_nodes:
    - disposition
    conditional_next: {}
    conditional_rules:
    - rule_id: ALI-COMPARTMENT-SYNDROME
      condition: state.compartment_pressure_mmhg > 30
      effect:
        type: REQUIRED
        actions:
        - perform_fasciotomy_if_compartment_syndrome
        deadline_minutes: 60
      severity: CRITICAL
      description: Compartment pressure >30 mmHg requires emergent fasciotomy to prevent irreversible muscle necrosis
      evidence: Class I, Level B
  disposition:
    node_id: disposition
    node_type: decision
    name: Disposition
    description: Long-term anticoagulation, investigate etiology (embolic source), vascular follow-up
    precondition: null
    mandatory_actions:
    - assess_discharge_readiness
    allowed_actions:
    - assess_discharge_readiness
    - schedule_vascular_follow_up
    - order_echocardiography
    - investigate_embolic_source
    - initiate_long_term_anticoagulation
    forbidden_actions: []
    deadlines: {}
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ESVS Acute Limb Ischemia Guidelines 2020
    source_section: Long-term Management
    source_page: null
    source_quote: Long-term anticoagulation for embolic ALI. Investigate cardiac source (echocardiography, Holter). Duplex
      surveillance post-revascularization
    next_nodes: []
    conditional_next: {}
