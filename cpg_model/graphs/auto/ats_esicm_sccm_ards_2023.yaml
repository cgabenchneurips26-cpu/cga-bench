    - assess_vital_signs
    - assess_respiratory_status
    - order_lab_bmp
    - order_imaging_chest_xray
    - order_lab_abg
    - order_lab_lactate
    - order_lab_blood_culture
    - order_lab_procalcitonin
    forbidden_actions: []
    deadlines:
      assess_respiratory_status: 15
      order_lab_abg: 30
      order_imaging_chest_xray: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ATS/ESICM/SCCM ARDS 2023
    source_section: Berlin Definition / Initial Evaluation
    source_page: "743"
    source_quote: We recommend starting prone position in patients with ARDS receiving invasive mechanical ventilation early
      after intubation, after a period of stabilization during which low tidal volume is applied and PEEP adjusted and at
      the end of which the ­PaO2/FiO2 remains < 150 mmHg; and proning should be app
    next_nodes: []
    conditional_next:
      state.pf_ratio <= 100: severe_ards_bundle
      state.pf_ratio <= 200: moderate_ards_bundle
      state.pf_ratio <= 300: mild_ards_bundle
    _quote_verification:
      status: GROUNDED
      method: keyword_overlap
      score: 0.417
  mild_ards_bundle:
    node_id: mild_ards_bundle
    node_type: plan
    name: Mild ARDS Management (PaO2/FiO2 200-300)
    description: Low tidal volume ventilation, conservative fluid strategy
    precondition: state.pf_ratio > 200 and state.pf_ratio <= 300
    mandatory_actions:
    - initiate_low_tv_ventilation
    - set_tidal_volume_6ml_kg_ibw
    - set_peep_5_to_8
    - target_plateau_pressure_below_30
    allowed_actions:
    - target_plateau_pressure_below_30
    - initiate_low_tv_ventilation
    - order_lab_cbc
    - reassess_pf_ratio
    - set_tidal_volume_6ml_kg_ibw
    - order_lab_bmp
    - order_lab_abg
    - set_peep_5_to_8
    - treat_underlying_cause
    - conservative_fluid_strategy
    forbidden_actions:
    - set_tidal_volume_above_8ml_kg
    deadlines:
      initiate_low_tv_ventilation: 60
      set_tidal_volume_6ml_kg_ibw: 60
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ATS/ESICM/SCCM ARDS 2023
    source_section: 'Recommendation 1: Mechanical Ventilation'
    source_page: "737"
    source_quote: We recommend the use of low tidal volume ventilation strategies (i.e., 4–8 ml/kg PBW), compared to larger
      tidal volumes (traditionally used to normalize blood gases), to reduce mortality in patients with ARDS not due to COVID-19.
    next_nodes:
    - monitoring_reassessment
