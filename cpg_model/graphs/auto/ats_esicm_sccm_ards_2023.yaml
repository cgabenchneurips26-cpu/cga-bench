graph_id: ats_esicm_sccm_ards_2023
guideline_name: ESICM Guidelines on Acute Respiratory Distress Syndrome (2023)
version: '2023.1'
metadata:
  source: ATS/ESICM/SCCM ARDS Clinical Practice Guideline 2023
  doi: 10.1007/s00134-023-07050-7
  journal: Intensive Care Medicine
  recommendation_system: GRADE
  description: Evidence-based guideline for ARDS management including lung-protective ventilation, prone positioning, and
    adjunctive therapies
  key_evidence: Low tidal volume (6 mL/kg PBW) reduces mortality by 22% vs 12 mL/kg (ARDSNet ARMA trial). Prone positioning
    >12h reduces 28-day mortality (PROSEVA trial, RR 0.51).
  target_population:
    age_group: adult
    max_age: 120
    min_age: 18
    sex: any
    special_conditions: []
entry_node: initial_assessment
nodes:
