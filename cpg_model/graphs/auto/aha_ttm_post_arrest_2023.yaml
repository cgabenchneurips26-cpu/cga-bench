    source_guideline: AHA/ILCOR Post-Arrest TTM 2023
    source_section: 'Recommendation 1-2: TTM Initiation'
    source_page: null
    source_quote: TTM is recommended for comatose adult patients after cardiac arrest (Class I, Level B). Target temperature
      32-36°C. Initiate as soon as feasible, ideally within 6h of ROSC
