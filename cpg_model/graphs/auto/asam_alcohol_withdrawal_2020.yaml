graph_id: asam_alcohol_withdrawal_2020
guideline_name: ASAM 2020 Clinical Practice Guideline on Alcohol Withdrawal Management
version: '2020.1'
metadata:
  source: ASAM Clinical Practice Guideline on Alcohol Withdrawal Management 2020
  doi: 10.1097/ADM.0000000000000668
  journal: Journal of Addiction Medicine
  recommendation_system: GRADE
  description: Evidence-based guideline for alcohol withdrawal management using CIWA-Ar scoring, symptom-triggered benzodiazepine
    therapy, and prevention of seizures and delirium tremens
  key_evidence: Symptom-triggered therapy reduces benzodiazepine use and treatment duration vs fixed-dose. Phenobarbital is
    effective for benzodiazepine-resistant withdrawal. DT mortality reduced from 35% to <5% with early aggressive treatment.
  target_population:
    age_group: adult
    max_age: 120
    min_age: 18
    sex: any
    special_conditions: []
entry_node: initial_assessment
nodes:
  initial_assessment:
    node_id: initial_assessment
    node_type: decision
    name: Alcohol Withdrawal Recognition & CIWA-Ar Scoring
    description: Assess withdrawal severity using CIWA-Ar scale, identify seizure/DT risk factors
    precondition: null
    mandatory_actions:
    - perform_ciwa_ar_assessment
    - assess_vital_signs
    - obtain_alcohol_use_history
    allowed_actions:
    - obtain_alcohol_use_history
    - order_lab_blood_alcohol_level
    - order_lab_phosphate
    - perform_ciwa_ar_assessment
    - order_lab_bmp
    - order_lab_magnesium
    - establish_iv_access
    - order_lab_glucose
    - assess_vital_signs
    - order_lab_cbc
    - order_lab_liver_function
    - order_lab_coagulation
    forbidden_actions: []
    deadlines:
      perform_ciwa_ar_assessment: 15
      assess_vital_signs: 10
      obtain_alcohol_use_history: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ASAM Alcohol Withdrawal Management 2020
    source_section: Initial Assessment
    source_page: null
    source_quote: 'CIWA-Ar score guides management intensity: <10 mild, 10-18 moderate, >18 severe withdrawal. Assess for
      prior seizures, prior DT, comorbidities'
    next_nodes: []
    conditional_next:
      state.ciwa_score >= 20: severe_withdrawal_bundle
      state.ciwa_score >= 10: moderate_withdrawal_bundle
      state.ciwa_score < 10: mild_withdrawal_monitoring
  mild_withdrawal_monitoring:
    node_id: mild_withdrawal_monitoring
    node_type: plan
    name: Mild Withdrawal (CIWA-Ar <10)
    description: Supportive care, symptom-triggered benzodiazepine protocol, serial CIWA-Ar q4-8h
    precondition: state.ciwa_score < 10
    mandatory_actions:
    - initiate_symptom_triggered_protocol
    - give_thiamine_before_glucose
    - give_folate_supplementation
    allowed_actions:
    - give_folate_supplementation
    - correct_electrolyte_abnormalities
    - order_lab_bmp
    - order_lab_magnesium
    - initiate_symptom_triggered_protocol
    - give_thiamine_before_glucose
    - reassess_ciwa_q4h
    - give_iv_fluids_maintenance
    forbidden_actions: []
    deadlines:
      give_thiamine_before_glucose: 60
      initiate_symptom_triggered_protocol: 60
    required_prior_actions:
      give_folate_supplementation:
      - obtain_alcohol_use_history
    recommendation_class: I
    evidence_level: B
    source_guideline: ASAM Alcohol Withdrawal Management 2020
    source_section: 'Recommendation 1: Mild Withdrawal'
    source_page: null
    source_quote: Symptom-triggered therapy is preferred over fixed-dose regimens; associated with less benzodiazepine use
      and shorter treatment duration (Saitz et al.)
    next_nodes:
    - monitoring_reassessment
    conditional_next: {}
  moderate_withdrawal_bundle:
    node_id: moderate_withdrawal_bundle
    node_type: plan
    name: Moderate Withdrawal (CIWA-Ar 10-18)
    description: Scheduled benzodiazepines with symptom-triggered supplemental dosing, seizure prophylaxis
    precondition: state.ciwa_score >= 10 and state.ciwa_score < 20
    mandatory_actions:
    - give_benzodiazepine_chlordiazepoxide
    - give_thiamine_before_glucose
    - reassess_ciwa_q2h
    allowed_actions:
    - reassess_ciwa_q2h
    - give_folate_supplementation
    - correct_electrolyte_abnormalities
    - order_lab_bmp
    - give_magnesium_supplementation
    - give_benzodiazepine_chlordiazepoxide
    - order_lab_magnesium
    - give_thiamine_before_glucose
    - give_multivitamin
    - give_iv_fluids_maintenance
    forbidden_actions:
    - give_beta_blocker_monotherapy
    - give_alcohol_to_prevent_withdrawal
    deadlines:
      give_benzodiazepine_chlordiazepoxide: 30
      give_thiamine_before_glucose: 60
      reassess_ciwa_q2h: 120
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: A
    source_guideline: ASAM Alcohol Withdrawal Management 2020
    source_section: 'Recommendation 2: Moderate Withdrawal'
    source_page: null
    source_quote: Benzodiazepines are the first-line treatment for alcohol withdrawal (strong recommendation, high quality
      evidence). Long-acting agents preferred (chlordiazepoxide, diazepam)
    next_nodes:
    - monitoring_reassessment
    conditional_next: {}
  severe_withdrawal_bundle:
    node_id: severe_withdrawal_bundle
    node_type: plan
    name: Severe Withdrawal / Delirium Tremens (CIWA-Ar ≥20)
    description: High-dose benzodiazepines, ICU monitoring, seizure management, phenobarbital if refractory
    precondition: state.ciwa_score >= 20
    mandatory_actions:
    - give_iv_diazepam_loading
    - give_thiamine_iv_500mg
    - reassess_ciwa_q1h
    - continuous_cardiac_monitoring
    allowed_actions:
    - order_imaging_ct_head_if_altered
    - give_propofol_if_refractory_dt
    - give_thiamine_iv_500mg
    - give_dexmedetomidine_adjunct
    - order_lab_bmp_q6h
    - correct_electrolyte_abnormalities
    - reassess_ciwa_q1h
    - continuous_cardiac_monitoring
    - give_phenobarbital_if_refractory
    - give_iv_diazepam_loading
    - order_lab_blood_gas
    - give_iv_fluids_resuscitation
    forbidden_actions:
    - give_alcohol_to_prevent_withdrawal
    - give_beta_blocker_monotherapy
    - give_haloperidol_without_benzodiazepine
    deadlines:
      give_iv_diazepam_loading: 15
      give_thiamine_iv_500mg: 30
      continuous_cardiac_monitoring: 15
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: A
    source_guideline: ASAM Alcohol Withdrawal Management 2020
    source_section: 'Recommendation 3-4: Severe Withdrawal & DT'
    source_page: null
    source_quote: Severe withdrawal (CIWA-Ar ≥20) requires ICU-level care with IV benzodiazepines. Phenobarbital is recommended
      for benzodiazepine-resistant withdrawal. Avoid haloperidol monotherapy (lowers seizure threshold)
    next_nodes:
    - monitoring_reassessment
    conditional_next: {}
    conditional_rules:
    - rule_id: AWS-SEIZURE
      condition: state.seizure_activity == True
      effect:
        type: REQUIRED
        actions:
        - give_iv_diazepam_loading
        deadline_minutes: 5
      severity: CRITICAL
      description: Withdrawal seizures require immediate IV benzodiazepine; recurrent seizures suggest progression to DT
      evidence: Class I, Level A
  monitoring_reassessment:
    node_id: monitoring_reassessment
    node_type: enquiry
    name: Monitoring & CIWA-Ar Reassessment
    description: Serial CIWA-Ar scoring, vital signs, electrolyte monitoring, assess for complications
    precondition: null
    mandatory_actions:
    - reassess_ciwa_serial
    - monitor_vital_signs
    allowed_actions:
    - adjust_benzodiazepine_dose
    - assess_mental_status
    - order_lab_bmp
    - order_lab_magnesium
    - monitor_vital_signs
    - monitor_fluid_balance
    - reassess_ciwa_serial
    forbidden_actions: []
    deadlines:
      reassess_ciwa_serial: 240
      monitor_vital_signs: 60
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ASAM Alcohol Withdrawal Management 2020
    source_section: Monitoring
    source_page: null
    source_quote: Serial CIWA-Ar assessments guide titration. Most withdrawal symptoms peak 24-72h after last drink; DT risk
      greatest at 48-96h
    next_nodes:
    - disposition
    conditional_next: {}
  disposition:
    node_id: disposition
    node_type: decision
    name: Disposition & Relapse Prevention
    description: Assess stability for discharge, initiate relapse prevention pharmacotherapy
    precondition: null
    mandatory_actions:
    - assess_discharge_readiness
    allowed_actions:
    - arrange_outpatient_followup
    - assess_discharge_readiness
    - initiate_naltrexone_or_acamprosate
    - provide_withdrawal_education
    - refer_addiction_medicine
    forbidden_actions: []
    deadlines: {}
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: ASAM Alcohol Withdrawal Management 2020
    source_section: Disposition & Relapse Prevention
    source_page: null
    source_quote: Pharmacotherapy for relapse prevention (naltrexone, acamprosate) should be initiated before or at discharge.
      Referral to addiction treatment is recommended
    next_nodes: []
    conditional_next: {}
