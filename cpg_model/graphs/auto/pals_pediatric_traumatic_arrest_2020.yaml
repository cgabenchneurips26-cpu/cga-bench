    - assess_for_pericardial_effusion
    - give_calcium_chloride
    - consider_resuscitative_thoracotomy
    - correct_hypothermia
    - give_ffp
    - give_prbc_o_negative_emergency
    - correct_acidosis
    - order_bedside_fast_exam
    forbidden_actions:
    - routine_atropine_traumatic_arrest
    deadlines:
      order_bedside_fast_exam: 10
      give_prbc_o_negative_emergency: 15
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AHA PALS Pediatric Trauma 2020
    source_section: 'Recommendation 4-5: Circulation'
    source_page: null
    source_quote: FAST exam to identify cardiac tamponade or intra-abdominal bleeding. Resuscitative thoracotomy reasonable
      in select cases (penetrating trauma, short transport time)
    next_nodes:
    - surgical_decision
    conditional_next: {}
    _quote_verification:
