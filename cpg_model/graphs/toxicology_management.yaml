graph_id: toxicology_management
guideline_name: AACT/ACMT Toxicology Management
version: '2024.1'
metadata:
  primary_source:
    title: American College of Medical Toxicology Position Statements and AACT Clinical Practice Guidelines
    authors: Brent J, Burkhart K, Dargan P, et al.
    journal: Journal of Medical Toxicology
    year: 2024
    doi: 10.1007/s13181-023-00945-7
  source: AACT/ACMT 2024
  description: Emergency management of acute poisoning and overdose including toxin identification, antidote administration,
    decontamination, and supportive care
  key_evidence: NAC within 8 hours of acetaminophen ingestion prevents hepatotoxicity in >98% of cases (Smilkstein MJ, NEJM
    1988); flumazenil in chronic benzodiazepine users causes refractory seizures (Haverkos GP, Clin Pharm 1994)
  recommendation_system: GRADE
  target_population:
    age_group: all
    max_age: 120
    min_age: 0
    sex: any
    special_conditions: []
entry_node: initial_stabilization
nodes:
  initial_stabilization:
    node_id: initial_stabilization
    node_type: enquiry
    name: Toxicological Emergency Stabilization
    description: ABCs, decontamination assessment, obtain exposure history, empiric toxidrome recognition
    precondition: null
    mandatory_actions:
    - assess_airway_breathing_circulation
    - assess_vital_signs
    - obtain_exposure_history
    - assess_toxidrome
    allowed_actions:
    - assess_airway_breathing_circulation
    - assess_vital_signs
    - obtain_exposure_history
    - assess_toxidrome
    - establish_iv_access
    - apply_continuous_monitoring
    - obtain_12_lead_ecg
    - check_point_of_care_glucose
    - administer_oxygen
    - order_lab_blood_gas
    - order_lab_electrolytes
    - order_lab_bmp
    - order_lab_acetaminophen_level
    - order_lab_salicylate_level
    - order_lab_ethanol_level
    - order_lab_toxicology_screen
    - order_lab_osmolar_gap
    - order_lab_anion_gap
    - contact_poison_control
    forbidden_actions:
    - induce_emesis
    - give_ipecac
    - delay_resuscitation
    deadlines:
      assess_airway_breathing_circulation: 2
      assess_vital_signs: 5
      obtain_exposure_history: 15
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AACT/ACMT 2024
    source_section: 'Section 1: Initial Approach'
    source_page: Table 1
    source_quote: 'The poisoned patient requires simultaneous stabilization and toxin identification. ABCs take priority.
      Key labs: acetaminophen and salicylate levels in all intentional ingestions. Ipecac is no longer recommended.'
    next_nodes:
    - toxin_identification
    conditional_next: {}
  toxin_identification:
    node_id: toxin_identification
    node_type: decision
    name: Toxin Identification and Classification
    description: Identify toxin class via history, toxidrome pattern, lab values; determines antidote pathway
    precondition: null
    mandatory_actions:
    - identify_toxin_class
    - review_ecg_for_toxicity
    allowed_actions:
    - identify_toxin_class
    - review_ecg_for_toxicity
    - calculate_anion_gap
    - calculate_osmolar_gap
    - review_toxicology_screen
    - review_acetaminophen_level
    - review_salicylate_level
    - plot_rumack_matthew_nomogram
    - contact_poison_control
    forbidden_actions: []
    conditional_rules:
    - rule_id: TOX-IDENT-NO-DELAY-ANTIDOTE
      condition: 'True'
      effect:
        type: FORBIDDEN
        actions:
        - delay_empiric_antidote_if_indicated
      evidence: AACT/ACMT 2024 Section 2; empiric antidote should not be withheld pending identification
      severity: HIGH
      description: 'Converted from unconditional: when clinical toxidrome strongly suggests a specific toxin, empiric antidote
        should not be delayed for confirmatory testing'
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: suspected_poisoning
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: suspected_poisoning
          type: list_not_contains
    - rule_id: TOX-NO-FORCED-DIURESIS-SPECIFIC
      condition: '''poisoning'' in patient.comorbidities or ''overdose'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_forced_diuresis_in_poisoning
        - give_mannitol_for_toxin_clearance
      evidence: AACT/ACMT 2024 Section 5; forced diuresis is ineffective and causes pulmonary edema and electrolyte derangement
      severity: HIGH
      description: Forced diuresis for toxin clearance is ineffective and causes dangerous fluid overload and electrolyte
        imbalances.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: poisoning
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: poisoning
          type: list_not_contains
    deadlines:
      identify_toxin_class: 30
      review_ecg_for_toxicity: 15
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AACT/ACMT 2024
    source_section: 'Section 2: Toxin Identification'
    source_page: Table 2
    source_quote: 'Toxidrome recognition guides empiric management: sympathomimetic, anticholinergic, cholinergic, opioid,
      sedative-hypnotic. ECG is essential - QRS >100ms suggests sodium channel blockade (TCAs), QTc prolongation suggests
      multiple agents.'
    next_nodes: []
    conditional_next:
      '''acetaminophen'' in state.identified_toxin': antidote_administration
      '''opioid'' in state.identified_toxin': antidote_administration
      '''benzodiazepine'' in state.identified_toxin': antidote_administration
      '''tca'' in state.identified_toxin or ''tricyclic'' in state.identified_toxin': antidote_administration
      '''methanol'' in state.identified_toxin or ''ethylene_glycol'' in state.identified_toxin': antidote_administration
      '''organophosphate'' in state.identified_toxin': antidote_administration
      '''digoxin'' in state.identified_toxin': antidote_administration
      '''beta_blocker'' in state.identified_toxin or ''calcium_channel_blocker'' in state.identified_toxin': antidote_administration
      'True': decontamination
  antidote_administration:
    node_id: antidote_administration
    node_type: plan
    name: Toxin-Specific Antidote Administration
    description: Administer specific antidotes based on identified toxin; each has critical contraindications
    precondition: null
    mandatory_actions:
    - administer_specific_antidote
    allowed_actions:
    - administer_specific_antidote
    - give_n_acetylcysteine
    - give_naloxone
    - give_flumazenil
    - give_sodium_bicarbonate
    - give_fomepizole
    - give_atropine
    - give_pralidoxime
    - give_digoxin_fab_fragments
    - give_glucagon_high_dose
    - give_high_dose_insulin_euglycemia
    - give_calcium_chloride
    - give_calcium_gluconate
    - give_intralipid_emulsion
    - give_deferoxamine
    - give_dimercaprol
    - give_succimer
    - give_hydroxocobalamin
    - give_methylene_blue
    - give_pyridoxine
    - order_lab_serial_levels
    - apply_continuous_monitoring
    forbidden_actions: []
    deadlines:
      administer_specific_antidote: 30
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: A
    source_guideline: AACT/ACMT 2024
    source_section: 'Section 3: Antidote Therapy'
    source_page: Table 4
    source_quote: Specific antidotes should be administered as soon as the toxin is identified or strongly suspected. NAC
      for acetaminophen, naloxone for opioids, digoxin Fab for digoxin, fomepizole for toxic alcohols.
    conditional_rules:
    - rule_id: TOX-ANTIDOTE-NO-DELAY
      condition: 'True'
      effect:
        type: FORBIDDEN
        actions:
        - delay_antidote
      evidence: AACT/ACMT 2024 Section 3; antidote delay increases morbidity and mortality
      severity: HIGH
      description: 'Converted from unconditional: antidote delay worsens outcomes for all identified toxins; NAC efficacy
        drops after 8h, naloxone delay causes anoxic brain injury'
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: identified_toxin
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: identified_toxin
          type: list_not_contains
    - rule_id: TOX-CHARCOAL-AFTER-ENDOSCOPY
      condition: 'True'
      effect:
        type: FORBIDDEN
        actions:
        - give_charcoal_after_endoscopy
      evidence: AACT/ACMT 2024 Section 4; charcoal after endoscopy impairs visualization
      severity: HIGH
      description: 'Converted from unconditional: activated charcoal after endoscopy obscures mucosal visualization and interferes
        with subsequent endoscopic assessment'
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: endoscopy_performed
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: endoscopy_performed
          type: list_not_contains
    - rule_id: TOX-ACETAMINOPHEN-NAC
      condition: '''acetaminophen_overdose'' in patient.comorbidities or patient.labs.acetaminophen_level > 150'
      effect:
        type: REQUIRED
        actions:
        - give_n_acetylcysteine
      evidence: AACT/ACMT 2024 Section 3.1; Smilkstein MJ, NEJM 1988
      severity: CRITICAL
      description: NAC is nearly 100% effective if given within 8 hours of acetaminophen ingestion; prevents hepatotoxicity
        by replenishing glutathione. Always indicated above Rumack-Matthew treatment line.
      condition_variables:
      - patient.comorbidities
      - patient.labs.acetaminophen_level
      trigger_range:
        patient.labs.acetaminophen_level:
          min: 151
          max: 1000
          type: float
      normal_range:
        patient.labs.acetaminophen_level:
          min: 0
          max: 10
          type: float
    - rule_id: TOX-ACETAMINOPHEN-NAC-FORBIDDEN
      condition: '''acetaminophen_overdose'' in patient.comorbidities or patient.labs.acetaminophen_level > 150'
      effect:
        type: FORBIDDEN
        actions:
        - give_hepatotoxic_drug_in_apap_overdose
        - delay_nac_for_level_confirmation
      evidence: AACT/ACMT 2024 Section 3.1; NAC must not be delayed waiting for acetaminophen level; additional hepatotoxins
        compound liver injury
      severity: CRITICAL
      description: In acetaminophen overdose, hepatotoxic agents worsen liver injury and NAC delay beyond 8h drops efficacy
        dramatically.
      condition_variables:
      - patient.comorbidities
      - patient.labs.acetaminophen_level
      trigger_range:
        patient.labs.acetaminophen_level:
          min: 151
          max: 1000
          type: float
      normal_range:
        patient.labs.acetaminophen_level:
          min: 0
          max: 10
          type: float
      skip_scenario_generation: true
    - rule_id: TOX-BENZO-NO-FLUMAZENIL-CHRONIC
      condition: '''chronic_benzo_use'' in patient.medications and ''benzodiazepine_overdose'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_flumazenil
      evidence: AACT/ACMT 2024 Section 3.2; Haverkos GP, Clin Pharm 1994
      severity: CRITICAL
      description: Flumazenil in chronic benzodiazepine users precipitates refractory seizures and death by acute GABA withdrawal;
        supportive care with airway management is preferred.
      condition_variables:
      - patient.medications
      - patient.comorbidities
      trigger_range:
        patient.medications:
          contains: chronic_benzo_use
          type: list_contains
      normal_range:
        patient.medications:
          not_contains: chronic_benzo_use
          type: list_not_contains
    - rule_id: TOX-OPIOID-NALOXONE
      condition: '''opioid_overdose'' in patient.comorbidities'
      effect:
        type: REQUIRED
        actions:
        - give_naloxone
      evidence: AACT/ACMT 2024 Section 3.3; Boyer EW, NEJM 2012
      severity: CRITICAL
      description: Naloxone reverses opioid-induced respiratory depression; start low (0.04-0.4 mg) and titrate to respiratory
        effort to avoid precipitating withdrawal.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: opioid_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: opioid_overdose
          type: list_not_contains
    - rule_id: TOX-OPIOID-NALOXONE-FORBIDDEN
      condition: '''opioid_overdose'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_additional_opioid_in_overdose
        - give_long_acting_sedative_in_opioid_od
      evidence: AACT/ACMT 2024 Section 3.3; Boyer EW, NEJM 2012; additional CNS depressants worsen respiratory depression
      severity: CRITICAL
      description: In opioid overdose, additional opioids or long-acting sedatives worsen respiratory depression and may cause
        fatal apnea.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: opioid_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: opioid_overdose
          type: list_not_contains
      skip_scenario_generation: true
    - rule_id: TOX-TCA-NO-PHYSOSTIGMINE
      condition: '''tca_overdose'' in patient.comorbidities or ''tricyclic_overdose'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_physostigmine
      evidence: AACT/ACMT 2024 Section 3.4; Pentel P, Ann Emerg Med 1980
      severity: CRITICAL
      description: Physostigmine in TCA overdose causes refractory seizures, bradycardia, and asystole; it reverses anticholinergic
        effects but worsens cardiac sodium channel blockade.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: tca_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: tca_overdose
          type: list_not_contains
    - rule_id: TOX-TCA-BICARB
      condition: '''tca_overdose'' in patient.comorbidities and patient.labs.qrs_duration > 100'
      effect:
        type: REQUIRED
        actions:
        - give_sodium_bicarbonate
      evidence: AACT/ACMT 2024 Section 3.4; Liebelt EL, J Toxicol Clin Toxicol 1995
      severity: CRITICAL
      description: QRS >100ms in TCA overdose indicates significant sodium channel blockade with seizure and arrhythmia risk;
        sodium bicarbonate overcomes blockade and alkalinizes to reduce free drug.
      condition_variables:
      - patient.comorbidities
      - patient.labs.qrs_duration
      trigger_range:
        patient.labs.qrs_duration:
          min: 101
          max: 300
          type: float
      normal_range:
        patient.labs.qrs_duration:
          min: 60
          max: 100
          type: float
    - rule_id: TOX-METHANOL-FOMEPIZOLE
      condition: '''methanol_ingestion'' in patient.comorbidities or ''ethylene_glycol_ingestion'' in patient.comorbidities'
      effect:
        type: REQUIRED
        actions:
        - give_fomepizole
      evidence: AACT/ACMT 2024 Section 3.5; Brent J, NEJM 2001
      severity: CRITICAL
      description: Fomepizole inhibits alcohol dehydrogenase, preventing conversion of methanol/ethylene glycol to toxic metabolites
        (formic acid/oxalic acid). Must be given before metabolic acidosis develops.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: methanol_ingestion
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: methanol_ingestion
          type: list_not_contains
    - rule_id: TOX-METHANOL-FOMEPIZOLE-FORBIDDEN
      condition: '''methanol_ingestion'' in patient.comorbidities or ''ethylene_glycol_ingestion'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - delay_fomepizole_for_osmolar_gap
        - give_ethanol_concurrently_with_fomepizole
      evidence: AACT/ACMT 2024 Section 3.5; Brent J, NEJM 2001; fomepizole delay allows toxic metabolite accumulation
      severity: CRITICAL
      description: Delaying fomepizole for osmolar gap results permits conversion to formic acid/oxalic acid; concurrent ethanol
        adds toxicity.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: methanol_ingestion
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: methanol_ingestion
          type: list_not_contains
      skip_scenario_generation: true
    - rule_id: TOX-DIGOXIN-FAB
      condition: '''digoxin_toxicity'' in patient.comorbidities or patient.labs.digoxin_level > 2.0'
      effect:
        type: REQUIRED
        actions:
        - give_digoxin_fab_fragments
      evidence: AACT/ACMT 2024 Section 3.6; Antman EM, Circulation 1990
      severity: CRITICAL
      description: Digoxin-specific Fab fragments bind free digoxin; indicated for life-threatening arrhythmias, hyperkalemia
        >5.5, or digoxin level >6 ng/mL.
      condition_variables:
      - patient.comorbidities
      - patient.labs.digoxin_level
      trigger_range:
        patient.labs.digoxin_level:
          min: 2.1
          max: 30.0
          type: float
      normal_range:
        patient.labs.digoxin_level:
          min: 0.5
          max: 2.0
          type: float
    - rule_id: TOX-DIGOXIN-FAB-FORBIDDEN
      condition: '''digoxin_toxicity'' in patient.comorbidities or patient.labs.digoxin_level > 2.0'
      effect:
        type: FORBIDDEN
        actions:
        - give_calcium_in_digoxin_toxicity
        - cardiovert_without_digoxin_fab
      evidence: AACT/ACMT 2024 Section 3.6; Antman EM, Circulation 1990; calcium + digoxin causes 'stone heart' (irreversible
        contracture)
      severity: CRITICAL
      description: IV calcium in digoxin toxicity causes fatal myocardial contracture; cardioversion without Fab triggers
        lethal arrhythmia.
      condition_variables:
      - patient.comorbidities
      - patient.labs.digoxin_level
      trigger_range:
        patient.labs.digoxin_level:
          min: 2.1
          max: 30.0
          type: float
      normal_range:
        patient.labs.digoxin_level:
          min: 0.5
          max: 2.0
          type: float
      skip_scenario_generation: true
    - rule_id: TOX-ORGANOPHOSPHATE-ATROPINE
      condition: '''organophosphate_poisoning'' in patient.comorbidities'
      effect:
        type: REQUIRED
        actions:
        - give_atropine
        - give_pralidoxime
      evidence: AACT/ACMT 2024 Section 3.7; Eddleston M, Lancet 2008
      severity: CRITICAL
      description: Organophosphate poisoning requires atropine (titrated to drying of secretions) plus pralidoxime (reactivates
        acetylcholinesterase before aging occurs, ideally within 24-48h).
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: organophosphate_poisoning
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: organophosphate_poisoning
          type: list_not_contains
    - rule_id: TOX-ORGANOPHOSPHATE-ATROPINE-FORBIDDEN
      condition: '''organophosphate_poisoning'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_succinylcholine_in_op_poisoning
        - give_morphine_in_cholinergic_crisis
      evidence: AACT/ACMT 2024 Section 3.7; Eddleston M, Lancet 2008; OP inhibits pseudocholinesterase causing prolonged paralysis
        from succinylcholine
      severity: CRITICAL
      description: Succinylcholine relies on pseudocholinesterase for metabolism; OP poisoning inhibits this enzyme causing
        prolonged paralysis.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: organophosphate_poisoning
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: organophosphate_poisoning
          type: list_not_contains
      skip_scenario_generation: true
    - rule_id: TOX-BETA-BLOCKER-GLUCAGON
      condition: '''beta_blocker_overdose'' in patient.comorbidities'
      effect:
        type: REQUIRED
        actions:
        - give_glucagon_high_dose
      evidence: AACT/ACMT 2024 Section 3.8; Love JN, J Toxicol Clin Toxicol 2000
      severity: HIGH
      description: Glucagon bypasses beta-receptor blockade by directly activating adenylate cyclase; give 5-10 mg IV bolus
        then 1-5 mg/h infusion for refractory bradycardia and hypotension.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: beta_blocker_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: beta_blocker_overdose
          type: list_not_contains
    - rule_id: TOX-BETA-BLOCKER-GLUCAGON-FORBIDDEN
      condition: '''beta_blocker_overdose'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_additional_beta_blocker
        - give_verapamil_in_beta_blocker_od
      evidence: AACT/ACMT 2024 Section 3.8; Love JN, J Toxicol Clin Toxicol 2000; additional negative chronotropes cause refractory
        bradycardia
      severity: HIGH
      description: Additional beta-blockers or calcium channel blockers in beta-blocker overdose cause refractory cardiogenic
        shock.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: beta_blocker_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: beta_blocker_overdose
          type: list_not_contains
      skip_scenario_generation: true
    - rule_id: TOX-CALCIUM-CHANNEL-BLOCKER-INSULIN
      condition: '''ccb_overdose'' in patient.comorbidities or ''calcium_channel_blocker_overdose'' in patient.comorbidities'
      effect:
        type: REQUIRED
        actions:
        - give_high_dose_insulin_euglycemia
        - give_calcium_chloride
      evidence: AACT/ACMT 2024 Section 3.9; Engebretsen KM, Clin Toxicol 2011
      severity: HIGH
      description: High-dose insulin euglycemia therapy (1-10 U/kg/h) improves cardiac output in CCB overdose; calcium provides
        temporary inotropic support.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: ccb_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: ccb_overdose
          type: list_not_contains
    - rule_id: TOX-CALCIUM-CHANNEL-BLOCKER-INSULIN-FORBIDDEN
      condition: '''ccb_overdose'' in patient.comorbidities or ''calcium_channel_blocker_overdose'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_additional_ccb
        - give_beta_blocker_in_ccb_overdose
      evidence: AACT/ACMT 2024 Section 3.9; Engebretsen KM, Clin Toxicol 2011; combined negative inotropy is lethal
      severity: HIGH
      description: Beta-blockers in CCB overdose compound negative inotropy and vasodilation causing irreversible cardiogenic
        shock.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: ccb_overdose
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: ccb_overdose
          type: list_not_contains
      skip_scenario_generation: true
    next_nodes:
    - decontamination
    conditional_next: {}
  decontamination:
    node_id: decontamination
    node_type: plan
    name: Gastrointestinal Decontamination
    description: Activated charcoal within 1-2 hours of ingestion; whole bowel irrigation for sustained-release or body packing
    precondition: null
    mandatory_actions:
    - assess_decontamination_indication
    allowed_actions:
    - assess_decontamination_indication
    - give_activated_charcoal
    - perform_whole_bowel_irrigation
    - perform_gastric_lavage
    - perform_skin_decontamination
    - perform_eye_irrigation
    - perform_enhanced_elimination
    - initiate_hemodialysis
    - initiate_hemoperfusion
    - give_multiple_dose_activated_charcoal
    forbidden_actions:
    - give_activated_charcoal_if_unprotected_airway
    deadlines:
      assess_decontamination_indication: 30
      give_activated_charcoal: 60
    required_prior_actions: {}
    recommendation_class: IIa
    evidence_level: B
    source_guideline: AACT/ACMT 2024
    source_section: 'Section 4: Decontamination'
    source_page: Table 6
    source_quote: Single-dose activated charcoal (1 g/kg) should be considered if <1-2 hours post-ingestion and airway is
      protected. Contraindicated with caustics, hydrocarbons, or unprotected airway. Ipecac is no longer recommended.
    next_nodes:
    - supportive_care
    conditional_next: {}
    conditional_rules:
    - rule_id: TOX-CAUSTIC-NO-CHARCOAL
      condition: '''caustic_ingestion'' in patient.presentation'
      effect:
        type: FORBIDDEN
        actions:
        - give_activated_charcoal_with_caustic
        - give_activated_charcoal
      evidence: AACT Position Statement; Hojer J, Clin Toxicol 2013
      severity: CRITICAL
      description: Activated charcoal contraindicated in caustic ingestion - risk of perforation.
      condition_variables:
      - patient.presentation
      trigger_range:
        patient.presentation:
          contains: caustic_ingestion
          type: list_contains
      normal_range:
        patient.presentation:
          not_contains: caustic_ingestion
          type: list_not_contains
    - rule_id: TOX-HYDROCARBON-NO-CHARCOAL
      condition: '''hydrocarbon_ingestion'' in patient.presentation'
      effect:
