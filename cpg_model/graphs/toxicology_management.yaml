        actions:
        - give_activated_charcoal_with_hydrocarbon
        - give_activated_charcoal
      evidence: AACT Position Statement; Isbister GK, Med J Aust 2004
      severity: HIGH
      description: Charcoal with hydrocarbons increases aspiration risk.
      condition_variables:
      - patient.presentation
      trigger_range:
        patient.presentation:
          contains: hydrocarbon_ingestion
          type: list_contains
      normal_range:
        patient.presentation:
          not_contains: hydrocarbon_ingestion
          type: list_not_contains
    - rule_id: TOX-OBSTRUCTION-NO-WBI
