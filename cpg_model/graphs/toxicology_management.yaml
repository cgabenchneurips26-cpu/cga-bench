        actions:
        - give_whole_bowel_irrigation_with_obstruction
      evidence: AACT Position Statement on WBI 2004
      severity: HIGH
      description: Whole bowel irrigation contraindicated in bowel obstruction.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: bowel_obstruction
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: bowel_obstruction
          type: list_not_contains
