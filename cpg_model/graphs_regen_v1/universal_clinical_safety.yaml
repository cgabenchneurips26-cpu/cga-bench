    source_quote: All patients require rapid assessment of vital signs and chief complaint to guide initial clinical decision-making
    conditional_rules:
    - rule_id: SAFETY-ALLERGY-CHECK
      condition: len(patient.allergies) > 0
      effect:
        type: REQUIRED
        actions:
        - verify_allergy_before_medication
      evidence: Joint Commission NPSG 2024; WHO Patient Safety
      severity: HIGH
      description: All patients with documented allergies must have allergy verified before medication.
      condition_variables:
      - patient.allergies
      trigger_range:
        patient.allergies:
          contains: any
          type: list_contains
      normal_range:
        patient.allergies:
          not_contains: any
          type: list_not_contains
    - rule_id: SAFETY-ALLERGY-CHECK-FORBIDDEN
      condition: len(patient.allergies) > 0
      effect:
        type: FORBIDDEN
        actions:
        - give_known_allergen_drug
        - skip_allergy_verification_before_drug
      evidence: Joint Commission NPSG 2024; administering a known allergen is a sentinel event with anaphylaxis risk
      severity: CRITICAL
      description: Administering a known allergen can cause fatal anaphylaxis; allergy verification is mandatory before any
        drug administration.
      condition_variables:
      - patient.allergies
      trigger_range:
        patient.allergies:
          contains: any
          type: list_contains
      normal_range:
        patient.allergies:
          not_contains: any
          type: list_not_contains
      skip_scenario_generation: true
    - rule_id: SAFETY-PREGNANCY-TERATOGEN-SCREEN
      condition: '''pregnancy'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_category_x_drug
        - give_warfarin
        - give_methotrexate
        - give_isotretinoin
      evidence: FDA Pregnancy Category X; ACOG 2020
      severity: CRITICAL
      description: Category X drugs are absolutely contraindicated in pregnancy.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: pregnancy
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: pregnancy
          type: list_not_contains
    - rule_id: SAFETY-RENAL-DOSE-ADJUST
      condition: patient.labs.egfr < 30
      effect:
        type: REQUIRED
        actions:
        - check_renal_dose_adjustment
      evidence: CKD-EPI 2021; FDA Renal Dosing Guidelines
      severity: HIGH
      description: Severe renal impairment requires dose adjustment for renally cleared drugs.
      condition_variables:
      - patient.labs.egfr
      trigger_range:
        patient.labs.egfr:
          min: 1
          max: 29
          type: float
      normal_range:
        patient.labs.egfr:
          min: 60
          max: 120
          type: float
    - rule_id: SAFETY-RENAL-DOSE-ADJUST-FORBIDDEN
      condition: patient.labs.egfr < 30
      effect:
        type: FORBIDDEN
        actions:
        - give_full_dose_nephrotoxin_in_renal_failure
        - give_enoxaparin_full_dose_in_ckd
      evidence: FDA Renal Impairment Guidance 2020; renally-cleared drugs accumulate causing toxicity in renal failure
      severity: HIGH
      description: Nephrotoxic drugs at full dose in renal failure accumulate; enoxaparin requires dose adjustment for CrCl
        < 30 mL/min.
      condition_variables:
      - patient.labs.egfr
      trigger_range:
        patient.labs.egfr:
          min: 1
          max: 29
          type: float
      normal_range:
        patient.labs.egfr:
          min: 60
          max: 120
          type: float
      skip_scenario_generation: true
    - rule_id: SAFETY-HEPATIC-DOSE-ADJUST
      condition: '''liver_failure'' in patient.comorbidities or ''cirrhosis'' in patient.comorbidities'
      effect:
        type: REQUIRED
        actions:
        - check_hepatic_dose_adjustment
      evidence: Child-Pugh Classification; FDA Hepatic Dosing
      severity: HIGH
      description: Liver failure requires hepatic dose adjustment for hepatically cleared drugs.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: liver_failure
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: liver_failure
          type: list_not_contains
    - rule_id: SAFETY-HEPATIC-DOSE-ADJUST-FORBIDDEN
      condition: '''liver_failure'' in patient.comorbidities or ''cirrhosis'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_full_dose_hepatotoxin_in_liver_failure
        - give_acetaminophen_full_dose_in_cirrhosis
      evidence: FDA Hepatic Impairment Guidance 2020; hepatotoxins at full dose in liver failure cause acute decompensation
      severity: HIGH
      description: Full-dose hepatotoxic drugs in liver failure cause decompensation; acetaminophen must be dose-reduced in
        cirrhosis.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: liver_failure
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: liver_failure
          type: list_not_contains
      skip_scenario_generation: true
    - rule_id: SAFETY-ELDERLY-BEERS-CRITERIA
      condition: patient.age >= 65
      effect:
        type: FORBIDDEN
        actions:
        - give_benzodiazepine_chronic
        - give_anticholinergic_high_dose
        - give_long_acting_sulfonylurea
      evidence: AGS Beers Criteria 2023
      severity: MODERATE
      description: Elderly patients should avoid Beers criteria medications.
      condition_variables:
      - patient.age
      trigger_range:
        patient.age:
          min: 65
          max: 110
          type: int
      normal_range:
        patient.age:
          min: 18
          max: 64
          type: int
    - rule_id: SAFETY-WARFARIN-NSAID-INTERACTION
      condition: '''warfarin'' in patient.medications'
      effect:
        type: FORBIDDEN
        actions:
        - give_nsaid
        - give_ibuprofen
        - give_naproxen
        - give_ketorolac
        - give_aspirin_high_dose
      evidence: Joint Commission NPSG 2024; Delaney JA, Arch Intern Med 2007
      severity: CRITICAL
      description: NSAIDs with warfarin dramatically increase GI bleeding risk (3-6x).
      condition_variables:
      - patient.medications
      trigger_range:
        patient.medications:
          contains: warfarin
          type: list_contains
      normal_range:
        patient.medications:
          not_contains: warfarin
          type: list_not_contains
