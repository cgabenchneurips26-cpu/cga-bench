modular_rules:
  basic_assessment:
    description: At least one assessment action must be performed
    check_type: any_of
    actions:
    - assess_vital_signs
    - assess_patient
    - obtain_history
    - perform_physical_exam
    penalty_if_missing: 0.2
    severity: moderate
  assessment_before_tests:
    description: Assessment should precede ordering tests
    check_type: sequence_preferred
    first_actions:
    - assess_vital_signs
    - assess_patient
    then_actions:
    - order_lab_*
    - order_imaging_*
    penalty_if_violated: 0.1
    severity: minor
  assessment_before_treatment:
    description: Assessment must precede treatment
    check_type: sequence_required
    first_actions:
    - assess_*
    then_actions:
    - give_*
    - start_*
    penalty_if_violated: 0.3
    severity: major
  high_risk_caution:
    description: High-risk actions require prior workup
    check_type: prerequisite
    actions:
    - give_thrombolytics
    - give_anticoagulation
    required_prior:
    - order_imaging_*
    - order_lab_coagulation
    penalty_if_violated: 0.5
    severity: severe
  no_duplicate_actions:
    description: Avoid repeating the same action unnecessarily
    check_type: no_duplicate
    max_repeats: 2
    penalty_per_extra: 0.05
    severity: minor
