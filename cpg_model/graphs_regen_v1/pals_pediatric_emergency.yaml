  pediatric_assessment:
    node_id: pediatric_assessment
    node_type: enquiry
    name: Pediatric Assessment
    description: Pediatric assessment triangle (appearance, breathing, circulation) + weight-based parameters
    precondition: null
    mandatory_actions:
    - assess_pediatric_triangle
    - obtain_weight_kg
    - assess_vital_signs_age_appropriate
    - establish_iv_or_io_access
    allowed_actions:
    - assess_pediatric_triangle
    - obtain_weight_kg
    - assess_vital_signs_age_appropriate
    - establish_iv_or_io_access
    - check_glucose
    - assess_mental_status
    - calculate_broselow_weight
    - order_lab_cbc
    - order_lab_bmp
    forbidden_actions:
    - use_adult_vital_sign_norms
    - give_adult_dose_medications
    deadlines:
      assess_pediatric_triangle: 5
      assess_vital_signs_age_appropriate: 5
      obtain_weight_kg: 10
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: AHA PALS 2025
    source_section: 'Section 1: Pediatric Assessment'
    source_quote: The Pediatric Assessment Triangle provides rapid, initial evaluation of appearance, work of breathing, and
