    - provide_discharge_instructions
    - schedule_followup
    - resume_home_medications
    forbidden_actions:
    - discharge_without_egfr_confirmation
    deadlines: {}
    required_prior_actions:
      provide_discharge_instructions:
      - document_stable_egfr
    recommendation_class: I
    evidence_level: C
    source_guideline: KDIGO 2024 CKD
    source_section: Section 4.3.2
    source_page: '41'
    source_quote: Confirm stable kidney function before discharge and provide instructions on signs of AKI and when to seek
      medical attention
    next_nodes: []
    conditional_next: {}
