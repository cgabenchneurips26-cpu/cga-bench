graph_id: kdigo_contrast_aki
guideline_name: KDIGO Contrast-Associated AKI Prevention
version: '2024.1'
metadata:
  source: KDIGO 2024 CKD Guideline + KDIGO 2012 AKI Guideline
  doi: 10.1016/j.kint.2023.10.018
  source_url: https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf
  journal: Kidney International
  citation: Kidney International, Volume 105, Issue 4S, 2024
  key_tables:
  - Table 33 - Risk factors for CA-AKI
  recommendation_system: GRADE
  description: Prevention of contrast-associated AKI in CKD patients
  aki_definition: SCr increase ≥0.3 mg/dL within 48h OR ≥1.5x baseline
  key_practice_points:
  - '4.3.2.1: Minimize contrast dose in CKD G3a-G5'
  - '4.3.2.2: Ensure adequate hydration before and after contrast'
  - '4.3.2.3: Consider holding metformin 48h post-contrast in CKD G3b-G5'
