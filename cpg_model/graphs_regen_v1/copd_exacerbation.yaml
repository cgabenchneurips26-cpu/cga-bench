nodes:
  initial_assessment:
    node_id: initial_assessment
    node_type: decision
    name: COPD Exacerbation Assessment
    description: Assess exacerbation severity
    precondition: null
    mandatory_actions:
    - assess_vital_signs
    - assess_respiratory_status
    - order_lab_abg
    - order_imaging_chest_xray
    allowed_actions:
    - assess_mental_status
    - assess_respiratory_status
    - assess_vital_signs
    - consult_pulmonology
    - give_diuretic
    - give_iv_fluids
    - give_vasopressor
    - order_imaging_chest_xray
    - order_imaging_ct_chest
    - order_lab_abg
    - order_lab_blood_culture
    - order_lab_bmp
    - order_lab_cbc
    - order_lab_lactate
    - order_lab_procalcitonin
    - order_lab_sputum_culture
    forbidden_actions: []
    deadlines:
      assess_vital_signs: 10
    required_prior_actions: {}
    recommendation_class: I
    evidence_level: B
    source_guideline: GOLD 2024
    source_section: Exacerbation Management
    source_page: '43'
    source_quote: Arterial blood gases and chest X-ray should be obtained
    conditional_rules:
    - rule_id: COPD-PNEUMOTHORAX-NO-NIV
      condition: '''pneumothorax'' in patient.comorbidities or ''pneumothorax'' in patient.imaging'
      effect:
        type: FORBIDDEN
        actions:
        - initiate_niv
        - initiate_bipap
        - initiate_cpap
      evidence: GOLD COPD 2024, Section 5.3
      severity: CRITICAL
      description: NIV in pneumothorax causes tension pneumothorax.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: pneumothorax
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: pneumothorax
          type: list_not_contains
    - rule_id: COPD-CO2-NARCOSIS-NO-HIGH-O2
      condition: patient.labs.pco2 > 60
      effect:
        type: FORBIDDEN
        actions:
        - give_high_flow_oxygen_100pct
        - give_high_fio2
      evidence: GOLD COPD 2024; Austin MA, BMJ 2010
      severity: HIGH
      description: High FiO2 in CO2 retainers worsens hypercapnia via Haldane effect.
      condition_variables:
      - patient.labs.pco2
      trigger_range:
        patient.labs.pco2:
          min: 61
          max: 120
          type: float
      normal_range:
        patient.labs.pco2:
          min: 35
          max: 45
          type: float
    - rule_id: COPD-FACIAL-TRAUMA-NO-NIV
      condition: '''facial_trauma'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - initiate_niv
        - initiate_bipap
      evidence: GOLD COPD 2024; BTS NIV Guidelines
      severity: HIGH
      description: Facial trauma prevents mask seal for NIV.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: facial_trauma
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: facial_trauma
          type: list_not_contains
    - rule_id: COPD-BB-CONTRAINDICATED
      condition: '''severe_copd'' in patient.comorbidities or ''asthma_overlap'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_nonselective_beta_blocker
        - give_propranolol
      evidence: GOLD COPD 2024; Salpeter SR, Cochrane 2005
      severity: HIGH
      description: Non-selective beta-blockers cause bronchospasm in COPD.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: severe_copd
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: severe_copd
          type: list_not_contains
    - rule_id: COPD-THEOPHYLLINE-CAUTION
      condition: '''theophylline'' in patient.medications'
      effect:
        type: FORBIDDEN
        actions:
        - add_macrolide_without_theophylline_check
        - give_ciprofloxacin
      evidence: GOLD COPD 2024; Drug interaction databases
      severity: MODERATE
      description: Macrolides and ciprofloxacin increase theophylline levels causing toxicity.
      condition_variables:
      - patient.medications
      trigger_range:
        patient.medications:
          contains: theophylline
          type: list_contains
      normal_range:
        patient.medications:
          not_contains: theophylline
          type: list_not_contains
    - rule_id: COPD-COR-PULMONALE-FLUID-RESTRICT
      condition: '''cor_pulmonale'' in patient.comorbidities or ''right_heart_failure'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_aggressive_iv_fluids
        - give_large_volume_fluid
      evidence: GOLD COPD 2024; AHA HF Guidelines 2022
      severity: HIGH
      description: Cor pulmonale patients are preload-sensitive; aggressive fluids cause RV failure.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: cor_pulmonale
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: cor_pulmonale
          type: list_not_contains
    - rule_id: COPD-CHF-OVERLAP-NO-BB-INCREASE
      condition: '''heart_failure'' in patient.comorbidities or ''chf'' in str(patient.comorbidities)'
      effect:
        type: FORBIDDEN
        actions:
        - increase_beta_blocker
        - give_high_dose_beta_blocker
      evidence: GOLD COPD 2024; Bhatt SP, NEJM 2023
      severity: HIGH
      description: 'COPD-CHF overlap: do not increase beta-blocker during acute exacerbation.'
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: heart_failure
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: heart_failure
          type: list_not_contains
    - rule_id: COPD-AKI-STEROID-CAUTION
      condition: '''aki'' in patient.comorbidities or ''ckd_stage_4'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_high_dose_methylprednisolone
        - give_nsaid
      evidence: GOLD COPD 2024; KDIGO AKI 2012
      severity: HIGH
      description: AKI/CKD patients need steroid dose adjustment and NSAID avoidance.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: aki
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: aki
          type: list_not_contains
    next_nodes: []
    conditional_next:
      state.working_diagnosis == 'severe_copd_exacerbation': severe_exacerbation
