    conditional_rules:
    - rule_id: GIB-VARICEAL-NO-NSAID
      condition: '''variceal_bleed'' in patient.presentation or ''cirrhosis'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_nsaid
        - give_aspirin
        - give_anticoagulation
      evidence: ACG GI Bleeding 2023; Baveno VII 2022
      severity: CRITICAL
      description: NSAIDs and anticoagulants worsen variceal bleeding in cirrhosis.
      condition_variables:
      - patient.comorbidities
      trigger_range:
        patient.comorbidities:
          contains: cirrhosis
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: cirrhosis
          type: list_not_contains
    - rule_id: GIB-HEMODYNAMIC-INSTABILITY-RESUSCITATE
      condition: patient.vitals.sbp < 90 or patient.vitals.heart_rate > 120
      effect:
        type: REQUIRED
        actions:
        - establish_large_bore_iv
        - give_crystalloid_bolus
        - type_and_crossmatch
      evidence: ACG GI Bleeding 2023, Section 3.1
      severity: CRITICAL
      description: Hemodynamic instability requires immediate resuscitation before endoscopy.
      condition_variables:
      - patient.vitals.sbp
      - patient.vitals.heart_rate
      trigger_range:
        patient.vitals.sbp:
          min: 40
          max: 89
          type: int
      normal_range:
        patient.vitals.sbp:
          min: 90
          max: 160
          type: int
    - rule_id: GIB-HEMODYNAMIC-INSTABILITY-RESUSCITATE-FORBIDDEN
      condition: patient.vitals.sbp < 90 or patient.vitals.heart_rate > 120
      effect:
        type: FORBIDDEN
        actions:
        - delay_resuscitation_for_endoscopy_in_gi_bleed
        - give_oral_fluids_only_in_gi_hemorrhagic_shock
      evidence: ACG GI Bleeding 2023; hemodynamic resuscitation takes priority over endoscopy in unstable patients
      severity: HIGH
      description: Hemodynamic resuscitation must precede endoscopy in unstable GI bleeding; oral fluids are insufficient
        for hemorrhagic shock.
      condition_variables:
      - patient.vitals.sbp
      - patient.vitals.heart_rate
      trigger_range:
        patient.vitals.sbp:
          min: 40
          max: 89
          type: int
      normal_range:
        patient.vitals.sbp:
          min: 90
          max: 160
          type: int
      skip_scenario_generation: true
    - rule_id: GIB-ANTICOAG-REVERSAL
      condition: '''warfarin'' in patient.medications and patient.labs.inr > 2.5'
      effect:
        type: REQUIRED
        actions:
        - give_pcc
        - give_vitamin_k
      evidence: ACG GI Bleeding 2023; AGA 2020
      severity: HIGH
      description: Supratherapeutic INR with active bleeding requires urgent reversal.
      condition_variables:
      - patient.medications
      - patient.labs.inr
      trigger_range:
        patient.medications:
          contains: warfarin
        patient.labs.inr:
          min: 2.6
          max: 10.0
          type: float
      normal_range:
        patient.labs.inr:
          min: 0.8
          max: 1.5
          type: float
    - rule_id: GIB-VARICEAL-OCTREOTIDE
      condition: '''variceal_bleed'' in patient.presentation'
      effect:
        type: REQUIRED
        actions:
        - give_octreotide
        - give_prophylactic_antibiotics
      evidence: Baveno VII 2022; ACG GI Bleeding 2023
      severity: HIGH
      description: Variceal bleeding requires octreotide and prophylactic antibiotics.
      condition_variables:
      - patient.presentation
      trigger_range:
        patient.presentation:
          contains: variceal_bleed
          type: list_contains
      normal_range:
        patient.presentation:
          not_contains: variceal_bleed
          type: list_not_contains
    - rule_id: GIB-PLATELET-TRANSFUSE
      condition: patient.labs.platelets < 50
      effect:
        type: REQUIRED
        actions:
        - transfuse_platelets
      evidence: ACG GI Bleeding 2023
      severity: HIGH
      description: Platelets <50k with active bleeding require transfusion before endoscopy.
      condition_variables:
      - patient.labs.platelets
      trigger_range:
        patient.labs.platelets:
          min: 5
          max: 49
          type: int
      normal_range:
        patient.labs.platelets:
          min: 150
          max: 400
          type: int
    - rule_id: GIB-PLATELET-TRANSFUSE-FORBIDDEN
      condition: patient.labs.platelets < 50
      effect:
        type: FORBIDDEN
        actions:
        - delay_platelet_transfusion_in_active_bleed
        - give_aspirin_in_severe_thrombocytopenia
      evidence: ACG GI Bleeding 2023; platelet count < 50k with active bleeding requires transfusion; antiplatelet agents
        worsen bleeding
      severity: HIGH
      description: Active GI bleeding with thrombocytopenia requires platelet transfusion; aspirin in this setting worsens
        hemorrhage.
      condition_variables:
      - patient.labs.platelets
      trigger_range:
        patient.labs.platelets:
          min: 5
          max: 49
          type: int
      normal_range:
        patient.labs.platelets:
          min: 150
          max: 400
          type: int
      skip_scenario_generation: true
    - rule_id: GIB-MECHANICAL-VALVE-ANTICOAG
      condition: '''mechanical_heart_valve'' in patient.comorbidities and ''warfarin'' in patient.medications'
      effect:
        type: FORBIDDEN
        actions:
        - stop_anticoagulation_indefinitely
        - withhold_anticoagulation_without_bridge
      evidence: ACG GI Bleeding 2023; AHA/ACC Valve 2020
      severity: CRITICAL
      description: Mechanical valve patients need bridging; cannot hold anticoagulation indefinitely.
      condition_variables:
      - patient.comorbidities
      - patient.medications
      trigger_range:
        patient.comorbidities:
          contains: mechanical_heart_valve
          type: list_contains
      normal_range:
        patient.comorbidities:
          not_contains: mechanical_heart_valve
          type: list_not_contains
    - rule_id: GIB-NSAID-PPI-FAILURE
      condition: '''nsaid_use'' in patient.medications and ''ppi_failure'' in patient.history'
      effect:
        type: FORBIDDEN
        actions:
        - continue_nsaid
        - give_nsaid
        - restart_nsaid_without_ppi
      evidence: ACG GI Bleeding 2023; Lanza FL, Am J Gastroenterol 2009
      severity: HIGH
      description: 'NSAID-associated GI bleed despite PPI: NSAID must be discontinued.'
      condition_variables:
      - patient.medications
      - patient.history
      trigger_range:
        patient.medications:
          contains: nsaid_use
          type: list_contains
      normal_range:
        patient.medications:
          not_contains: nsaid_use
          type: list_not_contains
    - rule_id: GIB-UNSTABLE-RESUSCITATE-FIRST
      condition: patient.vitals.sbp < 90 and patient.vitals.heart_rate > 120
      effect:
        type: FORBIDDEN
        actions:
        - proceed_to_endoscopy_without_resuscitation
        - delay_transfusion_for_endoscopy
      evidence: ACG GI Bleeding 2023, Section 3.1
      severity: CRITICAL
      description: Hemodynamically unstable patients must be resuscitated before endoscopy.
      condition_variables:
      - patient.vitals.sbp
      - patient.vitals.heart_rate
      trigger_range:
        patient.vitals.sbp:
          min: 40
          max: 89
          type: int
        patient.vitals.heart_rate:
          min: 121
          max: 200
          type: int
      normal_range:
        patient.vitals.sbp:
          min: 90
          max: 160
          type: int
        patient.vitals.heart_rate:
          min: 60
          max: 100
          type: int
