  tpa_eligibility_assessment:
    node_id: tpa_eligibility_assessment
    node_type: decision
    description: Assess eligibility for IV thrombolysis
    patient_activation_condition: '''ischemic_stroke'' in patient.comorbidities or ''acute_ischemic_stroke'' in patient.comorbidities'
    mandatory_actions:
    - review_inclusion_criteria
    - review_exclusion_criteria
    - calculate_time_from_onset
    - review_anticoagulation_status
    transitions:
    - condition: time_from_onset <= 270 and eligible
      target_node: administer_iv_tpa
    - condition: time_from_onset <= 270 and relative_contraindication
      target_node: tpa_risk_benefit_discussion
    - condition: time_from_onset > 270 and lvo_suspected
      target_node: thrombectomy_eligibility
    - condition: not_tpa_eligible and not_lvo
      target_node: non_reperfusion_management
    recommendation_class: I
    evidence_level: B
    conditional_rules:
    - rule_id: STROKE-BP-UNCONTROLLED-NO-TPA
      condition: patient.vitals.sbp > 185 or patient.vitals.dbp > 110
      effect:
        type: FORBIDDEN
        actions:
        - give_alteplase
        - give_tpa
      evidence: AHA/ASA 2019 Acute Ischemic Stroke Guidelines, Section 3.5
      severity: CRITICAL
      description: tPA with BP >185/110 increases risk of intracranial hemorrhage.
      condition_variables:
      - patient.vitals.sbp
      - patient.vitals.dbp
      trigger_range:
        patient.vitals.sbp:
          min: 186
          max: 260
          type: int
      normal_range:
        patient.vitals.sbp:
          min: 100
          max: 185
          type: int
    - rule_id: STROKE-SEIZURE-MIMIC-NO-TPA
      condition: '''seizure_at_onset'' in patient.history or ''todds_paralysis'' in patient.comorbidities'
      effect:
        type: FORBIDDEN
        actions:
        - give_alteplase_without_ruling_out_mimic
        - give_tpa_for_todds_paralysis
      evidence: AHA/ASA 2019, Section 3.4 Stroke Mimics
      severity: HIGH
      description: Seizure at onset may indicate stroke mimic. tPA without exclusion is harmful.
      condition_variables:
      - patient.history
      trigger_range:
        patient.history:
          contains: seizure_at_onset
          type: list_contains
      normal_range:
        patient.history:
          not_contains: seizure_at_onset
          type: list_not_contains
    - rule_id: STROKE-POSTERIOR-NO-DISCHARGE-LOW-NIHSS
      condition: '''posterior_circulation'' in patient.presentation or ''vertebrobasilar'' in patient.presentation'
      effect:
        type: FORBIDDEN
        actions:
        - discharge_with_low_nihss
        - withhold_treatment_based_on_low_nihss
      evidence: AHA/ASA 2019, Section 3.6 Posterior Circulation Stroke
      severity: HIGH
      description: Posterior circulation strokes may have low NIHSS but devastating outcomes.
      condition_variables:
      - patient.presentation
      trigger_range:
        patient.presentation:
          contains: posterior_circulation
          type: list_contains
      normal_range:
        patient.presentation:
          not_contains: posterior_circulation
          type: list_not_contains
    - rule_id: STROKE-TPA-HEPARIN-TIMING
      condition: '''tpa_given'' in patient.history or ''alteplase_given'' in patient.history'
      effect:
        type: FORBIDDEN
        actions:
        - give_heparin_within_24h_of_tpa
        - start_doac_immediately
      evidence: AHA/ASA 2019, Section 3.5; NINDS tPA Protocol
      severity: CRITICAL
      description: Anticoagulation within 24h of tPA increases hemorrhagic transformation risk.
      condition_variables:
      - patient.history
      trigger_range:
        patient.history:
          contains: tpa_given
          type: list_contains
      normal_range:
        patient.history:
          not_contains: tpa_given
          type: list_not_contains
    - rule_id: STROKE-EXTENDED-WINDOW-NO-TPA
      condition: patient.presentation.symptom_onset_hours > 4.5
      effect:
        type: FORBIDDEN
        actions:
        - give_alteplase
      evidence: AHA/ASA 2019, Section 3.3
      severity: CRITICAL
      description: IV tPA contraindicated beyond 4.5h window.
      condition_variables:
      - patient.presentation.symptom_onset_hours
      trigger_range:
        patient.presentation.symptom_onset_hours:
          min: 4.6
          max: 24
          type: float
      normal_range:
        patient.presentation.symptom_onset_hours:
          min: 0
          max: 4.5
          type: float
    source_guideline: AHA Stroke Guideline Section 5.1
    source_section: IV Alteplase Eligibility Criteria
    source_page: Table 3
    source_quote: IV alteplase is recommended for eligible patients presenting within the treatment window after exclusion
      of contraindications.
    source_figure: Table 3 - tPA Eligibility
    name: Tpa Eligibility Assessment
