- window_name: tPA Window
  max_minutes: 270
  entry_node: administer_iv_tpa
- window_name: Standard Thrombectomy Window
  max_minutes: 360
  entry_node: perform_thrombectomy
- window_name: Extended Thrombectomy Window
  max_minutes: 1440
  entry_node: extended_window_thrombectomy
forbidden_combinations:
- actions:
  - give_alteplase
  - antiplatelet_within_24h
  reason: Increased bleeding risk post-tPA
- actions:
  - give_alteplase
  - anticoagulation_within_24h
  reason: Increased bleeding risk post-tPA
- actions:
  - give_tpa
  - hemorrhagic_stroke
  reason: Absolute contraindication
