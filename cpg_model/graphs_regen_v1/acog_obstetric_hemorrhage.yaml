graph_id: acog_obstetric_hemorrhage
guideline_name: ACOG 2024 Postpartum Hemorrhage Guidelines
version: '2024.1'
metadata:
  primary_source:
    title: 'ACOG Practice Bulletin #555 - Postpartum Hemorrhage'
    authors: American College of Obstetricians and Gynecologists
    journal: Obstetrics & Gynecology
    year: 2024
  secondary_source:
    title: California CMQCC OB Hemorrhage Toolkit
    authors: California Maternal Quality Care Collaborative
    year: 2024
  source: ACOG 2024 + CMQCC Toolkit
  description: Comprehensive PPH management from recognition through surgical intervention
  key_evidence: 'WOMAN Trial: TXA reduces death from bleeding in PPH if given within 3h of delivery (Lancet 2017)'
  recommendation_system: ACOG Grade
