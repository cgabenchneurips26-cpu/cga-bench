site_name: CGA-Bench Audit Harness
site_description: Documentation for the CGA-Bench evaluator audit harness
site_url: https://cga-bench.github.io/audit/
repo_url: https://github.com/cga-bench/cga-bench
repo_name: cga-bench

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs/audit

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Add your evaluator: add-your-evaluator.md
  - Theory (π-class + Bayes floor): theory.md
  - Worked examples: worked-examples.md
  - CLI reference: cli-reference.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
