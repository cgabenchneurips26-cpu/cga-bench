# Real-cohort reference for App Z (Patient-level Distribution Check).
# Anchors are reproduced from `paper/distribution_check_table.tex` (auto-generated
# table) so Phase 1 of the MIMIC-IV augmentation pipeline can compute patient-level
# percentiles on the same observables and produce a side-by-side comparison.
#
# Each observable carries:
#   - engine.median  / engine.iqr        : CGA-Bench engine marginal
#   - literature.median / literature.p5_p95 : pre-registered cited cohort range
#   - mimic_iv_lookup                    : how to compute the MIMIC-IV patient-level
#                                          percentile (table + itemid for labs, or a
#                                          cohort-column reference for demographics)
#
# Cohorts referenced:
#   sepsis      -> data/mimic_iv_local/cohort_sepsis3.parquet
#   chest_pain  -> ICD-10 I21.* / I22.* (built on demand by Phase 1)
#   stroke      -> ICD-10 I63.* (built on demand by Phase 1)
#   aki         -> ICD-10 N17.* (built on demand by Phase 1)
#
# Literature anchors are pre-registered in
# docs/attack_gap_exp_exp/W9_scenario_realism_plan.md (M90 >= 70% verdict rule
# committed before results were computed).

version: 1
n_observables: 24
domains: [sepsis, chest_pain, stroke, aki]

observables:

# -------------------------------- SEPSIS (6) --------------------------------
- key: sepsis_age
  domain: sepsis
  observable: Age
  unit: years
  engine:    {median: 55.0, iqr: [55.0, 60.0]}
  literature: {median: 67.0, p5_p95: [30.0, 90.0], citation: "Rhee 2017 / SSC 2021"}
  mimic_iv_lookup: {kind: cohort_column, cohort: sepsis, column: anchor_age}

- key: sepsis_initial_map
  domain: sepsis
  observable: Initial MAP
  unit: mmHg
  engine:    {median: 97.0, iqr: [64.0, 97.0]}
  literature: {median: 75.0, p5_p95: [55.0, 105.0], citation: "Rhee 2017"}
  mimic_iv_lookup: {kind: chartevent_first24h, itemids: [220181, 220052, 225312]}

- key: sepsis_initial_hr
  domain: sepsis
  observable: Initial HR
  unit: bpm
  engine:    {median: 80.0, iqr: [80.0, 110.0]}
  literature: {median: 105.0, p5_p95: [70.0, 140.0], citation: "Rhee 2017"}
  mimic_iv_lookup: {kind: chartevent_first24h, itemids: [220045]}

- key: sepsis_initial_rr
  domain: sepsis
  observable: Initial RR
  unit: per_min
  engine:    {median: 16.0, iqr: [16.0, 24.0]}
  literature: {median: 22.0, p5_p95: [14.0, 36.0], citation: "Rhee 2017"}
  mimic_iv_lookup: {kind: chartevent_first24h, itemids: [220210, 224690]}

- key: sepsis_initial_temp
  domain: sepsis
  observable: Initial Temp
  unit: celsius
  engine:    {median: 37.0, iqr: [37.0, 38.9]}
  literature: {median: 38.0, p5_p95: [35.8, 40.0], citation: "Rhee 2017"}
  mimic_iv_lookup:
    kind: chartevent_first24h
    itemids: [223762]                  # Celsius
    fallback_itemids_fahrenheit: [223761]  # convert: (F - 32) * 5/9

- key: sepsis_lactate
  domain: sepsis
  observable: Lactate
  unit: mmol_per_L
  engine:    {median: 4.3, iqr: [3.5, 5.2]}
  literature: {median: 2.2, p5_p95: [0.9, 6.5], citation: "SSC 2021"}
  mimic_iv_lookup: {kind: labevent_first24h, itemids: [50813]}

