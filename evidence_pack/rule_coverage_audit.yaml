aabb_transfusion:
  guideline_name: AABB 2024 RBC Transfusion Guidelines
  total_nodes: 4
  total_unconditional_forbidden: 8
  total_sequence_rules: 1
  total_conditional_rules: 7
  rules_by_severity:
    CRITICAL: 4
    HIGH: 3
    MODERATE: 0
    LOW: 0
  rules_by_type:
    FORBIDDEN: 5
    REQUIRED: 2
    BEFORE: 0
    WITHIN: 0
  rules:
  - rule_id: TRANS-CARDIAC-LIBERAL-THRESHOLD
    node_id: restrictive_threshold
    condition: '''acute_coronary_syndrome'' in patient.comorbidities or ''symptomatic_cad'' in patient.comorbidities'
    effect_type: REQUIRED
    actions:
    - apply_liberal_threshold_hb_8
    - transfuse_if_hb_below_8
    evidence: AABB 2024; MINT Trial, NEJM 2023
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: TRANS-CARDIAC-LIBERAL-THRESHOLD-FORBIDDEN
    node_id: restrictive_threshold
    condition: '''acute_coronary_syndrome'' in patient.comorbidities or ''symptomatic_cad'' in patient.comorbidities'
    effect_type: FORBIDDEN
    actions:
    - use_liberal_transfusion_threshold_cardiac
    - transfuse_for_hb_above_8_in_cardiac
    evidence: AABB 2024; TRICC trial; restrictive threshold (Hb < 8) is preferred in cardiac patients to reduce TACO/fluid
      overload
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: TRANS-STABLE-NO-TRANSFUSE-ABOVE-7
    node_id: restrictive_threshold
    condition: patient.labs.get('hemoglobin', 99) >= 7 and 'hemodynamically_stable' in patient.get('presentation', {})
    effect_type: FORBIDDEN
    actions:
    - transfuse_prbc
    - order_transfusion
    evidence: AABB 2024; TRICC Trial, Hebert 1999 NEJM
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.labs.hemoglobin
    - patient.presentation
  - rule_id: TRANS-TXA-WITHIN-3H
    node_id: massive_transfusion
    condition: patient.presentation.get('time_since_injury_hours', 0) > 3
    effect_type: FORBIDDEN
    actions:
    - give_tranexamic_acid
    evidence: CRASH-2 Trial, Lancet 2010 - TXA >3h increases mortality
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.presentation.time_since_injury_hours
  - rule_id: TRANS-JEHOVAH-NO-BLOOD
    node_id: massive_transfusion
    condition: '''jehovah_witness'' in patient.get(''preferences'', []) or ''refuses_blood_products'' in patient.get(''preferences'',
      [])'
    effect_type: FORBIDDEN
    actions:
    - give_prbc
    - give_ffp
    - give_platelets
    - give_whole_blood
    evidence: Patient autonomy; AABB ethical guidelines
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.preferences
  - rule_id: TRANS-ANAPHYLAXIS-EPI
    node_id: transfusion_reaction
    condition: '''anaphylactic_transfusion_reaction'' in patient.get(''presentation'', {})'
    effect_type: REQUIRED
    actions:
    - give_epinephrine_im
    - stop_transfusion_immediately
    evidence: AABB 2024 Transfusion Reaction Management
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.presentation
  - rule_id: TRANS-ANAPHYLAXIS-EPI-FORBIDDEN
    node_id: transfusion_reaction
    condition: '''anaphylactic_transfusion_reaction'' in patient.get(''presentation'', {})'
    effect_type: FORBIDDEN
    actions:
    - continue_transfusion_during_anaphylaxis
    - give_only_antihistamine_for_transfusion_anaphylaxis
    evidence: AABB 2024; transfusion anaphylaxis requires immediate stop and epinephrine; antihistamines alone are insufficient
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.presentation
aba_burn_resuscitation:
  guideline_name: ABA 2024 Burn Resuscitation Guidelines
  total_nodes: 6
  total_unconditional_forbidden: 8
  total_sequence_rules: 6
  total_conditional_rules: 7
  rules_by_severity:
    CRITICAL: 4
    HIGH: 3
    MODERATE: 0
    LOW: 0
  rules_by_type:
    FORBIDDEN: 4
    REQUIRED: 3
    BEFORE: 0
    WITHIN: 0
  rules:
  - rule_id: BURN-PEDIATRIC-DEXTROSE
    node_id: fluid_resuscitation
    condition: patient.age < 5
    effect_type: REQUIRED
    actions:
    - add_dextrose_to_iv
    - monitor_glucose_q4h
    evidence: ABA 2024; ISBI Pediatric Burns Chapter
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.age
  - rule_id: BURN-PEDIATRIC-DEXTROSE-FORBIDDEN
    node_id: fluid_resuscitation
    condition: patient.age < 5
    effect_type: FORBIDDEN
    actions:
    - withhold_glucose_monitoring_pediatric_burn
    - give_dextrose_free_fluid_only_pediatric_burn
    evidence: ABA Burn Guidelines 2023; pediatric patients have limited glycogen reserves; hypoglycemia causes seizures and
      brain injury
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.age
  - rule_id: BURN-OVERRESUS-LIMIT
    node_id: fluid_resuscitation
    condition: patient.presentation.get('tbsa_percent', 0) > 40
    effect_type: FORBIDDEN
    actions:
    - exceed_6ml_kg_tbsa_in_24h
    evidence: ABA 2024; Saffle JR, J Burn Care Res 2007 - fluid creep
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.presentation.tbsa_percent
  - rule_id: BURN-CYANIDE-HYDROXOCOBALAMIN
    node_id: inhalation_injury
    condition: '''enclosed_space_fire'' in patient.get(''history'', [])'
    effect_type: REQUIRED
    actions:
    - give_hydroxocobalamin
    - order_cyanide_level
    evidence: ABA 2024; Baud FJ, NEJM 1991
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.history
  - rule_id: BURN-CYANIDE-HYDROXOCOBALAMIN-FORBIDDEN
    node_id: inhalation_injury
    condition: '''enclosed_space_fire'' in patient.get(''history'', [])'
    effect_type: FORBIDDEN
    actions:
    - give_sodium_nitrite_in_cyanide_burn
    - delay_cyanide_antidote_for_level
    evidence: ABA Burn Guidelines 2023; sodium nitrite induces methemoglobinemia compounding carbon monoxide poisoning in
      burn patients
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.history
  - rule_id: BURN-CHEST-ESCHAR-VENTILATION
    node_id: escharotomy
    condition: '''circumferential_chest_burn'' in patient.get(''exam_findings'', [])'
    effect_type: REQUIRED
    actions:
    - perform_chest_escharotomy
    - monitor_ventilation_pressures
    evidence: ABA 2024; ISBI 2024 Escharotomy Chapter
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.exam_findings
  - rule_id: BURN-CHEST-ESCHAR-VENTILATION-FORBIDDEN
    node_id: escharotomy
    condition: '''circumferential_chest_burn'' in patient.get(''exam_findings'', [])'
    effect_type: FORBIDDEN
    actions:
    - delay_escharotomy_for_imaging
    - increase_ventilator_pressure_without_escharotomy
    evidence: ABA Burn Guidelines 2023; circumferential chest eschar causes restrictive ventilatory failure requiring emergent
      release
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.exam_findings
acls_cardiac_arrest:
  guideline_name: AHA ACLS Cardiac Arrest Management
  total_nodes: 6
  total_unconditional_forbidden: 12
  total_sequence_rules: 5
  total_conditional_rules: 24
  rules_by_severity:
    CRITICAL: 12
    HIGH: 12
    MODERATE: 0
    LOW: 0
  rules_by_type:
    FORBIDDEN: 17
    REQUIRED: 6
    BEFORE: 1
    WITHIN: 0
  rules:
  - rule_id: ACLS-SHOCKABLE-NO-ATROPINE
    node_id: shockable_pathway
    condition: 'True'
    effect_type: FORBIDDEN
    actions:
    - give_atropine_for_cardiac_arrest
    evidence: AHA ACLS 2025 Section 5.1; AHA removed atropine from ACLS algorithm in 2010
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-SHOCKABLE-NO-CALCIUM-WITHOUT-INDICATION
    node_id: shockable_pathway
    condition: patient.labs.get('potassium', 4.0) <= 6.5
    effect_type: FORBIDDEN
    actions:
    - give_calcium_without_indication
    evidence: AHA ACLS 2025 Section 6.2; calcium indicated only for hyperkalemia or calcium channel blocker toxicity
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.labs.potassium
  - rule_id: ACLS-SHOCKABLE-NO-BICARB-ROUTINE
    node_id: shockable_pathway
    condition: patient.labs.get('ph', 7.35) > 7.1
    effect_type: FORBIDDEN
    actions:
    - give_sodium_bicarbonate_routine
    evidence: AHA ACLS 2025 Section 6.2; bicarbonate only for severe acidosis (pH <7.1) or hyperkalemia
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.labs.ph
  - rule_id: ACLS-SHOCKABLE-DEFIB-FIRST
    node_id: shockable_pathway
    condition: '''vf'' in patient.cardiac_rhythm or ''pvt'' in patient.cardiac_rhythm'
    effect_type: BEFORE
    actions:
    - deliver_defibrillation
    - give_epinephrine_1mg_iv
    evidence: AHA 2025 Section 5.1; Kudenchuk PJ, NEJM 2016
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-SHOCKABLE-DEFIB-FIRST-FORBIDDEN
    node_id: shockable_pathway
    condition: '''vf'' in patient.cardiac_rhythm or ''pvt'' in patient.cardiac_rhythm'
    effect_type: FORBIDDEN
    actions:
    - give_amiodarone_before_first_shock
    - delay_defibrillation_for_intubation
    evidence: AHA ACLS 2020; defibrillation is the definitive treatment for VF/pVT; each minute delay reduces survival by
      7-10%
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-HYPERKALEMIA-CALCIUM
    node_id: shockable_pathway
    condition: patient.labs.potassium > 6.5
    effect_type: REQUIRED
    actions:
    - give_calcium_chloride
    - give_sodium_bicarbonate
    - give_insulin_dextrose
    evidence: 'AHA 2025 Section 6.2: Reversible Causes; Montague BT, Resuscitation 2008'
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.labs.potassium
  - rule_id: ACLS-HYPERKALEMIA-CALCIUM-FORBIDDEN
    node_id: shockable_pathway
    condition: patient.labs.potassium > 6.5
    effect_type: FORBIDDEN
    actions:
    - give_succinylcholine_in_hyperkalemic_arrest
    - delay_calcium_in_hyperkalemic_arrest
    evidence: AHA ACLS 2020; succinylcholine releases K+ from muscle; calcium delay prolongs cardiac toxicity window
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.labs.potassium
  - rule_id: ACLS-HYPOTHERMIA-NO-DRUGS
    node_id: shockable_pathway
    condition: patient.vitals.temperature < 30
    effect_type: FORBIDDEN
    actions:
    - give_epinephrine_1mg_iv
    - give_amiodarone_300mg
    - give_lidocaine_alternative
    evidence: 'AHA 2025 Section 6.4: Hypothermic Arrest; Brown DJA, NEJM 2012'
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.vitals.temperature
  - rule_id: ACLS-TENSION-PNEUMO-DECOMPRESS
    node_id: shockable_pathway
    condition: '''tension_pneumothorax'' in patient.comorbidities'
    effect_type: REQUIRED
    actions:
    - needle_decompression
    evidence: 'AHA 2025 Section 6.2: Hs and Ts; Roberts DJ, Injury 2014'
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-TENSION-PNEUMO-DECOMPRESS-FORBIDDEN
    node_id: shockable_pathway
    condition: '''tension_pneumothorax'' in patient.comorbidities'
    effect_type: FORBIDDEN
    actions:
    - delay_needle_decompression_for_xray_in_arrest
    - give_only_epinephrine_in_tension_pneumo_arrest
    evidence: AHA ACLS 2020; tension pneumothorax in arrest requires immediate needle decompression; medications alone cannot
      resolve obstruction
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-SHOCKABLE-NO-BICARB-ADDITIONAL
    node_id: shockable_pathway
    condition: '''shockable_rhythm'' in patient.comorbidities or ''vfib'' in patient.comorbidities or ''vtach'' in patient.comorbidities'
    effect_type: FORBIDDEN
    actions:
    - give_routine_bicarbonate_in_shockable_arrest
    - delay_defibrillation_for_bicarbonate_push
    evidence: AHA ACLS 2020; routine sodium bicarbonate is not recommended in shockable arrest; it delays defibrillation and
      worsens intracellular acidosis
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-NONSHOCKABLE-NO-BICARB-ADDITIONAL
    node_id: shockable_pathway
    condition: '''nonshockable_rhythm'' in patient.comorbidities or ''pea'' in patient.comorbidities or ''asystole'' in patient.comorbidities'
    effect_type: FORBIDDEN
    actions:
    - give_routine_bicarbonate_in_nonshockable_arrest
    - substitute_bicarbonate_for_epinephrine_in_pea
    evidence: AHA ACLS 2020; routine bicarbonate not indicated in PEA/asystole
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-NONSHOCKABLE-NO-ATROPINE
    node_id: non_shockable_pathway
    condition: '''asystole'' in patient.cardiac_rhythm or ''pea'' in patient.cardiac_rhythm'
    effect_type: FORBIDDEN
    actions:
    - give_atropine_for_asystole
    evidence: AHA ACLS 2025 Section 5.2; atropine removed from asystole/PEA algorithm in 2010
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-NONSHOCKABLE-NO-DEFIB-ASYSTOLE
    node_id: non_shockable_pathway
    condition: '''asystole'' in patient.cardiac_rhythm'
    effect_type: FORBIDDEN
    actions:
    - deliver_defibrillation_asystole
    evidence: AHA ACLS 2025 Section 5.2; defibrillation has no role in asystole
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-NONSHOCKABLE-NO-AMIODARONE-ASYSTOLE
    node_id: non_shockable_pathway
    condition: '''asystole'' in patient.cardiac_rhythm or ''pea'' in patient.cardiac_rhythm'
    effect_type: FORBIDDEN
    actions:
    - give_amiodarone_for_asystole
    evidence: AHA ACLS 2025 Section 5.2; amiodarone is an antiarrhythmic for refractory VF/pVT only
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-NONSHOCKABLE-NO-BICARB-ROUTINE
    node_id: non_shockable_pathway
    condition: patient.labs.get('ph', 7.35) > 7.1
    effect_type: FORBIDDEN
    actions:
    - give_sodium_bicarbonate_routine
    evidence: AHA ACLS 2025 Section 6.2; bicarbonate only for severe acidosis (pH <7.1) or hyperkalemia
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.labs.ph
  - rule_id: ACLS-NONSHOCKABLE-EPI-IMMEDIATE
    node_id: non_shockable_pathway
    condition: '''asystole'' in patient.cardiac_rhythm or ''pea'' in patient.cardiac_rhythm'
    effect_type: REQUIRED
    actions:
    - give_epinephrine_1mg_iv_immediately
    evidence: AHA 2025 Section 5.2; Perkins GD, NEJM 2018 (PARAMEDIC2)
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.cardiac_rhythm
  - rule_id: ACLS-TAMPONADE-PERICARDIOCENTESIS
    node_id: non_shockable_pathway
    condition: '''cardiac_tamponade'' in patient.comorbidities'
    effect_type: REQUIRED
    actions:
    - pericardiocentesis
    evidence: 'AHA 2025 Section 6.2: Hs and Ts; Budhram GR, Acad Emerg Med 2019'
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-TAMPONADE-PERICARDIOCENTESIS-FORBIDDEN
    node_id: non_shockable_pathway
    condition: '''cardiac_tamponade'' in patient.comorbidities'
    effect_type: FORBIDDEN
    actions:
    - delay_pericardiocentesis_for_imaging_in_arrest
    - give_vasopressors_only_in_tamponade_arrest
    evidence: AHA ACLS 2020; cardiac tamponade in arrest requires immediate pericardiocentesis; vasopressors alone cannot
      overcome obstruction
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-OPIOID-NALOXONE
    node_id: non_shockable_pathway
    condition: '''opioid_suspected'' in patient.comorbidities or ''opioid_overdose'' in patient.history'
    effect_type: REQUIRED
    actions:
    - give_naloxone
    evidence: 'AHA 2025 Section 6.5: Opioid-Related Arrest; Panchal AR, Circulation 2020'
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-OPIOID-NALOXONE-FORBIDDEN
    node_id: non_shockable_pathway
    condition: '''opioid_suspected'' in patient.comorbidities or ''opioid_overdose'' in patient.history'
    effect_type: FORBIDDEN
    actions:
    - give_additional_opioid_during_arrest
    - give_long_acting_sedative_during_arrest
    evidence: AHA ACLS 2020; additional CNS depressants worsen arrest prognosis
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-PREGNANCY-PERIMORTEM-CSECTION
    node_id: non_shockable_pathway
    condition: '''pregnancy'' in patient.comorbidities'
    effect_type: REQUIRED
    actions:
    - prepare_perimortem_cesarean
    - perform_left_uterine_displacement
    evidence: 'AHA 2025 Section 6.6: Cardiac Arrest in Pregnancy; Jeejeebhoy FM, Circulation 2015'
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-PREGNANCY-PERIMORTEM-FORBIDDEN
    node_id: non_shockable_pathway
    condition: '''pregnancy'' in patient.comorbidities'
    effect_type: FORBIDDEN
    actions:
    - delay_perimortem_csection_beyond_4min
    - place_pregnant_arrest_patient_supine
    evidence: AHA ACLS 2020; perimortem C-section within 4 min of arrest; aortocaval compression reduces CPR efficacy
    severity: CRITICAL
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.comorbidities
  - rule_id: ACLS-POST-NO-EARLY-NEUROPROG
    node_id: post_cardiac_arrest_care
    condition: 'True'
    effect_type: FORBIDDEN
    actions:
    - neuroprognosticate_before_72h
    evidence: AHA ACLS 2025 Section 7; Sandroni C, Intensive Care Med 2014
    severity: HIGH
    has_trigger_range: true
    has_normal_range: true
    condition_variables:
    - patient.vitals.time_since_rosc
