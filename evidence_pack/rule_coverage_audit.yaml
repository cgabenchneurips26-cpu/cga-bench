ada_dka_management:
  guideline_name: ADA Diabetic Ketoacidosis Management
  total_nodes: 8
  total_unconditional_forbidden: 19
  total_sequence_rules: 12
  total_conditional_rules: 17
  rules_by_severity:
    CRITICAL: 8
    HIGH: 9
    MODERATE: 0
    LOW: 0
  rules_by_type:
    FORBIDDEN: 14
    REQUIRED: 3
    BEFORE: 0
    WITHIN: 0
  rules:
  - rule_id: DKA-EUGLY-SGLT2-DEXTROSE
    node_id: initial_assessment
    condition: '''sglt2_inhibitor'' in patient.medications'
    effect_type: REQUIRED
    actions:
    - add_dextrose_to_iv
    - stop_sglt2_inhibitor
    evidence: ADA 2024, Section 16.2; FDA Safety Communication 2015
