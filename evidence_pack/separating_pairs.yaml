description: |
  Separating-pair witness catalogue for evaluator audit harness.
  Each pair consists of two episodes that share the same projection
  under a specific pi-class but differ in clinical safety.

  Terminology:
    episode_a  — the safe trace   (expected_verdict_a: true)
    episode_b  — the harmful trace (expected_verdict_b: false)

  Case i   (terminal-blind, pi_term):  Both episodes reach the same terminal
            state/reason but differ in whether a time-critical action was
            delivered within its deadline.  A terminal-only evaluator that
            inspects only the final disposition cannot distinguish them.

  Case ii  (action-set-blind, pi_aset):  Both episodes contain the same
            multiset of action_ids but the harmful trace violates a BEFORE
            sequence constraint (e.g., antibiotics before LP).  An evaluator
            that projects away ordering cannot distinguish them.

  Case iii (order-blind, pi_nord):  Both episodes share the same ordered
            action sequence but differ only in the wall-clock timestamp of
            one critical action.  An evaluator that ignores timing cannot
            distinguish them.

  Case iv  (context-blind, pi_nctx):  Both episodes share the same
            (action, timestamp_bin) tuples but differ because of a
            patient-specific contraindication (FORBIDDEN action triggered
            by allergy, comorbidity, or clinical context).  An evaluator
            that strips patient context cannot distinguish them.

  Episode IDs are sourced from evidence_pack/analysis/verdict_matrix_v6.json.
  W8 corpus note: DeepSeek-R1-7B episodes are excluded from the W8 14,826-
  episode corpus.  Pairs that include a DeepSeek episode are still valid
  witnesses; the separation property holds regardless of model identity.

  Violation type vocabulary (maps to viol_types field in verdict_matrix_v6):
    TIMING    -> WITHIN constraint exceeded (deadline-based)
    SEQUENCE  -> BEFORE constraint violated (ordering-based)
    COMMISSION -> FORBIDDEN action performed (context-dependent)

