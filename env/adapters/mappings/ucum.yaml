# UCUM (Unified Code for Units of Measure) Mappings
# Raw unit string (lowercase) -> UCUM canonical form
#
# Reference: http://unitsofmeasure.org/
# ISO 11240 compliant
#
# Format: "raw_unit": "UCUM_code"

concentration:
  "mg/dl": "mg/dL"
  "mg/l": "mg/L"
  "g/dl": "g/dL"
  "g/l": "g/L"
  "ug/dl": "ug/dL"
  "ug/l": "ug/L"
  "ng/dl": "ng/dL"
  "ng/l": "ng/L"
  "ng/ml": "ng/mL"
  "pg/ml": "pg/mL"
  "ug/ml": "ug/mL"
  "mg/ml": "mg/mL"
  "mmol/l": "mmol/L"
  "umol/l": "umol/L"
  "nmol/l": "nmol/L"
  "meq/l": "meq/L"
  "meq/L": "meq/L"
  "mEq/l": "meq/L"
  "mEq/L": "meq/L"
  "iu/l": "U/L"
  "u/l": "U/L"
  "iu/ml": "U/mL"
  "u/ml": "U/mL"

cell_counts:
  "cells/ul": "10*3/uL"
  "cells/mcl": "10*3/uL"
  "10^3/ul": "10*3/uL"
  "10^3/mcl": "10*3/uL"
  "10^6/ul": "10*6/uL"
  "10^6/mcl": "10*6/uL"
  "k/ul": "10*3/uL"
  "k/mcl": "10*3/uL"
  "m/ul": "10*6/uL"
  "/ul": "/uL"
  "/mcl": "/uL"

percentage:
  "%": "%"
  "percent": "%"

temperature:
  "degc": "Cel"
  "celsius": "Cel"
  "deg c": "Cel"
  "degf": "[degF]"
  "fahrenheit": "[degF]"

pressure:
  "mmhg": "mm[Hg]"
  "mm hg": "mm[Hg]"
  "cmh2o": "cm[H2O]"
  "cm h2o": "cm[H2O]"

time:
  "sec": "s"
  "seconds": "s"
  "min": "min"
  "minutes": "min"
  "hr": "h"
  "hours": "h"
  "h": "h"

rate:
  "ml/hr": "mL/h"
  "ml/h": "mL/h"
  "ml/min": "mL/min"
  "l/min": "L/min"
  "mcg/kg/min": "ug/kg/min"
  "mg/kg/hr": "mg/kg/h"
  "units/hr": "U/h"
  "units/h": "U/h"

volume:
  "ml": "mL"
  "l": "L"
  "dl": "dL"
  "ul": "uL"
  "mcl": "uL"

mass:
  "mg": "mg"
  "g": "g"
  "kg": "kg"
  "mcg": "ug"
  "ug": "ug"
  "ng": "ng"
  "pg": "pg"

moles:
  "mmol": "mmol"
  "umol": "umol"
  "nmol": "nmol"
  "mol": "mol"
  "meq": "meq"

osmolality:
  "mosm/kg": "mosm/kg"
  "mosm/l": "mosm/L"

special:
  "ph": "[pH]"
  "beats/min": "/min"
  "bpm": "/min"
  "breaths/min": "/min"
  "/min": "/min"
  "inr": "{INR}"
  "ratio": "{ratio}"
  "titer": "{titer}"
  "copies/ml": "{copies}/mL"
  "miu/ml": "m[IU]/mL"
